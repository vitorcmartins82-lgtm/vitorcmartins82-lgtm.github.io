<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central da Obra — GM.MG.00083 — Priner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --graphite:#0f413e; --graphite2:#145048; --line:#1d6058;
    --paper:#f5f6f4; --card:#ffffff; --ink:#1c2128; --muted:#6b7480;
    --amber:#97d700; --amber-d:#5c7d00; --steel:#2f6f8f; --steel-l:#e4eef3;
    --green:#2f8f57; --green-l:#e3f2ea; --red:#c0392b; --red-l:#fbe7e4;
    --shadow:0 1px 2px rgba(28,33,40,.06),0 4px 14px rgba(28,33,40,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink);line-height:1.45;font-size:15px}
  h1,h2,h3{letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit;font-size:15px}
  a{color:inherit}
  .app{display:flex;min-height:100vh}
  .nav{width:212px;background:var(--graphite);color:#c7ccd3;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#3a4854 var(--graphite)}
  .nav::-webkit-scrollbar{width:8px}
  .nav::-webkit-scrollbar-track{background:var(--graphite)}
  .nav::-webkit-scrollbar-thumb{background:#3a4854;border-radius:4px}
  .brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
  .brand b{color:#fff;font-size:17px;font-weight:700;letter-spacing:.02em;display:block;text-transform:uppercase}
  .brand span{font-size:11px;color:var(--amber);letter-spacing:.14em;text-transform:uppercase}
  .nav a.mi{display:flex;align-items:center;gap:10px;padding:11px 18px;color:#c7ccd3;font-size:14px;border-left:3px solid transparent;cursor:pointer;transition:.12s}
  .nav a.mi:hover{background:var(--graphite2);color:#fff}
  .nav a.mi.on{background:var(--graphite2);color:#fff;border-left-color:var(--amber)}
  .nav a.mi .ic{width:20px;text-align:center;font-size:15px}
  .nav .sec{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#6b7480;padding:14px 18px 6px}
  .nav .foot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);font-size:11px;color:#7b8593}
  .main{flex:1;min-width:0;padding:26px 30px 60px}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .head h1{font-size:24px;font-weight:700}
  .head p{color:var(--muted);font-size:13px;margin-top:3px}
  .head .acts{display:flex;gap:10px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:8px;font-size:14px;font-weight:600;transition:.12s;white-space:nowrap}
  .btn-a{background:var(--amber);color:#0d2e2b} .btn-a:hover{background:var(--amber-d);color:#fff}
  .btn-s{background:var(--graphite);color:#fff} .btn-s:hover{background:#000}
  .btn-g{background:#eef0ee;color:var(--ink)} .btn-g:hover{background:#e2e5e2}
  .btn-sm{padding:6px 11px;font-size:13px;border-radius:7px}
  .grid{display:grid;gap:14px}
  .stats{grid-template-columns:repeat(auto-fit,minmax(148px,1fr));margin-bottom:22px}
  .stat{background:var(--card);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);border:1px solid #edefec}
  .stat .n{font-size:30px;font-weight:800;letter-spacing:-.02em}
  .stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
  .stat.amber .n{color:var(--amber-d)} .stat.steel .n{color:var(--steel)} .stat.green .n{color:var(--green)} .stat.red .n{color:var(--red)}
  .panel{background:var(--card);border-radius:12px;box-shadow:var(--shadow);border:1px solid #edefec;margin-bottom:20px;overflow:hidden}
  .panel h2{font-size:15px;padding:14px 18px;border-bottom:1px solid #eef0ec;display:flex;align-items:center;gap:8px;justify-content:space-between}
  .panel h2 .t{display:flex;align-items:center;gap:8px}
  .tbl{width:100%;border-collapse:collapse;font-size:14px}
  .tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:9px 18px;border-bottom:1px solid #eef0ec;font-weight:600;white-space:nowrap}
  .tbl td{padding:11px 18px;border-bottom:1px solid #f2f3f1;vertical-align:middle}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tr:hover td{background:#fafbf9}
  .tbl .rowact{display:flex;gap:6px}
  .num{font-variant-numeric:tabular-nums}
  .tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
  .t-green{background:var(--green-l);color:var(--green)} .t-amber{background:#fdf0d6;color:var(--amber-d)}
  .t-red{background:var(--red-l);color:var(--red)} .t-steel{background:var(--steel-l);color:var(--steel)} .t-grey{background:#eef0ee;color:var(--muted)}
  .empty{text-align:center;padding:38px 20px;color:var(--muted)}
  .empty .big{font-size:34px;margin-bottom:8px} .empty p{font-size:14px;margin-bottom:14px}
  .alert{display:flex;gap:12px;align-items:flex-start;padding:12px 18px;border-bottom:1px solid #f2f3f1}
  .alert:last-child{border-bottom:none}
  .alert .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex-shrink:0}
  .alert .txt b{font-weight:600} .alert .txt small{display:block;color:var(--muted);font-size:12.5px}
  .ov{position:fixed;inset:0;background:rgba(20,24,29,.5);display:none;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:50}
  .ov.on{display:flex}
  .modal{background:var(--card);border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto}
  .modal-h{padding:18px 22px;border-bottom:1px solid #eef0ec;display:flex;justify-content:space-between;align-items:center}
  .modal-h h3{font-size:17px} .modal-h .x{font-size:22px;color:var(--muted);width:32px;height:32px;border-radius:8px} .modal-h .x:hover{background:#f0f1ef}
  .modal-b{padding:20px 22px;max-height:72vh;overflow:auto}
  .modal-f{padding:14px 22px;border-top:1px solid #eef0ec;display:flex;justify-content:flex-end;gap:10px}
  .fg{margin-bottom:15px}
  .fg label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:#3a424d}
  .fg label .opt{color:var(--muted);font-weight:400}
  .fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border:1px solid #d5d9d3;border-radius:8px;background:#fcfdfb;transition:.12s}
  .fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--steel);background:#fff;box-shadow:0 0 0 3px var(--steel-l)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .hint{font-size:12px;color:var(--muted);margin-top:5px}
  .sub{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:18px 0 10px;border-bottom:1px solid #eef0ec;padding-bottom:6px}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .toolbar input[type=search]{flex:1;min-width:180px;padding:9px 13px;border:1px solid #d5d9d3;border-radius:8px;background:#fff}
  .toolbar select{padding:9px 13px;border:1px solid #d5d9d3;border-radius:8px;background:#fff}
  .break{font-size:13px;color:var(--muted);line-height:1.8} .break b{color:var(--ink)}
  .minibar{height:7px;background:#eef0ee;border-radius:4px;overflow:hidden;margin-top:4px;width:120px}
  .minibar i{display:block;height:100%;background:var(--amber)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--graphite);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.3)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .logi{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;padding:16px 18px}
  .loc{border:1px solid #e6e8e4;border-radius:11px;padding:14px}
  .loc .lt{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:4px;color:var(--muted)}
  .loc b{font-size:15px} .loc address{font-style:normal;font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
  .loc .cap{font-size:12px;color:var(--muted);margin-top:8px}
  .cbx{position:relative}
  .cbx-list{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid #d5d9d3;border-top:none;border-radius:0 0 8px 8px;max-height:240px;overflow:auto;z-index:5;box-shadow:0 10px 24px rgba(0,0,0,.12);display:none}
  .cbx-list.on{display:block}
  .cbx-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid #f2f3f1}
  .cbx-item:hover{background:var(--steel-l)} .cbx-item b{font-weight:600} .cbx-item small{display:block;color:var(--muted);font-size:12.5px}
  .picked{background:var(--steel-l);border:1px solid #cfe1ea;border-radius:9px;padding:11px 13px;margin-top:8px;font-size:13.5px}
  .picked b{font-weight:600} .picked .pl{color:var(--muted);font-size:12px}
  .ro-banner{background:var(--graphite);color:#fff;padding:9px 16px;font-size:13px;display:flex;align-items:center;gap:10px;justify-content:center;border-radius:10px}
  .ro-banner .tag{background:var(--amber);color:#0d2e2b}
  .urgente-row td{background:#fff8ec!important;border-left:4px solid var(--amber)}
  .step{display:flex;align-items:center;flex-wrap:wrap;gap:0;margin:12px 0 18px}
  .step .s{padding:7px 12px;border-radius:20px;font-size:12.5px;font-weight:600;background:#eef0ee;color:var(--muted);white-space:nowrap}
  .step .s.done{background:var(--green-l);color:var(--green)}
  .step .s.cur{background:var(--amber);color:#0d2e2b}
  .step .arrow{color:#c7ccd3;padding:0 4px}
  @media(max-width:820px){
    .app{flex-direction:column}
    .nav{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto}
    .brand,.nav .foot,.nav .sec{display:none}
    .nav a.mi{border-left:none;border-bottom:3px solid transparent;padding:12px 13px;white-space:nowrap}
    .nav a.mi.on{border-left:none;border-bottom-color:var(--amber)}
    .nav a.mi span.lbl{display:none}
    .nav a.mi .ic{font-size:19px}
    .main{padding:18px 16px 60px}
    .head h1{font-size:20px} .row2,.row3{grid-template-columns:1fr}
    .tblwrap{overflow-x:auto}
  }
</style>
</head>

function vPainel(){const ativos=DB.func.filter(ativo);const emHotel=DB.mov.filter(m=>!m.saida&&m.tipo==="Hotel").length;const emAloj=DB.mov.filter(m=>!m.saida&&m.tipo==="Alojamento").length;const totalP=ativos.length||1;const locaisCount=ativos.filter(f=>{const m=estadiaAtual(f.id);return !m||m.tipo==="Local";}).length;const alojadosCount=ativos.length-locaisCount;const pctLocal=((locaisCount/totalP)*100).toFixed(0);const pctAlojado=((alojadosCount/totalP)*100).toFixed(0);const modCount=ativos.filter(f=>f.classificacao==="MOD").length;const moiCount=ativos.filter(f=>f.classificacao==="MOI").length;const alerts=[];ativos.forEach(f=>{const s=saldoBaixada(f.id);if(s.saldo>=DB.cfg.alertaBaixada)alerts.push({c:"var(--amber)",b:f.nome+" — baixada disponível",s:s.saldo+" dias acumulados. Programar viagem."});else if(s.faltamDias!==null&&s.faltamDias<=DB.cfg.alertaAntecedenciaDias)alerts.push({c:"var(--steel)",b:f.nome+" — baixada se aproximando",s:"Faltam ~"+s.faltamDias+" dias corridos pra completar "+DB.cfg.alertaBaixada+" dias (hoje: "+s.saldo+")."});const ex=expStatus(f);if(ex.alerta)alerts.push({c:"var(--red)",b:f.nome+" — experiência vencendo",s:ex.txt+": faltam "+ex.rest+" dia(s) para decidir."});});ativos.filter(f=>{const m=estadiaAtual(f.id);return !m;}).forEach(f=>alerts.push({c:"var(--muted)",b:f.nome+" — sem hospedagem lançada",s:"Ativo, mas sem alojamento/hotel/local registrado."}));
  const duplicados=[];ativos.forEach(f=>{const abertas=DB.mov.filter(m=>m.func===f.id&&!m.saida&&(m.tipo==="Alojamento"||m.tipo==="Hotel"||m.tipo==="Local"));if(abertas.length>1)duplicados.push({f,abertas});});
  duplicados.forEach(({f,abertas})=>alerts.unshift({c:"var(--red)",b:"⚠ "+f.nome+" — "+abertas.length+" movimentações abertas ao mesmo tempo",s:"Tipos: "+abertas.map(m=>m.tipo+(m.local?" ("+localNome(m.local)+")":"")).join(", ")+". Isso pode estar inflando as contagens — feche as antigas em Movimentações."}));
  main.innerHTML=`<div class="head"><div><h1>Painel da Obra</h1><p>GM.MG.00083 — Vale — Nova Lima · Situação de hoje — ${fmt(iso(today()))}</p></div><div class="acts"><button class="btn btn-g" onclick="doBackup()">⭳ Backup</button><button class="btn btn-g" onclick="exportExcel()">⭳ Excel</button><button class="btn btn-a" onclick="formFunc()">＋ Novo funcionário</button></div></div>
   <div class="grid stats"><div class="stat steel"><div class="n">${ativos.length}</div><div class="l">Ativos na obra</div></div><div class="stat"><div class="n">${emAloj}</div><div class="l">Em alojamento</div></div><div class="stat"><div class="n">${emHotel}</div><div class="l">Em hotel</div></div><div class="stat amber"><div class="n">${alerts.filter(a=>a.c.includes("amber")).length}</div><div class="l">Baixadas p/ programar</div></div></div>
   <div class="grid stats"><div class="stat"><div class="n">${locaisCount}</div><div class="l">Locais (${pctLocal}%)</div></div><div class="stat green"><div class="n">${alojadosCount}</div><div class="l">Alojados/Hotel (${pctAlojado}%)</div></div><div class="stat steel"><div class="n">${modCount}</div><div class="l">MOD — mão de obra direta</div></div><div class="stat amber"><div class="n">${moiCount}</div><div class="l">MOI — mão de obra indireta</div></div></div>
   <div class="panel"><h2><span class="t">⚑ Quem está onde <span class="tag t-grey">${ativos.length} ativos</span></span><button class="btn btn-a btn-sm" onclick="formMov()">＋ Nova movimentação</button></h2><div class="tblwrap">${tabelaQuemOnde(ativos)}</div></div>
   <div class="panel"><h2><span class="t">🔔 Alertas <span class="tag ${alerts.length?'t-amber':'t-green'}">${alerts.length}</span></span></h2>${alerts.length?alerts.map(a=>`<div class="alert"><span class="dot" style="background:${a.c}"></span><div class="txt"><b>${esc(a.b)}</b><small>${esc(a.s)}</small></div></div>`).join(""):`<div class="empty"><div class="big">✓</div><p>Nenhum alerta no momento.</p></div>`}</div>`;}
function tabelaQuemOnde(ativosIn){const ativos=porNome(ativosIn);if(!ativos.length)return `<div class="empty"><div class="big">🚧</div><p>Nenhum funcionário ativo ainda.</p><button class="btn btn-a" onclick="formFunc()">Cadastrar o primeiro</button></div>`;return `<table class="tbl"><thead><tr><th>Funcionário</th><th>Tipo</th><th>Local atual</th><th>Tempo lá</th><th>Saldo baixada</th></tr></thead><tbody>${ativos.map(f=>{const m=estadiaAtual(f.id);const s=saldoBaixada(f.id);return `<tr><td><b>${esc(f.nome)}</b><br><small style="color:var(--muted)">${esc(f.funcao||"—")}${f.matricula?" · mat. "+esc(f.matricula):""}</small></td><td>${m?`<span class="tag ${tagTipoMov(m.tipo)}">${m.tipo}</span>`:`<span class="tag t-grey">sem local</span>`}</td><td>${esc(m?localNome(m.local):"—")}</td><td class="num">${m?humano(diasEntre(pd(m.entrada),today())+1):"—"}</td><td class="num"><b>${s.saldo}</b> ${s.saldo>=DB.cfg.alertaBaixada?'<span class="tag t-amber">✓ viajar</span>':''}</td></tr>`;}).join("")}</tbody></table>`;}
let fFiltro="",fStatus="ativo",fFuncao="",fAloj="",fAdmDe="",fAdmAte="";

  const funcoes=[...new Set(DB.func.map(f=>f.funcao).filter(Boolean))].sort();

     <select id="faloj"><option value="">Todos os locais</option>${alojamentos.map(l=>`<option value="${l.id}">${esc(l.nome)}</option>`).join("")}<option value="__semlocal">Sem local / vem direto</option></select></div>
   <div class="toolbar"><span class="hint">Admissão de</span><input type="date" id="fadmde" style="max-width:160px"><span class="hint">até</span><input type="date" id="fadmate" style="max-width:160px"><button class="btn btn-g btn-sm" onclick="limparFiltrosFunc()">Limpar filtros</button></div>
   <div class="panel"><div class="tblwrap" id="ftbl"></div></div>`;
  $("#fstat").value=fStatus;$("#ffuncao").value=fFuncao;$("#faloj").value=fAloj;$("#fadmde").value=fAdmDe;$("#fadmate").value=fAdmAte;
  $("#fbusca").addEventListener("input",e=>{fFiltro=e.target.value;renderFTbl();});
  $("#fstat").addEventListener("change",e=>{fStatus=e.target.value;renderFTbl();});
  $("#ffuncao").addEventListener("change",e=>{fFuncao=e.target.value;renderFTbl();});
  $("#faloj").addEventListener("change",e=>{fAloj=e.target.value;renderFTbl();});
  $("#fadmde").addEventListener("change",e=>{fAdmDe=e.target.value;renderFTbl();});
  $("#fadmate").addEventListener("change",e=>{fAdmAte=e.target.value;renderFTbl();});
  renderFTbl();
}
function limparFiltrosFunc(){fFiltro="";fStatus="ativo";fFuncao="";fAloj="";fAdmDe="";fAdmAte="";vFunc();}
function fotoThumb(f,size){return f.foto?`<img src="${f.foto}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;display:block">`:`<div style="width:${size}px;height:${size}px;border-radius:50%;background:#eef0ee;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:${Math.round(size*0.42)}px;font-weight:700">${esc((f.nome||"?").charAt(0).toUpperCase())}</div>`;}
function porNome(list){return list.slice().sort((a,b)=>(a.nome||"").localeCompare(b.nome||"","pt-BR"));}
function funcMatch(list,q){q=(q||"").toLowerCase();const filtrado=q?list.filter(f=>[f.nome,f.matricula,f.cpf,f.funcao,f.cidade,f.empresa].some(v=>(v||"").toLowerCase().includes(q))):list;return porNome(filtrado);}
function renderFTbl(){
  let list=DB.func.slice();
  if(fStatus==="ativo")list=list.filter(ativo);else if(fStatus==="desl")list=list.filter(f=>!ativo(f));
  list=funcMatch(list,fFiltro);
  if(fFuncao)list=list.filter(f=>f.funcao===fFuncao);
  if(fAloj==="__semlocal")list=list.filter(f=>{const m=estadiaAtual(f.id);return !m||m.tipo==="Local";});
  else if(fAloj)list=list.filter(f=>{const m=estadiaAtual(f.id);return m&&m.local===fAloj;});
  if(fAdmDe)list=list.filter(f=>f.admissao&&f.admissao>=fAdmDe);
  if(fAdmAte)list=list.filter(f=>f.admissao&&f.admissao<=fAdmAte);
  const el=$("#ftbl");const countEl=$("#fcount");if(countEl)countEl.textContent=list.length+(list.length===1?" pessoa":" pessoas");
  if(!list.length){el.innerHTML=`<div class="empty"><div class="big">☰</div><p>Nenhum funcionário com esses filtros.</p><button class="btn btn-a" onclick="formFunc()">Cadastrar</button></div>`;return;}
  el.innerHTML=`<table class="tbl"><thead><tr><th>Nº</th><th></th><th>Nome / Matrícula</th><th>Função</th><th>Classe</th><th>Local atual</th><th>Tempo de casa</th><th>Experiência</th><th>Origem</th><th></th></tr></thead><tbody>${
    list.map((f,i)=>{const ex=expStatus(f);const tc=f.admissao?humano(diasEntre(pd(f.admissao),today())):"—";const m=estadiaAtual(f.id);const localCel=m?(m.tipo==="Local"?'<span class="tag t-grey">Local</span>':`${esc(localNome(m.local))} <span class="tag ${tagTipoMov(m.tipo)}" style="margin-left:4px">${esc(m.tipo)}</span>`):'<span class="tag t-grey">sem registro</span>';
    return `<tr><td class="num">${i+1}</td><td>${fotoThumb(f,32)}</td><td><b>${esc(f.nome)}</b>${ativo(f)?"":` <span class="tag t-grey">desligado${f.motivoDesligamento?" — "+esc(f.motivoDesligamento):""}</span>`}${afastado(f)?` <span class="tag t-amber">afastado${f.motivoAfastamento?" — "+esc(f.motivoAfastamento):""}</span>`:""}<br><small style="color:var(--muted)">${f.matricula?"mat. "+esc(f.matricula):"sem matrícula"}</small></td><td>${esc(f.funcao||"—")}<br><small style="color:var(--muted)">${esc(f.empresa||"")}</small></td><td>${f.classificacao?`<span class="tag ${f.classificacao==='MOD'?'t-steel':'t-amber'}">${f.classificacao}</span>`:"—"}${f.regimeFolga&&f.regimeFolga!=="Não"?`<br><span class="tag t-grey" style="margin-top:4px">${esc(f.regimeFolga)}</span>`:""}</td><td>${localCel}</td><td class="num">${tc}</td><td><span class="tag ${ex.cls}">${ex.txt}</span>${ex.alerta?`<br><small style="color:var(--red)">faltam ${ex.rest}d</small>`:""}</td><td>${esc(f.cidade||"—")}</td><td><div class="rowact"><button class="btn btn-g btn-sm" onclick="verFunc('${f.id}')">Ver ficha</button><button class="btn btn-g btn-sm" onclick="formFunc('${f.id}')">Editar</button>${ativo(f)?(afastado(f)?`<button class="btn btn-g btn-sm" onclick="formRetornoAfastamento('${f.id}')">Retornar</button>`:`<button class="btn btn-g btn-sm" onclick="formAfastar('${f.id}')">Afastar</button>`):`<button class="btn btn-g btn-sm" style="color:var(--green)" onclick="reativarFuncionario('${f.id}')">Reativar</button>`}${ativo(f)?`<button class="btn btn-g btn-sm" style="color:var(--red)" onclick="formInativar('${f.id}')">Inativar</button>`:""}</div></td></tr>`;}).join("")
  }</tbody></table>`;
}

function salvarMov(id){

  if(tipo==="Transferência"){
    const data=$("#m_datatransf").value,direcao=$("#m_direcao").value;
    if(!data){toast("Informe a data da transferência.");return;}
    const o={id:id||uid(),func:_movFunc,tipo,direcao,obraOrigem:$("#m_obraorigem").value.trim(),obraDestino:$("#m_obradestino").value.trim(),entrada:data,saida:"",motivo:"",diaria:"",obs:$("#m_obs").value.trim()};

      if(direcao==="Saindo"){const ant=estadiaAtual(o.func);if(ant){ant.saida=data;ant.motivo=ant.motivo||"Transferência";}}
      DB.mov.push(o);
    }
    save("mov");closeModal();render();toast("Transferência registrada.");
    return;
  }
  const local=$("#m_local").value,ent=$("#m_ent").value,sai=$("#m_sai").value;
  const semLocalObrigatorio=(tipo==="Local"||tipo==="Baixada");
  if(!semLocalObrigatorio&&!local){toast("Selecione ou cadastre o local.");return;}
  if(!ent){toast("Informe a data de entrada.");return;}
  if(sai&&pd(sai)<pd(ent)){toast("A saída não pode ser antes da entrada.");return;}
  const o={id:id||uid(),func:_movFunc,tipo,local:semLocalObrigatorio?"":local,quarto:$("#m_quarto")?.value.trim()||"",entrada:ent,saida:sai,motivo:$("#m_mot").value,diaria:semLocalObrigatorio?"":$("#m_diaria").value,obs:$("#m_obs").value.trim()};

  else{
    if(!o.saida){const ant=estadiaAtual(o.func);if(ant){ant.saida=o.entrada;ant.motivo=ant.motivo||(tipo==="Baixada"?"Baixada":"Troca de alojamento");}}

  }

function periodoPontoPadrao(){const t=today();const y=t.getFullYear(),m=t.getMonth();let de,ate;if(t.getDate()<=15){de=iso(new Date(y,m-1,16));ate=iso(new Date(y,m,15));}else{de=iso(new Date(y,m,16));ate=iso(new Date(y,m+1,15));}return{de,ate};}

function overlapDias(iniStr,fimStr,de,ate){if(!iniStr)return 0;const ini=pd(iniStr);const fim=fimStr?pd(fimStr):ini;const pDe=pd(de),pAte=pd(ate);if(!pDe||!pAte)return 0;const s=ini>pDe?ini:pDe;const e=fim<pAte?fim:pAte;if(s>e)return 0;return diasEntre(s,e)+1;}
function resumoPeriodoPonto(de,ate){const JUST=["Falta justificada","Atestado","Abono"];return DB.func.filter(ativo).map(f=>{const faltas=DB.faltas.filter(x=>x.func===f.id&&(x.tipo||"Falta")==="Falta"&&x.data>=de&&x.data<=ate).length;const justificadas=DB.faltas.filter(x=>x.func===f.id&&JUST.includes(x.tipo)&&x.data>=de&&x.data<=ate).length;let baixadaDias=0;DB.baixadas.filter(b=>b.func===f.id).forEach(b=>{const fimReal=b.dataFim||iso(new Date(pd(b.dataInicio).getTime()+((+b.dias||1)-1)*MS));baixadaDias+=overlapDias(b.dataInicio,fimReal,de,ate);});let feriasDias=0;DB.ferias.filter(x=>x.func===f.id).forEach(x=>{feriasDias+=overlapDias(x.inicio,x.fim,de,ate);});return {f,faltas,justificadas,baixadaDias,feriasDias};});}

function statusDoDia(fid,dataStr){
  const fer=DB.ferias.find(x=>x.func===fid&&x.inicio&&x.fim&&x.inicio<=dataStr&&x.fim>=dataStr);
  if(fer)return{tipo:"Férias",cls:"t-steel"};
  const baix=DB.baixadas.find(b=>{if(b.func!==fid)return false;const fimReal=b.dataFim||iso(new Date(pd(b.dataInicio).getTime()+((+b.dias||1)-1)*MS));return b.dataInicio<=dataStr&&fimReal>=dataStr;});
  if(baix)return{tipo:"Baixada",cls:"t-amber"};

  if(fa){const t=fa.tipo||"Falta";const cls=t==="Presença"?"t-green":t==="Falta"?"t-red":t==="Treinamento"?"t-steel":"t-amber";return{tipo:t,cls,id:fa.id,motivo:fa.motivo,horaEntrada:fa.horaEntrada,horaSaida:fa.horaSaida};}

function normalizaNome(s){return(s||"").toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();}
const LOCAL_MARCACOES_OBRA="UNEM - NOVA LIMA / MG";
function abrirImportarMarcacoes(){$("#marc_file").click();}
function processarArquivoMarcacoes(e){
  const file=e.target.files[0];if(!file)return;
  if(typeof XLSX==="undefined"){toast("Excel indisponível offline.");return;}
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      const header=rows[0].map(h=>String(h).trim());
      const idxNome=header.indexOf("Nome");
      const idxLocal=header.indexOf("Descrição do local");
      const idxData=header.indexOf("Data");
      if(idxNome<0||idxData<0){toast("Não reconheci as colunas — confere se é o export certo de Marcações.");return;}
      const porPessoaDia={};
      for(let i=1;i<rows.length;i++){
        const r=rows[i];if(!r[idxNome])continue;
        if(idxLocal>=0&&r[idxLocal]!==LOCAL_MARCACOES_OBRA)continue;
        const dataRaw=String(r[idxData]||"").trim();
        const partesDataHora=dataRaw.split(" ");
        const dataSoDia=partesDataHora[0];
        const hora=partesDataHora[1]||"";
        const partes=dataSoDia.split("/");
        if(partes.length!==3)continue;
        const dataIso=partes[2]+"-"+partes[1].padStart(2,"0")+"-"+partes[0].padStart(2,"0");
        const chave=normalizaNome(r[idxNome])+"|"+dataIso;
        if(!porPessoaDia[chave])porPessoaDia[chave]={nome:r[idxNome],data:dataIso,horas:[]};
        if(hora)porPessoaDia[chave].horas.push(hora);
      }
      const lista=Object.values(porPessoaDia).map(item=>{
        item.horas.sort();
        return{nome:item.nome,data:item.data,entrada:item.horas[0]||"",saida:item.horas.length>1?item.horas[item.horas.length-1]:"",qtdBatidas:item.horas.length};
      });
      mostrarResumoImportacaoMarcacoes(lista);
    }catch(err){console.error(err);toast("Não consegui ler esse arquivo — confere se é um .xlsx válido.");}
  };
  reader.readAsArrayBuffer(file);
  e.target.value="";
}
function mostrarResumoImportacaoMarcacoes(lista){
  const funcNorm=DB.func.filter(ativo).map(f=>({f,norm:normalizaNome(f.nome)}));
  const encontrados=[],naoEncontrados=new Set(),jaTinhamRegistro=[];
  lista.forEach(item=>{
    const match=funcNorm.find(x=>x.norm===normalizaNome(item.nome));
    if(!match){naoEncontrados.add(item.nome);return;}
    const jaTem=DB.faltas.some(fa=>fa.func===match.f.id&&fa.data===item.data);
    if(jaTem){jaTinhamRegistro.push({nome:item.nome,data:item.data});return;}
    encontrados.push({fid:match.f.id,nome:match.f.nome,data:item.data,entrada:item.entrada,saida:item.saida});
  });
  const semSaida=encontrados.filter(x=>x.entrada&&!x.saida);
  window._importMarcacoesPendente=encontrados;
  openModal(`<div class="modal-h"><h3>Importar marcações</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-b">
   <div class="grid stats" style="margin-bottom:14px"><div class="stat green"><div class="n">${encontrados.length}</div><div class="l">Vão virar Presença</div></div><div class="stat amber"><div class="n">${semSaida.length}</div><div class="l">Sem batida de saída</div></div><div class="stat"><div class="n">${jaTinhamRegistro.length}</div><div class="l">Já tinham registro (ignorados)</div></div><div class="stat red"><div class="n">${naoEncontrados.size}</div><div class="l">Nome não encontrado</div></div></div>
   ${semSaida.length?`<p class="hint" style="color:var(--amber-d);margin-bottom:10px">⚠ Só bateram entrada, sem saída registrada (esqueceram de bater ou saíram sem avisar): ${semSaida.map(x=>esc(x.nome)+" ("+fmt(x.data)+")").join(", ")}</p>`:""}
   ${naoEncontrados.size?`<p class="hint" style="color:var(--red);margin-bottom:10px">Nomes que não bateram com ninguém ativo cadastrado (confere grafia/cadastro): ${[...naoEncontrados].map(n=>esc(n)).join(", ")}</p>`:""}
   <p class="hint">Isso marca <b>Presença</b> (com hora de entrada/saída, quando tiver) nos dias em que a pessoa bateu ponto e ainda não tinha nenhum registro naquele dia (não mexe em Falta/Atestado/Baixada/Férias já lançados). Quem ficou sem saída fica marcado pra você revisar depois.</p>
   </div><div class="modal-f"><button class="btn btn-g" onclick="closeModal()">Cancelar</button><button class="btn btn-a" ${encontrados.length?"":"disabled"} onclick="confirmarImportacaoMarcacoes()">Confirmar e salvar ${encontrados.length} presenças</button></div>`);
}

function renderGradeLancamentoMensal(){
  const fid=$("#lm_func")?.value,mes=$("#lm_mes")?.value;
  const el=$("#lm_grade");if(!el||!fid||!mes)return;
  const [ano,mesNum]=mes.split("-").map(Number);
  const diasNoMes=new Date(ano,mesNum,0).getDate();
  const DIAS_SEMANA_ABREV=["dom","seg","ter","qua","qui","sex","sáb"];
  let linhas="";
  for(let d=1;d<=diasNoMes;d++){
    const dataIso=ano+"-"+String(mesNum).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const dt=new Date(ano,mesNum-1,d);
    const fimDeSemana=dt.getDay()===0||dt.getDay()===6;

function mergeIntervalos(intervalos){
  const ordenados=intervalos.slice().sort((a,b)=>a[0]-b[0]);
  const juntos=[];
  ordenados.forEach(([s,e])=>{
    if(juntos.length&&s<=new Date(juntos[juntos.length-1][1].getTime()+MS)){
      if(e>juntos[juntos.length-1][1])juntos[juntos.length-1][1]=e;
    }else{
      juntos.push([s,e]);
    }
  });
  return juntos;
}
function relatorioHotelMes(hotelId,mesRefStr){
  if(!hotelId||!mesRefStr)return[];
  const hotel=DB.locais.find(l=>l.id===hotelId);
  const partes=mesRefStr.split("-").map(Number);
  const inicioMes=new Date(partes[0],partes[1]-1,1);
  const fimMes=new Date(partes[0],partes[1],0);
  const movs=DB.mov.filter(mv=>mv.tipo==="Hotel"&&mv.local===hotelId);
  const porQuarto={};
  movs.forEach(mv=>{
    const ini=pd(mv.entrada);if(!ini)return;
    const fimReal=mv.saida?pd(mv.saida):today();
    const s=ini>inicioMes?ini:inicioMes;
    const e=fimReal<fimMes?fimReal:fimMes;
    if(s>e)return;
    const key=mv.quarto||("_semquarto_"+mv.id);
    if(!porQuarto[key])porQuarto[key]={quarto:mv.quarto||"(sem quarto informado)",ocupantes:[],intervalos:[],diariaOverride:null};
    porQuarto[key].ocupantes.push({nome:funcNome(mv.func),entrada:mv.entrada,saida:mv.saida});
    porQuarto[key].intervalos.push([s,e]);
    if(mv.diaria)porQuarto[key].diariaOverride=+mv.diaria;
  });
  const diariaPadrao=+((hotel||{}).diaria)||0;
  return Object.values(porQuarto).map(q=>{
    const juntos=mergeIntervalos(q.intervalos);
    const noites=juntos.reduce((s,[a,b])=>s+diasEntre(a,b)+1,0);
    const diaria=q.diariaOverride!=null?q.diariaOverride:diariaPadrao;
    return{...q,noites,diaria,valor:+(noites*diaria).toFixed(2)};
  }).sort((a,b)=>a.quarto.localeCompare(b.quarto,"pt-BR"));
}

function vMapa(){
  const locs=DB.locais.filter(l=>l.lat&&l.lng&&!isNaN(+l.lat)&&!isNaN(+l.lng));
  main.innerHTML=`<div class="head"><div><h1>Mapa</h1><p>Locais com coordenadas cadastradas — ajuda a organizar rotas de ônibus/micro-ônibus. Adicione lat/lng em Locais &amp; Rota pra aparecerem aqui.</p></div></div>
   ${locs.length?`<div class="panel" style="overflow:hidden"><div id="mapdiv" style="height:520px;width:100%"></div></div><p class="hint" style="padding:0 4px">🟢 Alojamento · 🔵 Hotel · 🟠 Ponto de coleta</p>`:`<div class="empty"><div class="big">🗺</div><p>Nenhum local com coordenadas ainda.</p><button class="btn btn-a" onclick="CUR='locais';buildNav();render()">Ir para Locais</button></div>`}`;
  if(!locs.length)return;
  setTimeout(()=>{
    if(_leafletMap){_leafletMap.remove();_leafletMap=null;}
    const map=L.map('mapdiv');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);
    const colors={"Alojamento":"#2f8f57","Hotel":"#2f6f8f","Ponto de coleta":"#c97f00"};
    const bounds=[];
    locs.forEach(l=>{
      const lat=+l.lat,lng=+l.lng;bounds.push([lat,lng]);
      const oc=ocupacao(l.id);const cap=+l.capacidade||0;
      const color=colors[l.tipo]||"#555";
      const icon=L.divIcon({className:'',html:`<div style="background:${color};width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 4px rgba(0,0,0,.4)"></div>`,iconSize:[16,16]});
      L.marker([lat,lng],{icon}).addTo(map).bindPopup(`<b>${esc(l.nome)}</b><br>${esc(l.tipo)}${l.tipo!=='Ponto de coleta'?` — ${oc}${cap?'/'+cap:''} pessoas`:''}<br><small>${esc(l.endereco||'')}</small>`);
    });
    if(bounds.length===1)map.setView(bounds[0],14);else map.fitBounds(bounds,{padding:[30,30]});
    _leafletMap=map;
  },50);
}

let _rotaEdit=null,_rotaBusca="";
function formRota(veiculoId,rotaId){
  if(!DB.locais.length){toast("Cadastre ao menos um local (Locais/Rota) antes.");return;}
  const r=rotaId?DB.rotas.find(x=>x.id===rotaId):{veiculo:veiculoId,nome:"",turno:"Manhã",paradas:[],passageiros:[]};
  _rotaEdit=JSON.parse(JSON.stringify(r));_rotaEdit._id=rotaId||"";_rotaBusca="";
  if(!_rotaEdit.paradas)_rotaEdit.paradas=[];if(!_rotaEdit.passageiros)_rotaEdit.passageiros=[];
  const v=DB.veiculos.find(x=>x.id===_rotaEdit.veiculo);
  openModal(`<div class="modal-h"><h3>${_rotaEdit._id?"Editar":"Nova"} rota — ${esc(v?v.tipo:"")}${v&&v.placa?" "+esc(v.placa):""}</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-b" id="rt_body">${rotaBodyHtml()}</div>
   <div class="modal-f">${_rotaEdit._id?`<button class="btn btn-g" style="margin-right:auto;color:var(--red)" onclick="delRota('${_rotaEdit._id}')">Excluir rota</button>`:""}<button class="btn btn-g" onclick="closeModal()">Cancelar</button><button class="btn btn-a" onclick="salvarRota()">Salvar</button></div>`);
  renderRotaPassList("");
}
function rotaBodyHtml(){
  const v=DB.veiculos.find(x=>x.id===_rotaEdit.veiculo);const cap=+((v||{}).capacidade)||0;const oc=_rotaEdit.passageiros.length;
  return `<div class="row2"><div class="fg"><label>Nome da rota *</label><input id="rt_nome" value="${esc(_rotaEdit.nome)}" placeholder="ex.: Alojamento Central → Obra"></div>
    <div class="fg"><label>Turno</label><select id="rt_turno">${["Manhã","Tarde","Noite","Sob demanda"].map(t=>`<option ${_rotaEdit.turno===t?"selected":""}>${t}</option>`).join("")}</select></div></div>
   <div class="sub">Paradas (na ordem em que o veículo passa)</div>
   <div class="row3" style="align-items:end">
     <div class="fg" style="grid-column:span 2"><label>Local</label><select id="rt_novoLocal">${DB.locais.map(l=>`<option value="${l.id}">${esc(l.nome)} (${esc(l.tipo)})</option>`).join("")}</select></div>
     <div class="fg"><label>Horário</label><input type="time" id="rt_novoHorario"></div>
   </div>
   <button class="btn btn-g btn-sm" onclick="addParada()" style="margin-bottom:14px">＋ Adicionar parada</button>
   ${_rotaEdit.paradas.length?`<table class="tbl" style="border:1px solid #eef0ec;border-radius:8px;margin-bottom:16px"><thead><tr><th>#</th><th>Local</th><th>Horário</th><th></th></tr></thead><tbody>${_rotaEdit.paradas.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(localNome(p.local))}</td><td>${p.horario||"—"}</td><td><div class="rowact">${i>0?`<button class="btn btn-g btn-sm" onclick="moveParada(${i},-1)">▲</button>`:""}${i<_rotaEdit.paradas.length-1?`<button class="btn btn-g btn-sm" onclick="moveParada(${i},1)">▼</button>`:""}<button class="btn btn-g btn-sm" onclick="removeParada(${i})">Remover</button></div></td></tr>`).join("")}</tbody></table>`:`<p class="hint" style="margin-bottom:16px">Nenhuma parada ainda.</p>`}
   <div class="sub">Passageiros <span style="text-transform:none;font-weight:400;color:var(--muted)">— ${oc}${cap?"/"+cap:""}${cap&&oc>cap?' <b style="color:var(--red)">acima da capacidade</b>':""}</span></div>
   <input type="search" id="rt_buscaFunc" value="${esc(_rotaBusca)}" placeholder="Buscar funcionário..." style="width:100%;padding:9px 12px;border:1px solid #d5d9d3;border-radius:8px;margin-bottom:10px" oninput="_rotaBusca=this.value;renderRotaPassList(this.value)">
   <div id="rt_passlist" style="max-height:220px;overflow:auto;border:1px solid #eef0ec;border-radius:8px"></div>`;

function renderRotaPassList(q){
  const list=funcMatch(DB.func.filter(ativo),q||"");
  const el=$("#rt_passlist");if(!el)return;
  el.innerHTML=list.length?list.map(f=>{const checked=_rotaEdit.passageiros.includes(f.id);
    return `<label style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #f2f3f1;cursor:pointer"><input type="checkbox" ${checked?"checked":""} onchange="togglePassageiro('${f.id}')"><span><b>${esc(f.nome)}</b> <small style="color:var(--muted)">${esc(f.funcao||"—")}</small></span></label>`;}).join(""):`<div class="empty"><p>Nenhum funcionário.</p></div>`;

function refreshRotaBody(){
  if($("#rt_nome"))_rotaEdit.nome=$("#rt_nome").value;
  if($("#rt_turno"))_rotaEdit.turno=$("#rt_turno").value;
  $("#rt_body").innerHTML=rotaBodyHtml();

function addParada(){const local=$("#rt_novoLocal").value,horario=$("#rt_novoHorario").value;if(!local){toast("Selecione um local.");return;}_rotaEdit.paradas.push({local,horario});refreshRotaBody();}
function moveParada(i,dir){const j=i+dir;if(j<0||j>=_rotaEdit.paradas.length)return;[_rotaEdit.paradas[i],_rotaEdit.paradas[j]]=[_rotaEdit.paradas[j],_rotaEdit.paradas[i]];refreshRotaBody();}
function removeParada(i){_rotaEdit.paradas.splice(i,1);refreshRotaBody();}

/* ============ ABASTECIMENTO & COMBOIO ============ */
function estoqueComboio(){
  const entradas=DB.abastecimentos.filter(a=>a.movimento==="Entrada").reduce((s,a)=>s+(+a.litros||0),0);
  const saidasComboio=DB.abastecimentos.filter(a=>a.movimento==="Saída"&&a.fonte==="Comboio").reduce((s,a)=>s+(+a.litros||0),0);
  return entradas-saidasComboio;
}
function destinoTxt(a){
  if(a.tag)return esc(a.tag);
  if(a.destinoTipo==="Veículo"){const v=DB.veiculos.find(x=>x.id===a.destinoVeiculo);return v?`${vehIcon(v.tipo)} ${esc(v.tipo)}${v.placa?" "+esc(v.placa):""}`:"—";}
  if(a.destinoMaquina)return `⚙ ${esc(a.destinoMaquina)}`;
  return "—";
}
function consumoPorEquipamento(){
  const porTag={};
  DB.abastecimentos.filter(a=>a.movimento==="Saída"&&a.tag).forEach(a=>{
    const tag=a.tag;
    if(!porTag[tag])porTag[tag]={tag,litros:0,qtd:0,horimetros:[],ultimaData:""};
    porTag[tag].litros+=+a.litros||0;
    porTag[tag].qtd++;
    if(a.horimetroEquip&&!isNaN(+a.horimetroEquip))porTag[tag].horimetros.push({h:+a.horimetroEquip,data:a.data});
    if(!porTag[tag].ultimaData||a.data>porTag[tag].ultimaData)porTag[tag].ultimaData=a.data;
  });
  return Object.values(porTag).map(t=>{
    let consumoMedio=null,horasRodadas=null;
    if(t.horimetros.length>=2){
      const sorted=t.horimetros.slice().sort((a,b)=>a.h-b.h);
      horasRodadas=+(sorted[sorted.length-1].h-sorted[0].h).toFixed(1);
      if(horasRodadas>0)consumoMedio=+(t.litros/horasRodadas).toFixed(2);
    }
    return{...t,consumoMedio,horasRodadas};
  }).sort((a,b)=>b.litros-a.litros);
}

function salvarImportarVagas(){
  const texto=$("#vg_bulk").value;
  const linhas=texto.split("\n").map(l=>l.trim()).filter(Boolean);
  let criadas=0,atualizadas=0;
  linhas.forEach(linha=>{

    const qtd=+((partes[1]||"").trim())||0;
    if(!funcao)return;
    const existente=DB.vagas.find(x=>x.funcao.toLowerCase()===funcao.toLowerCase());
    if(existente){existente.quantidadeTotal=qtd;atualizadas++;}
    else{DB.vagas.push({id:uid(),funcao,quantidadeTotal:qtd,obs:""});criadas++;}
  });
  save("vagas");closeModal();render();toast(`${criadas} vaga(s) criada(s), ${atualizadas} atualizada(s).`);

  if(n.dataRealizada)return{txt:"Pago",cls:"t-green"};
  if(n.lancado)return{txt:"Lançado p/ pagamento",cls:"t-steel"};
  if(n.dataPrevista&&pd(n.dataPrevista)<today())return{txt:"Vencido",cls:"t-red"};
  if(n.dataPrevista&&diasEntre(today(),pd(n.dataPrevista))<=(DB.cfg.alertaVencimentoDias||10))return{txt:"Vencendo",cls:"t-amber"};
  return{txt:"Pendente",cls:"t-grey"};

function vPainelCompras(){
  const abertos=pedidosAbertos();
  const urgentesPendentes=abertos.filter(p=>p.urgente&&p.status==="Solicitado");
  const parados=abertos.filter(p=>diasParado(p)>=DB.cfg.diasAlertaParado);
  const excecaoPendente=abertos.filter(p=>p.foraDoDia&&!p.excecaoLiberada&&p.status==="Solicitado");
  const semNotaCount=linhasLancamentos().filter(l=>l.stage==="Sem nota"||l.stage==="OC ainda não gerada").length;
  const mAtual=iso(today()).slice(0,7);
  const gastoMes=DB.compras_despesas.filter(d=>mesRef(d.data)===mAtual).reduce((s,d)=>s+(+d.valor||0),0);
  const estoqueBaixo=DB.compras_estoque.filter(it=>(+it.quantidadeAtual||0)<=(+it.quantidadeMinima||0));
  const notasVencidas=DB.compras_notas.filter(n=>notaStatus(n).txt==="Vencido");
  const notasVencendo=DB.compras_notas.filter(n=>notaStatus(n).txt==="Vencendo");

  const hoje=today(),alvo=+diaSemana;

  return iso(new Date(hoje.getTime()+diff*MS));
}

function calcularTotalItensPedido(){
  const total=_itensPedidoTemp.reduce((s,it)=>s+((+it.quantidade||0)*(+it.valorUnitario||0)),0);
  if(!total){toast("Nenhum item com quantidade e valor unitário pra somar.");return;}
  $("#pd_valor").value=total.toFixed(2);
  toast("Total calculado: R$ "+total.toLocaleString('pt-BR',{minimumFractionDigits:2}));
}
function foraDoDiaCheck(setorId,dataStr){
  const s=setorObj(setorId);if(!s||s.diaSemana===""||s.diaSemana==null)return false;
  const d=pd(dataStr);if(!d)return false;
  return String(d.getDay())!==String(s.diaSemana);
}
function avisoDiaPedido(){
  const setorId=$("#pd_setor")?.value,data=$("#pd_data")?.value;
  const el=$("#pd_aviso"),wrap=$("#pd_motivowrap");if(!el)return;
  const s=setorObj(setorId);
  if(!s||s.diaSemana===""||s.diaSemana==null){el.innerHTML="";if(wrap)wrap.style.display="none";return;}
  const fora=foraDoDiaCheck(setorId,data);
  if(!fora){el.innerHTML=`<p class="hint" style="color:var(--green);margin-bottom:14px">✓ Dentro do dia do setor (${DIAS_SEMANA[+s.diaSemana]}). Chega na obra na semana seguinte.</p>`;if(wrap)wrap.style.display="none";return;}
  el.innerHTML=`<p class="hint" style="color:var(--red);margin-bottom:10px">⚠ Fora do dia do setor (dia certo: ${DIAS_SEMANA[+s.diaSemana]}). Pode esperar até o próximo dia certo, ou seguir como exceção justificando abaixo — precisa de liberação da engenharia.</p>`;if(wrap)wrap.style.display="block";
}
function salvarPedido(id){
  if(!_pedSolicitante){toast("Selecione o solicitante.");return;}

  if(!_itensPedidoTemp.length){toast("Adicione pelo menos um item ao pedido.");return;}
  if(!id&&data<iso(today())){toast("A data do pedido não pode ser retroativa (antes de hoje).");return;}
  const fora=foraDoDiaCheck(setor,data);
  const motivoExcecao=$("#pd_motivoexcecao")?.value.trim()||"";
  if(fora&&!motivoExcecao){toast("Fora do dia do setor — escreva a justificativa da exceção, ou mude a data pro dia certo.");return;}
  const itensLista=_itensPedidoTemp.slice();
  if(id){
    const p=DB.compras_pedidos.find(x=>x.id===id);

    else if(fora){p.motivoExcecao=motivoExcecao;}
    save("compras_pedidos");closeModal();render();toast("Pedido atualizado.");

  }
  const o={id:uid(),solicitante:_pedSolicitante,setor,data,tipo,nivelUrgencia,urgente:nivelUrgencia==="Urgente",itensLista,valorEstimado:$("#pd_valor").value,itemEstoque:$("#pd_itemestoque").value,contrato:$("#pd_contrato").value,anexos:_anexosTemp.slice(),foraDoDia:fora,motivoExcecao,excecaoLiberada:false,excecaoLiberadaData:"",excecaoLiberadaObs:"",status:"Solicitado",statusHistorico:[{status:"Solicitado",data:iso(today())}],obs:$("#pd_obs").value.trim()};

function liberarExcecao(id){
  if(!confirmarSenhaSalvar())return;
  const obs=prompt("Observação da liberação (opcional):","");
  const p=DB.compras_pedidos.find(x=>x.id===id);
  p.excecaoLiberada=true;p.excecaoLiberadaData=iso(today());p.excecaoLiberadaObs=obs||"";
  save("compras_pedidos");verPedido(id);toast("Exceção liberada.");
}
function avancarStatus(id){
  const p=DB.compras_pedidos.find(x=>x.id===id);
  const idxAtual=STATUS_FLUXO.indexOf(p.status);
  if(p.foraDoDia&&!p.excecaoLiberada&&p.status==="Solicitado"){toast("Libere a exceção antes de avançar.");return;}
  const proximo=STATUS_FLUXO[idxAtual+1];
  if(proximo==="Aprovado pelo engenheiro"){closeModal();formAprovacaoEngenheiro(id);return;}
  if(proximo==="Chegou na obra"&&p.itemEstoque){
    closeModal();
    formEntradaEstoquePedido(id);
    return;
  }
  p.status=proximo;(p.statusHistorico=p.statusHistorico||[]).push({status:proximo,data:iso(today())});
  save("compras_pedidos");closeModal();render();
  if(proximo==="Chegou na obra"){
    if(confirm("Pedido marcado como chegado na obra! Já tem a nota fiscal pra lançar agora?")){
      formNota();
      setTimeout(()=>{const sel=$("#nf_pedido");if(sel){sel.value=id;atualizarOcsDaNota();}const fornInput=$("#nf_forn");const oc=(p.ordensCompra||[])[0];if(fornInput&&oc&&oc.fornecedor)fornInput.value=oc.fornecedor;},50);
      return;
    }
  }
  toast("Status atualizado.");
}

function voltarStatus(id){

function solicitarCategoriaNova(nomeDigitado,callback){
  const nome=(nomeDigitado||"").trim();

  if(aprovadas.includes(nome.toLowerCase())){if(callback)callback(nome);return;}

  DB.cfg.categoriasPendentes=[...pendentes,{nome,data:iso(today())}];

/* ============ PAINEL DE LANÇAMENTOS (pedido → OC → nota → pagamento, numa visão só) ============ */
function notasDaOC(pedidoId,ocId,temUmaSoOC){
  return DB.compras_notas.filter(n=>n.ordemCompraId===ocId||(!n.ordemCompraId&&temUmaSoOC&&n.pedido===pedidoId));
}
function estagioOC(pedidoId,oc,temUmaSoOC){
  const notas=notasDaOC(pedidoId,oc,temUmaSoOC);
  if(!notas.length)return{stage:"Sem nota",cls:"t-red",notas};
  const paga=notas.find(n=>n.dataRealizada);
  if(paga)return{stage:"Paga",cls:"t-green",notas};
  const enviada=notas.find(n=>n.lancado);
  if(enviada)return{stage:"Enviada p/ pagamento",cls:"t-steel",notas};
  return{stage:"Nota lançada, aguardando envio",cls:"t-amber",notas};
}
function linhasLancamentos(){
  const linhas=[];
  DB.compras_pedidos.forEach(p=>{
    const ocs=p.ordensCompra||[];
    if(!ocs.length){
      if(["Aprovado pelo engenheiro","Ordem de compra gerada","Chegou na obra"].includes(p.status)){
        linhas.push({pedidoId:p.id,setor:setorNome(p.setor),data:p.data,fornecedor:"—",origem:"—",ocNumero:"—",ocFluig:"",ocFluigLink:"",stage:"OC ainda não gerada",cls:"t-red",valor:0,notas:[],vencimento:"",vencendoEmBreve:false,vencido:false});
      }
      return;
    }
    ocs.forEach(oc=>{
      const est=estagioOC(p.id,oc,ocs.length===1);
      const valor=est.notas.reduce((s,n)=>s+(+n.valor||0),0);
      const naoPagas=est.notas.filter(n=>!n.dataRealizada&&n.dataPrevista);
      const vencimento=naoPagas.length?naoPagas.sort((a,b)=>a.dataPrevista.localeCompare(b.dataPrevista))[0].dataPrevista:"";
      const vencido=vencimento&&pd(vencimento)<today();
      const vencendoEmBreve=vencimento&&!vencido&&diasEntre(today(),pd(vencimento))<=(DB.cfg.alertaVencimentoDias||10);
      linhas.push({pedidoId:p.id,setor:setorNome(p.setor),data:p.data,fornecedor:oc.fornecedor||"—",origem:oc.origemCompra||"Suprimentos",ocNumero:oc.numero||"(s/nº)",ocFluig:oc.numeroFluig||"",ocFluigLink:oc.linkFluig||"",stage:est.stage,cls:est.cls,valor,notas:est.notas,vencimento,vencendoEmBreve,vencido});
    });
  });
  return linhas;
}

function salvarDecisaoAlmoxPedido(id,decisao){

function salvarRetiradaAlmoxPedido(id){
  const retiradoPor=$("#rt_por").value.trim();
  if(!retiradoPor){toast("Informe quem retirou.");return;}
  const p=DB.almox_pedidos.find(x=>x.id===id);
  const responsabilidade=$("#rt_resp").checked;
  (p.itens||[]).forEach(it=>{
    const match=DB.compras_estoque.find(x=>normalizaNome(x.nome)===normalizaNome(it.nome));
    const qtd=+it.quantidade||1;
    DB.compras_estoque_mov.push({id:uid(),loteId:id,item:match?match.id:"",itemNomeSnapshot:it.nome,tipo:"Saída",quantidade:qtd,data:iso(today()),destinoTipo:"Funcionário",funcionario:p.funcionario,responsabilidade,retiradoPor,obs:"Via pedido de material/EPI — categoria: "+p.categoria+" — motivo: "+(p.motivo||"—")});
    if(match)match.quantidadeAtual=Math.max(0,(+match.quantidadeAtual||0)-qtd);
  });

    funcionario=destinoTipo==="Funcionário"?$("#em_func").value:"";
    destinoLocal=destinoTipo==="Local"?$("#em_alojamento").value:"";
    responsabilidade=destinoTipo==="Funcionário"?$("#em_resp").checked:false;
    retiradoPor=$("#em_retirado").value.trim();
    if(!retiradoPor){toast("Informe quem retirou o item.");return;}
    if(qtd>(+it.quantidadeAtual||0)){if(!confirm("Quantidade maior que o estoque atual ("+(it.quantidadeAtual||0)+"). Registrar mesmo assim?"))return;}
  }
  if(tipo==="Entrada"){
    origemTipo=$("#em_origemtipo").value;
    if(origemTipo==="Devolução"){
      funcDevolveu=$("#em_func_devol").value;
      estadoItem=$("#em_estado").value;
      recebidoPor=$("#em_recebido").value.trim();
      if(!recebidoPor){toast("Informe quem recebeu a devolução.");return;}
    }else{
      pedidoOrigem=$("#em_pedido")?.value||"";
      fornecedorOrigem=$("#em_fornecedor")?.value.trim()||"";
    }
  }
  const senha=prompt("Senha do almoxarifado pra confirmar essa "+tipo.toLowerCase()+":");
  if(senha===null)return;
  if(!senhaOk(senha,SENHA_ALMOXARIFADO)){toast("Senha incorreta — ação cancelada.");return;}
  const mv={id:uid(),item:itemId,tipo,quantidade:qtd,data,destinoTipo,funcionario,destinoLocal,responsabilidade,retiradoPor,origemTipo,funcDevolveu,estadoItem,recebidoPor,pedidoOrigem,fornecedorOrigem,obs:$("#em_obs").value.trim()};
  DB.compras_estoque_mov.push(mv);save("compras_estoque_mov");
  it.quantidadeAtual=Math.max(0,(+it.quantidadeAtual||0)+(tipo==="Entrada"?qtd:-qtd));
  save("compras_estoque");
  if(tipo==="Saída"&&destinoTipo==="Local"&&destinoLocal){adicionarItemAoLocal(destinoLocal,it.nome,qtd);}
  closeModal();render();toast(tipo+" registrada."+(tipo==="Saída"&&destinoTipo==="Local"?" Item também somado na lista do local.":""));
}
function adicionarItemAoLocal(localId,nomeItem,qtd){
  const l=DB.locais.find(x=>x.id===localId);if(!l)return;
  l.itensLocal=l.itensLocal||[];
  const existente=l.itensLocal.find(it=>it.nome.toLowerCase()===nomeItem.toLowerCase());
  if(existente&&/^\d+([.,]\d+)?$/.test((existente.quantidade||"").trim())){
    existente.quantidade=String(parseFloat(existente.quantidade.replace(",","."))+qtd);
  }else if(existente){
    existente.quantidade=(existente.quantidade||"")+" +"+qtd;
  }else{
    l.itensLocal.push({nome:nomeItem,quantidade:String(qtd)});
  }
  save("locais");
}
function delEstoqueMov(id){
  if(!confirm("Excluir esta movimentação? O estoque do item volta ao valor anterior."))return;
  const mv=DB.compras_estoque_mov.find(x=>x.id===id);

}

   ${custoId?`<div class="sub">Lançamentos mensais</div><div id="ce_lanclist"></div><div class="row3" style="align-items:end"><div class="fg" style="margin-bottom:0"><label class="opt">Mês</label><input type="month" id="ce_lanc_mes" value="${iso(today()).slice(0,7)}"></div><div class="fg" style="margin-bottom:0"><label class="opt">Valor pago (opcional)</label><input type="number" step="0.01" id="ce_lanc_valor"></div><div></div></div><button class="btn btn-g btn-sm" style="margin-top:8px" onclick="lancarCustoExtraMes('${contratoId}','${custoId}')">＋ Marcar mês como lançado</button>`:'<p class="hint">Salve o custo extra primeiro — depois você marca os lançamentos mês a mês.</p>'}
   </div>
   <div class="modal-f">${custoId?`<button class="btn btn-g" style="margin-right:auto;color:var(--red)" onclick="delCustoExtra('${contratoId}','${custoId}')">Excluir</button>`:""}<button class="btn btn-g" onclick="formContrato('${contratoId}')">Voltar</button><button class="btn btn-a" onclick="salvarCustoExtra('${contratoId}','${custoId||""}')">Salvar</button></div>`);
  if(custoId)renderLancamentosCustoExtra(contratoId,custoId);
}
function salvarCustoExtra(contratoId,custoId){
  const c=DB.compras_contratos.find(x=>x.id===contratoId);
  c.custosExtras=c.custosExtras||[];
  const o={id:custoId||uid(),tipo:$("#ce_tipo").value,fornecedor:$("#ce_forn").value.trim(),periodicidade:$("#ce_periodicidade").value,valor:$("#ce_valor").value,lancamentos:custoId?((c.custosExtras.find(x=>x.id===custoId)||{}).lancamentos||[]):[]};
  if(custoId){const i=c.custosExtras.findIndex(x=>x.id===custoId);c.custosExtras[i]=o;}else c.custosExtras.push(o);
  save("compras_contratos");
  if(!custoId){formCustoExtra(contratoId,o.id);}else{formContrato(contratoId);}
  toast("Custo extra salvo.");
}
function delCustoExtra(contratoId,custoId){
  if(!confirm("Excluir esse custo extra?"))return;
  const c=DB.compras_contratos.find(x=>x.id===contratoId);
  c.custosExtras=(c.custosExtras||[]).filter(x=>x.id!==custoId);
  save("compras_contratos");formContrato(contratoId);toast("Excluído.");
}
function renderLancamentosCustoExtra(contratoId,custoId){
  const el=$("#ce_lanclist");if(!el)return;
  const c=DB.compras_contratos.find(x=>x.id===contratoId);
  const ce=(c.custosExtras||[]).find(x=>x.id===custoId);
  const lancs=(ce.lancamentos||[]).slice().sort((a,b)=>(b.mesReferencia||"").localeCompare(a.mesReferencia||""));
  el.innerHTML=lancs.length?`<table class="tbl" style="border:1px solid #eef0ec;border-radius:8px;margin-bottom:10px"><thead><tr><th>Mês</th><th>Valor pago</th><th></th></tr></thead><tbody>${
    lancs.map(l=>`<tr><td>${esc(l.mesReferencia)}</td><td class="num">${l.valor?"R$ "+(+l.valor).toLocaleString('pt-BR',{minimumFractionDigits:2}):"—"}</td><td><button class="btn btn-g btn-sm" onclick="removerLancamentoCustoExtra('${contratoId}','${custoId}','${l.mesReferencia}')">Remover</button></td></tr>`).join("")
  }</tbody></table>`:`<p class="hint" style="margin-bottom:10px">Nenhum mês lançado ainda.</p>`;
}
function lancarCustoExtraMes(contratoId,custoId){
  const mesReferencia=$("#ce_lanc_mes").value;
  if(!mesReferencia){toast("Escolha o mês.");return;}
  const c=DB.compras_contratos.find(x=>x.id===contratoId);
  const ce=(c.custosExtras||[]).find(x=>x.id===custoId);
  ce.lancamentos=ce.lancamentos||[];
  if(ce.lancamentos.some(l=>l.mesReferencia===mesReferencia)){toast("Esse mês já estava marcado como lançado.");return;}
  ce.lancamentos.push({mesReferencia,valor:$("#ce_lanc_valor").value});
  save("compras_contratos");
  $("#ce_lanc_valor").value="";
  renderLancamentosCustoExtra(contratoId,custoId);
  toast("Mês marcado como lançado.");
}
function removerLancamentoCustoExtra(contratoId,custoId,mesReferencia){
  const c=DB.compras_contratos.find(x=>x.id===contratoId);
  const ce=(c.custosExtras||[]).find(x=>x.id===custoId);
  ce.lancamentos=(ce.lancamentos||[]).filter(l=>l.mesReferencia!==mesReferencia);
  save("compras_contratos");
  renderLancamentosCustoExtra(contratoId,custoId);
  toast("Removido.");
}

function formMedicao(contratoId,medicaoId){
  const c=DB.compras_contratos.find(x=>x.id===contratoId);
  const m=medicaoId?(c.medicoes||[]).find(x=>x.id===medicaoId):{mesReferencia:iso(today()).slice(0,7),status:"Aguardando fatura ou medição"};
  openModal(`<div class="modal-h"><h3>${medicaoId?"Editar":"Nova"} medição/lançamento</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-b">
   <div class="row2"><div class="fg"><label>Mês de referência *</label><input type="month" id="md_mes" value="${esc(m.mesReferencia)}"></div><div class="fg"><label>Status *</label><select id="md_status">${STATUS_MEDICAO.map(s=>`<option ${m.status===s?"selected":""}>${s}</option>`).join("")}</select></div></div>
   <div class="row2"><div class="fg"><label>Nº do Fluig <span class="opt">(opcional)</span></label><input id="md_fluig" value="${esc(m.numeroFluig)}"></div><div class="fg"><label>Link do Fluig</label><input id="md_fluiglink" value="${esc(m.linkFluig)}" placeholder="https://..."></div></div>
   <div class="fg"><label>Observações</label><input id="md_obs" value="${esc(m.obs)}"></div></div>
   <div class="modal-f">${medicaoId?`<button class="btn btn-g" style="margin-right:auto;color:var(--red)" onclick="delMedicao('${contratoId}','${medicaoId}')">Excluir</button>`:""}<button class="btn btn-g" onclick="formContrato('${contratoId}')">Cancelar</button><button class="btn btn-a" onclick="salvarMedicao('${contratoId}','${medicaoId||""}')">Salvar</button></div>`);
}
function salvarMedicao(contratoId,medicaoId){
  const mesReferencia=$("#md_mes").value;
  if(!mesReferencia){toast("Informe o mês de referência.");return;}
  const c=DB.compras_contratos.find(x=>x.id===contratoId);
  c.medicoes=c.medicoes||[];
  let linkFluig=$("#md_fluiglink").value.trim();
  if(linkFluig&&!/^https?:\/\//i.test(linkFluig))linkFluig="https://"+linkFluig;
  const o={id:medicaoId||uid(),mesReferencia,status:$("#md_status").value,numeroFluig:$("#md_fluig").value.trim(),linkFluig,obs:$("#md_obs").value.trim()};
  if(medicaoId){const i=c.medicoes.findIndex(x=>x.id===medicaoId);c.medicoes[i]=o;}else c.medicoes.push(o);
  save("compras_contratos");formContrato(contratoId);toast("Medição salva.");
}
function delMedicao(contratoId,medicaoId){
  if(!confirm("Excluir essa medição?"))return;
  const c=DB.compras_contratos.find(x=>x.id===contratoId);
  c.medicoes=(c.medicoes||[]).filter(x=>x.id!==medicaoId);
  save("compras_contratos");formContrato(contratoId);toast("Excluída.");
}
function salvarContrato(id){
  const numero=$("#ct_num").value.trim(),fornecedor=$("#ct_forn").value.trim();
  if(!numero||!fornecedor){toast("Informe número e fornecedor.");return;}
  const custosExtrasExistentes=id?((DB.compras_contratos.find(x=>x.id===id)||{}).custosExtras||[]):[];
  const o={id:id||uid(),numero,fornecedor,cnpj:$("#ct_cnpj").value.trim(),statusContrato:$("#ct_status").value,segmento:$("#ct_seg").value.trim(),objeto:$("#ct_obj").value.trim(),valorTotal:$("#ct_valor").value,periodicidadeFaturamento:$("#ct_periodicidade").value,caucaoValor:$("#ct_caucao_valor")?.value||"",caucaoDevolvida:$("#ct_caucao_dev")?.value||"Não",dataAssinatura:$("#ct_assin").value,vigenciaInicio:$("#ct_vigini").value,vigenciaFim:$("#ct_vigfim").value,responsavel:$("#ct_resp").value.trim(),itensContrato:_itensContratoTemp.slice(),custosExtras:custosExtrasExistentes,anexos:_anexosTemp.slice(),obs:$("#ct_obs").value.trim()};
  if(id){const i=DB.compras_contratos.findIndex(x=>x.id===id);DB.compras_contratos[i]=o;}else DB.compras_contratos.push(o);
  save("compras_contratos");closeModal();render();toast("Contrato salvo.");
}
function delContrato(id){if(!confirm("Excluir este contrato?"))return;DB.compras_contratos=DB.compras_contratos.filter(x=>x.id!==id);save("compras_contratos");closeModal();render();toast("Excluído.");}
function exportContratosExcel(){
  if(typeof XLSX==="undefined"){toast("Excel indisponível offline.");return;}
  const rows=DB.compras_contratos.map(c=>({Número:c.numero,Fornecedor:c.fornecedor,"CNPJ/CPF":c.cnpj||"",Status:c.statusContrato||"Ativo",Segmento:c.segmento||"",Objeto:c.objeto,"Valor total":+c.valorTotal||0,"Periodicidade faturamento":c.periodicidadeFaturamento||"","Data assinatura":c.dataAssinatura,"Vigência início":c.vigenciaInicio,"Vigência fim":c.vigenciaFim,"Caução (R$)":c.caucaoValor||"","Caução devolvida?":c.caucaoDevolvida||"","Custos extras":(c.custosExtras||[]).map(ce=>ce.tipo+(ce.fornecedor?" ("+ce.fornecedor+")":"")).join(", "),Responsável:c.responsavel,Obs:c.obs}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{"—":"sem dados"}]),"Contratos");
  XLSX.writeFile(wb,"contratos-"+iso(today())+".xlsx");toast("Exportado.");
}

/* ============ COMPRAS: notas fiscais ============ */
let _nfFiltroMes="",_nfFiltroForn="",_nfFiltroStatus="",_nfFiltroContrato="";
function notasFiltradas(){
  let list=DB.compras_notas.slice();
  if(_nfFiltroMes)list=list.filter(n=>(n.dataEmissao||"").startsWith(_nfFiltroMes));
  if(_nfFiltroForn)list=list.filter(n=>(n.fornecedor||"")===_nfFiltroForn);
  if(_nfFiltroContrato)list=list.filter(n=>n.contrato===_nfFiltroContrato);
  if(_nfFiltroStatus==="Pago")list=list.filter(n=>notaStatus(n).txt==="Pago");
  else if(_nfFiltroStatus==="APagar")list=list.filter(n=>notaStatus(n).txt!=="Pago");
  return list.sort((a,b)=>(b.dataEmissao||"").localeCompare(a.dataEmissao||""));
}
function vNotasFiscais(){
  const fornecedores=[...new Set(DB.compras_notas.map(n=>n.fornecedor).filter(Boolean))].sort();
  const list=notasFiltradas();
  const totalAPagar=list.filter(n=>notaStatus(n).txt!=="Pago").reduce((s,n)=>s+(+n.valor||0),0);
  const totalPago=list.filter(n=>notaStatus(n).txt==="Pago").reduce((s,n)=>s+(+n.valor||0),0);
  const semLancamento=DB.compras_notas.filter(n=>!n.lancado&&!n.dataRealizada).sort((a,b)=>(a.dataPrevista||"9999").localeCompare(b.dataPrevista||"9999"));
  main.innerHTML=`<div class="head"><div><h1>Notas Fiscais <span class="tag t-steel" style="font-size:13px;vertical-align:middle" id="nf_total">${list.length}</span></h1><p>Vinculadas a pedidos e/ou contratos, com controle de pagamento.</p></div><div class="acts"><button class="btn btn-g" onclick="exportNotasExcel()">⭳ Exportar Excel (respeita filtro)</button><button class="btn btn-a" onclick="formNota()">＋ Nova nota</button></div></div>
   ${semLancamento.length?`<div class="panel" style="border:2px solid var(--red);background:#fdf1ef;margin-bottom:16px"><div style="padding:14px 18px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:${semLancamento.length?'10px':'0'}"><span style="font-size:22px">🚨</span><b style="color:var(--red);font-size:15px">${semLancamento.length} nota(s) SEM LANÇAMENTO pra pagamento</b></div><div class="tblwrap"><table class="tbl" style="background:transparent"><tbody>${
     semLancamento.map(n=>{const st=notaStatus(n);return `<tr><td><b>${esc(n.numero)}</b></td><td>${esc(n.fornecedor||"—")}</td><td class="num">R$ ${(+n.valor||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}</td><td>${n.dataPrevista?`<span class="tag ${st.cls}">venc. ${fmt(n.dataPrevista)}</span>`:'<span class="tag t-red">sem vencimento definido</span>'}</td><td><button class="btn btn-a btn-sm" onclick="formNota('${n.id}')">Lançar agora</button></td></tr>`;}).join("")
   }</tbody></table></div></div></div>`:''}

function sugerirVencimentoNota(){
  const emissao=$("#nf_emissao")?.value;const prazoEl=$("#nf_prazo");
  if(!emissao||!prazoEl||prazoEl.value)return;
  prazoEl.value=iso(new Date(pd(emissao).getTime()+30*MS));
}
function atualizarOcsDaNota(){
  const pedidoId=$("#nf_pedido")?.value;const wrap=$("#nf_ocwrap"),sel=$("#nf_oc");if(!wrap||!sel)return;
  if(!pedidoId){wrap.style.display="none";sel.innerHTML="";return;}
  const p=DB.compras_pedidos.find(x=>x.id===pedidoId);
  const ocs=(p&&p.ordensCompra)||[];
  if(ocs.length<=1){wrap.style.display="none";sel.innerHTML=ocs.length?`<option value="${ocs[0].id}">${esc(ocs[0].numero||"OC")}</option>`:"";return;}
  wrap.style.display="block";
  sel.innerHTML=`<option value="">— não especificar —</option>`+ocs.map(oc=>`<option value="${oc.id}" ${oc.id===window._nfOcSelecionada?"selected":""}>${esc(oc.numero||"(sem número)")} — ${esc(oc.fornecedor||"?")}</option>`).join("");
}
function salvarNota(id){
  const numero=$("#nf_num").value.trim(),valor=$("#nf_valor").value,dataEmissao=$("#nf_emissao").value;
  const dataPrevista=$("#nf_prazo").value,formaPagamento=$("#nf_forma").value,tipoNota=$("#nf_tipo").value,pedido=$("#nf_pedido").value;
  const lancadoAntes=id?(DB.compras_notas.find(x=>x.id===id)||{}).lancado:false;
  if(!numero||!valor||!dataEmissao){toast("Preencha número, valor e emissão.");return;}
  if(!dataPrevista){toast("Preencha a data de vencimento.");return;}
  if(!formaPagamento){toast("Selecione a forma de pagamento.");return;}
  if(tipoNota==="Nota de Frete"){
    if(!pedido){toast("Nota de Frete precisa de um pedido vinculado.");return;}
    const temNotaMaterial=DB.compras_notas.some(n=>n.id!==id&&n.pedido===pedido&&n.tipoNota==="Nota Fiscal de Material");
    if(!temNotaMaterial){toast("Esse pedido ainda não tem Nota Fiscal de Material lançada — lança ela primeiro, depois a nota de frete.");return;}
  }
  let linkFluig=$("#nf_fluiglink").value.trim();
  if(linkFluig&&!/^https?:\/\//i.test(linkFluig))linkFluig="https://"+linkFluig;
  const lancadoAgora=$("#nf_lancado").checked;
  const o={id:id||uid(),numero,tipoNota,fornecedor:$("#nf_forn").value.trim(),pedido,ordemCompraId:$("#nf_oc")?.value||"",contrato:$("#nf_contrato").value,dataEmissao,valor,numeroFluig:$("#nf_fluig").value.trim(),linkFluig,dataPrevista,formaPagamento,lancado:lancadoAgora,dataRealizada:$("#nf_realizada").value,notaRemessaNumero:$("#nf_temremessa").checked?$("#nf_remessanum").value.trim():"",notaRemessaData:$("#nf_temremessa").checked?$("#nf_remessadata").value:"",anexos:_anexosTemp.slice(),obs:$("#nf_obs").value.trim()};
  if(id){const i=DB.compras_notas.findIndex(x=>x.id===id);DB.compras_notas[i]=o;}else DB.compras_notas.push(o);
  save("compras_notas");closeModal();render();
  toast((!lancadoAntes&&lancadoAgora)?"Nota salva — marcada como enviada pra pagamento.":"Nota salva.");
}
function delNota(id){if(!confirm("Excluir esta nota?"))return;DB.compras_notas=DB.compras_notas.filter(x=>x.id!==id);save("compras_notas");closeModal();render();toast("Excluída.");}
function exportNotasExcel(){
  if(typeof XLSX==="undefined"){toast("Excel indisponível offline.");return;}

  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{"—":"sem dados"}]),"Notas Fiscais");

}

let _logoTemp="";
function processarAnexo(file,maxDim,callback){
  if(file.type.startsWith("image/")){
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1,maxDim/Math.max(img.width,img.height));
        const w=Math.round(img.width*scale)||1,h=Math.round(img.height*scale)||1;
        const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,w,h);
        callback({nome:file.name,dados:canvas.toDataURL("image/jpeg",0.78),tipo:"image"});
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  }else{
    const reader=new FileReader();
    reader.onload=ev=>{callback({nome:file.name,dados:ev.target.result,tipo:"file"});};
    reader.readAsDataURL(file);
  }
}
function iconeAnexo(a){return a.tipo==="image"?`<img src="${a.dados}" style="width:40px;height:40px;object-fit:cover;border-radius:6px;border:1px solid #eef0ec">`:`<span style="font-size:24px">📄</span>`;}

}
function onAnexoSelect(e,containerId){
  const files=Array.from(e.target.files||[]);if(!files.length)return;
  let pendentes=files.length;
  files.forEach(file=>{
    processarAnexo(file,1500,a=>{_anexosTemp.push(a);pendentes--;if(pendentes===0)renderAnexosTemp(containerId);});
  });
  e.target.value="";
}
function removerAnexoTemp(i,containerId){_anexosTemp.splice(i,1);renderAnexosTemp(containerId);}

function onLogoSelect(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const size=160;const canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;
      const ctx=canvas.getContext('2d');ctx.fillStyle="#ffffff";ctx.fillRect(0,0,size,size);
      const ratio=Math.min(size/img.width,size/img.height);const w=img.width*ratio,h=img.height*ratio;
      ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
      _logoTemp=canvas.toDataURL('image/png');
      const pv=$("#fo_logoPreview");if(pv)pv.innerHTML=`<img src="${_logoTemp}" style="width:56px;height:56px;object-fit:contain;border-radius:8px;border:1px solid #eef0ec;background:#fff;display:block">`;
      const lb=$("#fo_logoLabel");if(lb)lb.textContent="🖼 Trocar logo";
      const rb=$("#fo_logoRemoveBtn");if(rb)rb.style.display="inline-flex";
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

/* ============ ADMISSÕES & DESLIGAMENTOS ============ */
function efetivoNaData(dataStr){
  const d=pd(dataStr);if(!d)return[];
  return DB.func.filter(f=>{if(!f.admissao)return false;const adm=pd(f.admissao);if(adm>d)return false;if(f.demissao){const dem=pd(f.demissao);if(dem<=d)return false;}return true;});
}
function contagemPorFuncao(lista){const map={};lista.forEach(f=>{const fn=f.funcao||"(sem função)";map[fn]=(map[fn]||0)+1;});return map;}
let _contPeriodo={de:"",ate:""};
function setPeriodoContratacao(tipo){
  const hoje=today();
  let de;
  if(tipo==="semana")de=new Date(hoje.getTime()-7*MS);
  else if(tipo==="quinzena")de=new Date(hoje.getTime()-14*MS);
  else if(tipo==="mes")de=new Date(hoje.getFullYear(),hoje.getMonth()-1,hoje.getDate());
  else if(tipo==="mesatual")de=new Date(hoje.getFullYear(),hoje.getMonth(),1);
  _contPeriodo={de:iso(de),ate:iso(hoje)};
  renderContratacao();
}

   </div>
   <div id="cont_body"></div>`;
  renderContratacao();

function evolucaoSamples(inicioStr,fimStr,gran){
  const inicio=pd(inicioStr),fim=pd(fimStr);
  if(!inicio||!fim||inicio>fim)return[];
  const samples=[];let cur=new Date(inicio);
  while(cur<=fim){
    samples.push(new Date(cur));
    if(gran==="semanal")cur=new Date(cur.getTime()+7*MS);
    else if(gran==="quinzenal")cur=new Date(cur.getTime()+14*MS);
    else cur=new Date(cur.getFullYear(),cur.getMonth()+1,cur.getDate());
  }
  if(!samples.length||samples[samples.length-1].getTime()!==fim.getTime())samples.push(fim);
  return samples;
}
function renderGraficoEvolucao(){
  const canvas=$("#ev_canvas");if(!canvas)return;
  const {de,ate,gran}=_evolPeriodo;
  const samples=evolucaoSamples(de,ate,gran);
  if(!samples.length)return;
  const labels=samples.map(d=>fmt(iso(d)));
  const dados=samples.map(d=>efetivoNaData(iso(d)).length);
  if(_chartEvol)_chartEvol.destroy();
  if(typeof Chart==="undefined")return;
  _chartEvol=new Chart(canvas.getContext("2d"),{
    type:"line",
    data:{labels,datasets:[{label:"Efetivo ativo",data:dados,borderColor:"#97d700",backgroundColor:"rgba(151,215,0,.15)",fill:true,tension:.25,pointRadius:3,pointBackgroundColor:"#0f413e"}]},
    options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}
  });
}
function renderContratacao(){
  const el=$("#cont_body");if(!el)return;
  const {de,ate}=_contPeriodo;
  if(!de||!ate){el.innerHTML=`<div class="empty"><p>Escolha o período.</p></div>`;return;}
  const efetivoInicio=contagemPorFuncao(efetivoNaData(de));
  const diaSeguinteAte=iso(new Date(pd(ate).getTime()+MS));
  const efetivoFim=contagemPorFuncao(efetivoNaData(diaSeguinteAte));
  const admitidos=DB.func.filter(f=>f.admissao&&f.admissao>=de&&f.admissao<=ate).sort((a,b)=>a.admissao<b.admissao?-1:1);

function exportContratacaoExcel(){
  if(typeof XLSX==="undefined"){toast("Excel indisponível offline.");return;}
  const {de,ate}=_contPeriodo;
  const efetivoInicio=contagemPorFuncao(efetivoNaData(de));
  const diaSeguinteAte=iso(new Date(pd(ate).getTime()+MS));
  const efetivoFim=contagemPorFuncao(efetivoNaData(diaSeguinteAte));
  const admitidos=DB.func.filter(f=>f.admissao&&f.admissao>=de&&f.admissao<=ate);
  const desligados=DB.func.filter(f=>f.demissao&&f.demissao>=de&&f.demissao<=ate);
  const admPorFuncao=contagemPorFuncao(admitidos);
  const desPorFuncao=contagemPorFuncao(desligados);
  const funcoes=[...new Set([...Object.keys(efetivoInicio),...Object.keys(efetivoFim),...Object.keys(admPorFuncao),...Object.keys(desPorFuncao)])].sort((a,b)=>a.localeCompare(b,"pt-BR"));
  const resumo=funcoes.map(fn=>({Função:fn,"Efetivo início":efetivoInicio[fn]||0,Entradas:admPorFuncao[fn]||0,Saídas:desPorFuncao[fn]||0,"Efetivo fim":efetivoFim[fn]||0,Variação:(efetivoFim[fn]||0)-(efetivoInicio[fn]||0)}));
  const admRows=admitidos.map(f=>({Nome:f.nome,Função:f.funcao||"",Empresa:f.empresa||"",Admissão:f.admissao}));
  const desRows=desligados.map(f=>({Nome:f.nome,Função:f.funcao||"",Empresa:f.empresa||"",Desligamento:f.demissao,Motivo:f.motivoDesligamento||""}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(resumo.length?resumo:[{"—":"sem dados"}]),"Resumo por cargo");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(admRows.length?admRows:[{"—":"sem dados"}]),"Admissões");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(desRows.length?desRows:[{"—":"sem dados"}]),"Desligamentos");
  XLSX.writeFile(wb,"admissoes-desligamentos-"+de+"_a_"+ate+".xlsx");toast("Exportado.");
}

  const reprovado=c.status==="Reprovado";
  const hist=c.statusHistorico||[];
  openModal(`<div class="modal-h"><h3>${esc(c.nome)}</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-b">
   ${reprovado?`<p class="hint" style="color:var(--red);margin-bottom:14px">✗ Reprovado</p>`:`<div class="step">${STATUS_CANDIDATO.map((s,i)=>`<span class="s ${i<idxAtual?'done':i===idxAtual?'cur':''}">${s}</span>${i<STATUS_CANDIDATO.length-1?'<span class="arrow">→</span>':''}`).join("")}</div>`}
   <p class="break"><b>Vaga:</b> ${esc(c.vaga||"—")}<br><b>Localidade:</b> ${esc(c.localidade||"—")}<br><b>Telefone:</b> ${esc(c.telefone||"—")}${c.email?` · <b>E-mail:</b> ${esc(c.email)}`:""}<br><b>Recebido em:</b> ${fmt(c.dataRecebimento)}${c.obs?`<br><b>Obs:</b> ${esc(c.obs)}`:""}</p>
   ${(c.anexos&&c.anexos.length)?`<h3 style="font-size:14px;margin:14px 0 8px">Anexos (${c.anexos.length})</h3><div style="border:1px solid #eef0ec;border-radius:8px;padding:8px 12px;margin-bottom:14px">${c.anexos.map(a=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f2f3f1">${iconeAnexo(a)}<span style="flex:1;font-size:13px">${esc(a.nome)}</span><a href="${a.dados}" target="_blank" download="${esc(a.nome)}" class="btn btn-g btn-sm">Ver</a></div>`).join("")}</div>`:""}
   <h3 style="font-size:14px;margin:14px 0 8px">Linha do tempo do processo</h3>
   <table class="tbl" style="border:1px solid #eef0ec;border-radius:8px"><thead><tr><th>Etapa</th><th>Data</th><th>Dias nessa etapa</th></tr></thead><tbody>${
     hist.map((h,i)=>{const prox=hist[i+1];const dias=prox?diasEntre(pd(h.data),pd(prox.data)):diasEntre(pd(h.data),today());return `<tr><td>${esc(h.status)}</td><td>${fmt(h.data)}</td><td class="num">${dias}d${!prox?' <small style="color:var(--muted)">(em andamento)</small>':''}</td></tr>`;}).join("")
   }</tbody></table>
   <p class="hint" style="margin-top:10px">Total desde o recebimento: <b>${diasEntre(pd(c.dataRecebimento),reprovado||c.status==="Admitido"?pd(hist.slice(-1)[0].data):today())}d</b></p>
   </div>
   <div class="modal-f">
     <button class="btn btn-g" style="margin-right:auto;color:var(--red)" onclick="delCandidato('${id}')">Excluir</button>
     <button class="btn btn-g" onclick="formCandidato('${id}')">Editar dados</button>
     ${!reprovado&&c.status!=="Admitido"?`<button class="btn btn-g" style="color:var(--red)" onclick="reprovarCandidato('${id}')">Reprovar</button>`:""}
     ${!reprovado&&idxAtual<STATUS_CANDIDATO.length-1?`<button class="btn btn-a" onclick="avancarStatusCandidato('${id}')">Avançar → ${STATUS_CANDIDATO[idxAtual+1]}</button>`:""}
   </div>`);
}
function avancarStatusCandidato(id){
  const c=candidatosList().find(x=>x.id===id);
  const idxAtual=STATUS_CANDIDATO.indexOf(c.status);
  const proximo=STATUS_CANDIDATO[idxAtual+1];
  const dataEtapa=prompt("Data em que essa etapa ('"+proximo+"') aconteceu:",iso(today()));
  if(dataEtapa===null)return;
  c.status=proximo;(c.statusHistorico=c.statusHistorico||[]).push({status:proximo,data:dataEtapa||iso(today())});
  let msgExtra="";
  if(proximo==="Admitido"&&c.vagaAbertaId){
    const v=DB.vagas_abertas.find(x=>x.id===c.vagaAbertaId);
    if(v&&v.status!=="Preenchida"){
      const admitidos=admitidosNaVaga(v.id);
      if(admitidos>=(v.quantidade||1)){v.status="Preenchida";save("vagas_abertas");msgExtra=" Vaga preenchida ("+admitidos+"/"+(v.quantidade||1)+")!";}
      else msgExtra=" Vaga com "+admitidos+"/"+(v.quantidade||1)+" preenchidas.";
    }
  }
  save("mobilizacoes");closeModal();render();toast("Avançou para "+proximo+"."+msgExtra);
}
function reprovarCandidato(id){
  if(!confirm("Marcar esse candidato como reprovado?"))return;
  const c=candidatosList().find(x=>x.id===id);
  c.status="Reprovado";(c.statusHistorico=c.statusHistorico||[]).push({status:"Reprovado",data:iso(today())});
  save("mobilizacoes");closeModal();render();toast("Candidato reprovado.");
}
function exportCandidatosExcel(){
  if(typeof XLSX==="undefined"){toast("Excel indisponível offline.");return;}
  const rows=candidatosList().map(c=>{
    const hist=c.statusHistorico||[];
    const get=s=>{const h=hist.find(x=>x.status===s);return h?h.data:"";};
    const v=c.vagaAbertaId?DB.vagas_abertas.find(x=>x.id===c.vagaAbertaId):null;
    return{Nome:c.nome,Telefone:c.telefone||"",Localidade:c.localidade||"",Vaga:c.vaga||"","Tipo de vaga":v?v.tipoVaga:"","Vagas necessárias":v?(v.quantidade||1):"",Status:c.status,"Recebido em":c.dataRecebimento,"Aprovado em":get("Aprovado"),"Enviado p/ sede em":get("Enviado para a sede"),"ASO em":get("Fazendo ASO"),"Liberado em":get("Liberado para contratação"),"Admitido em":get("Admitido"),"Dias totais":diasEntre(pd(c.dataRecebimento),(c.status==="Admitido"||c.status==="Reprovado")?pd(hist.slice(-1)[0]?.data||c.dataRecebimento):today()),Obs:c.obs||""};
  });
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{"—":"sem dados"}]),"Recrutamento");
  XLSX.writeFile(wb,"recrutamento-"+iso(today())+".xlsx");toast("Exportado.");
}

load();if(!SUPA.url){seed();seedVeiculos();}buildNav();render();
if(SUPA.url){loadFromSupabase();setInterval(()=>{if(!ov.classList.contains("on")&&_pendingWrites===0&&!document.hidden)loadFromSupabase();},90000);document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!ov.classList.contains("on")&&_pendingWrites===0)loadFromSupabase();});}
</script>
</body>
