const SENHA_ALMOXARIFADO="2711";
function salvarEstoqueMov(itemId,tipo){
  const qtd=+$("#em_qtd").value,data=$("#em_data").value;
  if(!qtd||qtd<=0){toast("Informe a quantidade.");return;}
  if(!data){toast("Informe a data.");return;}
  const it=DB.compras_estoque.find(x=>x.id===itemId);
  let destinoTipo="",funcionario="",destinoLocal="",retiradoPor="",responsabilidade=false,origemTipo="",funcDevolveu="",estadoItem="",recebidoPor="",pedidoOrigem="",fornecedorOrigem="";
  if(tipo==="Saída"){
    destinoTipo=$("#em_desttipo").value;
    funcionario=destinoTipo==="Funcionário"?$("#em_func").value:"";
    destinoLocal=destinoTipo==="Local"?$("#em_alojamento").value:"";
    responsabilidade=destinoTipo==="Funcionário"?$("#em_resp").checked:false;
    retiradoPor=$("#em_retirado").value.trim();
    if(!retiradoPor){toast("Informe quem retirou o item.");return;}
    if(qtd>(+it.quantidadeAtual||0)){if(!confirm("Quantidade maior que o estoque atual ("+(it.quantidadeAtual||0)+"). Registrar mesmo assim?"))return;}
  }
  if(tipo==="Entrada"){
    origemTipo=$("#em_origemtipo").value;
    if(origemTipo==="Devolução"){
      funcDevolveu=$("#em_func_devol").value;
      estadoItem=$("#em_estado").value;
      recebidoPor=$("#em_recebido").value.trim();
      if(!recebidoPor){toast("Informe quem recebeu a devolução.");return;}
    }else{
      pedidoOrigem=$("#em_pedido")?.value||"";
      fornecedorOrigem=$("#em_fornecedor")?.value.trim()||"";
    }
  }
  const senha=prompt("Senha do almoxarifado pra confirmar essa "+tipo.toLowerCase()+":");
  if(senha===null)return;
  if(!senhaOk(senha,SENHA_ALMOXARIFADO)){toast("Senha incorreta — ação cancelada.");return;}
  const mv={id:uid(),item:itemId,tipo,quantidade:qtd,data,destinoTipo,funcionario,destinoLocal,responsabilidade,retiradoPor,origemTipo,funcDevolveu,estadoItem,recebidoPor,pedidoOrigem,fornecedorOrigem,obs:$("#em_obs").value.trim()};
  DB.compras_estoque_mov.push(mv);save("compras_estoque_mov");
  it.quantidadeAtual=Math.max(0,(+it.quantidadeAtual||0)+(tipo==="Entrada"?qtd:-qtd));
  save("compras_estoque");
  if(tipo==="Saída"&&destinoTipo==="Local"&&destinoLocal){adicionarItemAoLocal(destinoLocal,it.nome,qtd);}
  closeModal();render();toast(tipo+" registrada."+(tipo==="Saída"&&destinoTipo==="Local"?" Item também somado na lista do local.":""));
}
function adicionarItemAoLocal(localId,nomeItem,qtd){
  const l=DB.locais.find(x=>x.id===localId);if(!l)return;
  l.itensLocal=l.itensLocal||[];
  const existente=l.itensLocal.find(it=>it.nome.toLowerCase()===nomeItem.toLowerCase());
  if(existente&&/^\d+([.,]\d+)?$/.test((existente.quantidade||"").trim())){
    existente.quantidade=String(parseFloat(existente.quantidade.replace(",","."))+qtd);
  }else if(existente){
    existente.quantidade=(existente.quantidade||"")+" +"+qtd;
  }else{
    l.itensLocal.push({nome:nomeItem,quantidade:String(qtd)});
  }
  save("locais");
}

function mesesEntre(de,ate){

}

  const wb=XLSX.utils.book_new();

  add(resumo,"Resumo mensal");add(matriz,"Contrato x mês");add(porSeg,"Por segmento");add(detalhe,"Detalhe");

function salvarLancamentoRapido(idx,mes){
  const item=window._ctlItensAtuais[idx];
  if(!item)return;
  let linkFluig=$("#lr_fluiglink").value.trim();
  if(linkFluig&&!/^https?:\/\//i.test(linkFluig))linkFluig="https://"+linkFluig;
  const dia=$("#lr_dia").value,valor=$("#lr_valor").value,vencimento=$("#lr_vencimento").value,fluig=$("#lr_fluig").value.trim(),obs=$("#lr_obs").value.trim(),lancadoAgora=$("#lr_lancado").checked;
  const c=DB.compras_contratos.find(x=>x.id===item.contratoId);
  const nota=$("#lr_nota").value.trim();
  if(nota){
    const exMed=item.tipo==="medicao"?(c.medicoes||[]).find(x=>x.mesReferencia===mes):null;
    const dupN=notaJaUsadaEmLancamento(nota,item.fornecedor||c.fornecedor,{medId:exMed?exMed.id:null,ceId:item.tipo==="custoExtra"?item.ceId:null,mes});
    if(dupN){toast("🚫 A nota/fatura "+nota+" desse fornecedor já foi usada em outro lançamento (contrato "+dupN.contrato+", "+mesLabel(dupN.mes)+").");return;}
  }
  if(item.tipo==="medicao"){
    c.medicoes=c.medicoes||[];
    let m=c.medicoes.find(x=>x.mesReferencia===mes);
    if(!m){m={id:uid(),mesReferencia:mes,status:"Aguardando fatura ou medição"};c.medicoes.push(m);}
    if(lancadoAgora)m.status="Faturamento enviado para pagamento (Central de Notas)";
    m.dataLancamento=dia;m.valorLancado=valor;m.dataVencimento=vencimento;m.numeroNota=nota;m.numeroFluig=fluig;m.linkFluig=linkFluig;m.obs=obs;
  }else{
    const ce=(c.custosExtras||[]).find(x=>x.id===item.ceId);
    ce.lancamentos=ce.lancamentos||[];
    let l=ce.lancamentos.find(x=>x.mesReferencia===mes);
    if(!l){l={mesReferencia:mes};ce.lancamentos.push(l);}
    l.dia=dia;l.valor=valor;l.vencimento=vencimento;l.nota=nota;l.fluig=fluig;l.fluigLink=linkFluig;l.lancado=lancadoAgora;
  }
  save("compras_contratos");closeModal();render();toast("Salvo.");
}

let _nfFiltroMes="",_nfFiltroForn="",_nfFiltroStatus="",_nfFiltroContrato="";
function notasFiltradas(){
  let list=DB.compras_notas.slice();
  if(_nfFiltroMes)list=list.filter(n=>String(n.dataEmissao||"").startsWith(_nfFiltroMes));
  if(_nfFiltroForn)list=list.filter(n=>(n.fornecedor||"")===_nfFiltroForn);
  if(_nfFiltroContrato)list=list.filter(n=>n.contrato===_nfFiltroContrato);
  if(_nfFiltroStatus==="Pago")list=list.filter(n=>notaStatus(n).txt==="Pago");
  else if(_nfFiltroStatus==="APagar")list=list.filter(n=>notaStatus(n).txt!=="Pago");
  return list.sort((a,b)=>String(b.dataEmissao||"").localeCompare(String(a.dataEmissao||"")));
}
function bannerPedidosSemNota(){

  const atrasados=lista.filter(p=>{const pr=prazoNotaPedido(p);return pr&&pd(pr)<today();}).length;
  const linhas=lista.map(p=>{

async function extrairTextoPdf(file){
  if(typeof pdfjsLib==="undefined")throw new Error("OFFLINE");
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let textoCompleto="";
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i);
    const content=await page.getTextContent();
    const linha=content.items.map(it=>it.str).join(" ");
    textoCompleto+=(i>1?"\n\n--- página "+i+" ---\n\n":"")+linha;
  }
  return textoCompleto.trim();
}
async function lerPdfParaNota(event){
  const file=event.target.files[0];if(!file)return;
  const wrap=$("#nf_pdftexto_wrap");
  if(wrap)wrap.innerHTML='<p class="hint">Lendo o PDF...</p>';
  try{
    const texto=await extrairTextoPdf(file);
    if(!texto){
      if(wrap)wrap.innerHTML='<p class="hint" style="color:var(--amber-d)">Não achei texto nesse PDF — pode ser uma imagem escaneada (sem texto real dentro). Nesse caso não dá pra extrair automaticamente, só digitar manualmente olhando o PDF.</p>';
    }else if(wrap){
      wrap.innerHTML=`<p class="hint" style="margin-bottom:6px">Texto extraído do PDF — seleciona e copia o que precisar pros campos abaixo:</p><textarea readonly style="width:100%;min-height:160px;font-family:monospace;font-size:12px;padding:8px;border:1px solid #dcdfe3;border-radius:8px">${esc(texto)}</textarea>`;
    }
  }catch(err){
    console.error(err);
    if(wrap)wrap.innerHTML=err.message==="OFFLINE"?'<p class="hint" style="color:var(--red)">Leitor de PDF indisponível offline — precisa de internet pra essa função.</p>':'<p class="hint" style="color:var(--red)">Não consegui ler esse PDF — confere se o arquivo não está corrompido ou protegido por senha.</p>';
  }
  event.target.value="";
}

  const file=event.target.files[0];if(!file)return;

function movimentosFornecedor(nome){
  const alvo=normalizaNome(nome||"");
  const mov=[];
  DB.compras_notas.forEach(n=>{
    if(normalizaNome(n.fornecedor||"")!==alvo)return;
    const ped=n.pedido?DB.compras_pedidos.find(p=>p.id===n.pedido):null;
    const oc=(ped&&n.ordemCompraId)?(ped.ordensCompra||[]).find(o=>o.id===n.ordemCompraId):null;
    const ct=n.contrato?DB.compras_contratos.find(c=>c.id===n.contrato):null;
    mov.push({data:n.dataEmissao||"",origem:"Nota fiscal",doc:"NF "+(n.numero||"—"),pedido:ped?resumoItensPedido(ped):"",pedidoData:ped?ped.data:"",oc:oc?(oc.numero||""):"",contrato:ct?ct.numero:"",valor:+n.valor||0,conta:true,obs:""});
  });
  DB.compras_despesas.forEach(d=>{
    if(normalizaNome(d.fornecedor||"")!==alvo)return;
    const ct=d.contrato?DB.compras_contratos.find(c=>c.id===d.contrato):null;
    mov.push({data:d.data||"",origem:"Despesa",doc:d.descricao||d.categoria||"—",pedido:"",pedidoData:"",oc:"",contrato:ct?ct.numero:"",valor:+d.valor||0,conta:true,obs:d.categoria||""});
  });
  const foAlvo=DB.compras_fornecedores.find(f=>normalizaNome(f.nome)===alvo);
  const ligado=c=>!!(foAlvo&&(foAlvo.contratos||[]).includes(c.id));
  const notaCobre=(c,valor,mes,porMes)=>DB.compras_notas.some(n=>n.contrato===c.id&&(Math.abs((+n.valor||0)-valor)<0.01||(porMes&&mesRef(n.dataEmissao)===mes)));
  DB.compras_contratos.forEach(c=>{
    if(normalizaNome(c.fornecedor||"")===alvo||ligado(c)){
      (c.medicoes||[]).forEach(m=>{
        if(m.valorLancado===undefined||m.valorLancado==="")return;
        const v=+m.valorLancado||0,lanc=m.status==="Faturamento enviado para pagamento (Central de Notas)";
        let conta=lanc,obs="";
        if(!lanc)obs="valor previsto (ainda não lançado)";
        else if(notaCobre(c,v,m.mesReferencia,true)){conta=false;obs="já contado pela nota fiscal ligada a este contrato";}
        mov.push({data:m.dataLancamento||(m.mesReferencia?m.mesReferencia+"-01":""),origem:"Contrato (medição)",doc:"Medição "+mesLabel(m.mesReferencia)+(m.numeroNota?" — NF/Fatura "+m.numeroNota:""),pedido:"",pedidoData:"",oc:"",contrato:c.numero,valor:v,conta,obs});
      });
    }
    (c.custosExtras||[]).forEach(ce=>{
      if(normalizaNome(ce.fornecedor||c.fornecedor||"")!==alvo&&!(ligado(c)&&!ce.fornecedor))return;
      (ce.lancamentos||[]).forEach(l=>{
        if(l.valor===undefined||l.valor==="")return;
        const v=+l.valor||0,lanc=l.lancado!==false;
        let conta=lanc,obs="";
        if(!lanc)obs="valor previsto (ainda não lançado)";
        else if(notaCobre(c,v,l.mesReferencia,false)){conta=false;obs="já contado pela nota fiscal ligada a este contrato";}
        mov.push({data:l.dia||(l.mesReferencia?l.mesReferencia+"-01":""),origem:"Contrato ("+ce.tipo+")",doc:ce.tipo+" "+mesLabel(l.mesReferencia)+(l.nota?" — NF/Fatura "+l.nota:""),pedido:"",pedidoData:"",oc:"",contrato:c.numero,valor:v,conta,obs});
      });
    });
  });
  return mov.sort((a,b)=>(b.data||"").localeCompare(a.data||""));
}

function exportGastosFornecedor(){

function exportGastosFornecedores(){
  if(typeof XLSX==="undefined"){toast("Excel indisponível offline.");return;}
  const nomesCad=DB.compras_fornecedores.map(f=>f.nome);
  const extras=new Set();
  DB.compras_notas.forEach(n=>{if(n.fornecedor)extras.add(n.fornecedor);});
  DB.compras_despesas.forEach(d=>{if(d.fornecedor)extras.add(d.fornecedor);});
  DB.compras_contratos.forEach(c=>{if(c.fornecedor)extras.add(c.fornecedor);});
  const cadNorm=new Set(nomesCad.map(normalizaNome));
  const naoCad=[...extras].filter(n=>!cadNorm.has(normalizaNome(n)));
  const todos=[...nomesCad.map(n=>({nome:n,cat:(DB.compras_fornecedores.find(f=>f.nome===n)||{}).categoria||""})),...naoCad.map(n=>({nome:n,cat:"Não cadastrado"}))];
  const resumo=[],detalhe=[];
  todos.forEach(f=>{
    const m=movimentosFornecedor(f.nome);if(!m.length)return;
    const soma=pre=>m.filter(x=>x.conta&&x.origem.startsWith(pre)).reduce((s,x)=>s+x.valor,0);
    const nf=soma("Nota"),dp=soma("Despesa"),ct=soma("Contrato");
    resumo.push({Fornecedor:f.nome,Categoria:f.cat,"Notas fiscais":nf,Despesas:dp,Contratos:ct,Total:nf+dp+ct});
    m.forEach(x=>detalhe.push({Fornecedor:f.nome,Data:x.data?fmt(x.data):"",Origem:x.origem,Documento:x.doc,"Nº OC":x.oc,Pedido:x.pedido,Contrato:x.contrato,Valor:x.valor,"Soma no total":x.conta?"Sim":"Não",Observação:x.obs}));
  });
  resumo.sort((a,b)=>b.Total-a.Total);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(resumo.length?resumo:[{"—":"sem dados"}]),"Resumo por fornecedor");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(detalhe.length?detalhe:[{"—":"sem dados"}]),"Detalhe");
  XLSX.writeFile(wb,"gastos-por-fornecedor-"+iso(today())+".xlsx");toast("Exportado.");
}
let _logoTemp="";
function processarAnexo(file,maxDim,callback){
  if(file.type.startsWith("image/")){
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1,maxDim/Math.max(img.width,img.height));
        const w=Math.round(img.width*scale)||1,h=Math.round(img.height*scale)||1;
        const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,w,h);
        callback({nome:file.name,dados:canvas.toDataURL("image/jpeg",0.78),tipo:"image"});
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  }else{
    const reader=new FileReader();
    reader.onload=ev=>{callback({nome:file.name,dados:ev.target.result,tipo:"file"});};
    reader.readAsDataURL(file);
  }
}
function iconeAnexo(a){return a.tipo==="image"?`<img src="${a.dados}" style="width:40px;height:40px;object-fit:cover;border-radius:6px;border:1px solid #eef0ec">`:`<span style="font-size:24px">📄</span>`;}

function efetivoNaData(dataStr){
  const d=pd(dataStr);if(!d)return[];
  return DB.func.filter(f=>{if(!f.admissao)return false;const adm=pd(f.admissao);if(adm>d)return false;if(f.demissao){const dem=pd(f.demissao);if(dem<=d)return false;}return true;});
}
function contagemPorFuncao(lista){const map={};lista.forEach(f=>{const fn=f.funcao||"(sem função)";map[fn]=(map[fn]||0)+1;});return map;}
let _contPeriodo={de:"",ate:""};
function setPeriodoContratacao(tipo){
  const hoje=today();

  if(tipo==="semana")de=new Date(hoje.getTime()-7*MS);
  else if(tipo==="quinzena")de=new Date(hoje.getTime()-14*MS);
  else if(tipo==="mes")de=new Date(hoje.getFullYear(),hoje.getMonth()-1,hoje.getDate());
  else if(tipo==="mesatual")de=new Date(hoje.getFullYear(),hoje.getMonth(),1);
  _contPeriodo={de:iso(de),ate:iso(hoje)};
  renderContratacao();
}

function evolucaoSamples(inicioStr,fimStr,gran){
  const inicio=pd(inicioStr),fim=pd(fimStr);
  if(!inicio||!fim||inicio>fim)return[];
  const samples=[];let cur=new Date(inicio);
  while(cur<=fim){
    samples.push(new Date(cur));
    if(gran==="semanal")cur=new Date(cur.getTime()+7*MS);
    else if(gran==="quinzenal")cur=new Date(cur.getTime()+14*MS);
    else cur=new Date(cur.getFullYear(),cur.getMonth()+1,cur.getDate());
  }
  if(!samples.length||samples[samples.length-1].getTime()!==fim.getTime())samples.push(fim);
  return samples;
}
function renderGraficoEvolucao(){
  const canvas=$("#ev_canvas");if(!canvas)return;
  const {de,ate,gran}=_evolPeriodo;
  const samples=evolucaoSamples(de,ate,gran);
  if(!samples.length)return;
  const labels=samples.map(d=>fmt(iso(d)));
  const dados=samples.map(d=>efetivoNaData(iso(d)).length);
  if(_chartEvol)_chartEvol.destroy();
  if(typeof Chart==="undefined")return;
  _chartEvol=new Chart(canvas.getContext("2d"),{
    type:"line",
    data:{labels,datasets:[{label:"Efetivo ativo",data:dados,borderColor:"#97d700",backgroundColor:"rgba(151,215,0,.15)",fill:true,tension:.25,pointRadius:3,pointBackgroundColor:"#0f413e"}]},
    options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}
  });
}

  const totInicio=Object.values(efetivoInicio).reduce((s,n)=>s+n,0);

  el.innerHTML=`

     <div class="stat amber"><div class="n">${totFim}</div><div class="l">Efetivo no fim (${fmt(ate)})</div></div>

   <div class="panel"><h2><span class="t">Por cargo</span></h2><div class="tblwrap"><table class="tbl"><thead><tr><th>Função</th><th>Efetivo no início</th><th>Entradas</th><th>Saídas</th><th>Efetivo no fim</th><th>Variação</th></tr></thead><tbody>${
     funcoes.map(fn=>{const ini=efetivoInicio[fn]||0,ent=admPorFuncao[fn]||0,sai=desPorFuncao[fn]||0,fim=efetivoFim[fn]||0,vari=fim-ini;
     return `<tr><td><b>${esc(fn)}</b></td><td class="num">${ini}</td><td class="num" style="color:var(--green)">${ent?"+"+ent:"—"}</td><td class="num" style="color:var(--red)">${sai?"−"+sai:"—"}</td><td class="num"><b>${fim}</b></td><td class="num"><span class="tag ${vari>0?'t-green':vari<0?'t-red':'t-grey'}">${vari>0?"+":""}${vari}</span></td></tr>`;}).join("")
   }<tr style="font-weight:700"><td>Total</td><td class="num">${totInicio}</td><td class="num" style="color:var(--green)">+${admitidos.length}</td><td class="num" style="color:var(--red)">−${desligados.length}</td><td class="num">${totFim}</td><td class="num">${totFim-totInicio>0?"+":""}${totFim-totInicio}</td></tr></tbody></table></div></div>

  if(typeof XLSX==="undefined"){toast("Excel indisponível offline.");return;}

}

   </div>
   <div class="panel"><h2><span class="t">📊 Andamento do processo <span class="hint">(currículos em cada etapa agora — mostra que está andando)</span></span></h2><div style="padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px">${
     porEtapa.map((e,i)=>`<div style="flex:1;min-width:110px;text-align:center;background:#f7f8f6;border-radius:8px;padding:10px 6px"><div style="font-size:20px;font-weight:700;color:${e.n?'var(--steel)':'#c7ccd3'}">${e.n}</div><div style="font-size:11px;color:var(--muted);margin-top:2px">${esc(e.status)}</div></div>${i<porEtapa.length-1?'<div style="align-self:center;color:#c7ccd3;font-size:16px">→</div>':''}`).join("")
   }</div></div>
   <div class="panel"><h2><span class="t">Vagas abertas</span></h2><div class="tblwrap">${ativas.length?`<table class="tbl"><thead><tr><th>Função</th><th>Tipo</th><th>Preenchimento</th><th>Aberto por</th><th>Criada em</th><th>Aprovada em</th><th></th></tr></thead><tbody>${
     ativas.map(v=>{const nec=+v.quantidade||1;const adm=admitidosNaVaga(v.id);const pct=Math.min(100,(adm/nec)*100);return `<tr><td><b>${esc(v.funcao)}</b></td><td><span class="tag ${v.tipoVaga==='Substituição'?'t-amber':v.tipoVaga==='Vaga nova'?'t-green':'t-steel'}">${esc(v.tipoVaga)}</span></td><td><b>${adm}/${nec}</b><div class="minibar" style="width:110px"><i style="width:${pct}%;background:${pct>=100?'var(--green)':'var(--amber)'}"></i></div></td><td>${esc(v.abertoPor||"—")}</td><td>${fmt(v.dataCriada)}</td><td>${v.dataAprovacao?fmt(v.dataAprovacao):'<span class="tag t-amber">aguardando</span>'}</td><td><button class="btn btn-g btn-sm" onclick="formVagaAberta('${v.id}')">Editar</button></td></tr>`;}).join("")
   }</tbody></table>`:`<div class="empty"><p>Nenhuma vaga aberta cadastrada ainda.</p></div>`}</div></div>
   <div class="toolbar"><select id="cand_vaga" onchange="_candFiltroVaga=this.value;renderCandidatosTbl()"><option value="">Todas as vagas</option>${DB.vagas_abertas.map(v=>`<option value="${v.id}" ${_candFiltroVaga===v.id?"selected":""}>${esc(v.funcao)} (${esc(v.tipoVaga)})</option>`).join("")}</select><select id="cand_status" onchange="_candFiltroStatus=this.value;renderCandidatosTbl()"><option value="">Todos os status</option>${STATUS_CANDIDATO.map(s=>`<option value="${s}" ${_candFiltroStatus===s?"selected":""}>${s}</option>`).join("")}<option value="Reprovado" ${_candFiltroStatus==="Reprovado"?"selected":""}>Reprovado</option></select><label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)"><input type="checkbox" id="cand_finalizados" style="width:auto" onchange="_candMostrarFinalizados=this.checked;renderCandidatosTbl()">Mostrar admitidos/reprovados</label><button class="btn btn-g btn-sm" onclick="exportCandidatosExcel()">⭳ Exportar Excel</button></div>
   <div id="cand_grupos"></div>`;
  renderCandidatosTbl();
}
function desbloquearRecrutamento(){
  const v=$("#area_restrita_senha").value;
  if(v===SENHA_MESTRA){_recrutUnlocked=true;render();}else{toast("Senha incorreta.");}
}
function renderCandidatosTbl(){
  let list=candidatosList();
  if(_candFiltroVaga)list=list.filter(c=>c.vagaAbertaId===_candFiltroVaga);
  if(_candFiltroStatus)list=list.filter(c=>c.status===_candFiltroStatus);
  else if(!_candMostrarFinalizados)list=list.filter(c=>c.status!=="Admitido"&&c.status!=="Reprovado");
  const el=$("#cand_grupos");if(!el)return;
  const totalEl=$("#cand_total");if(totalEl)totalEl.textContent=list.length;
  const statusCls={"Recebido":"t-grey","Em análise/Entrevista":"t-steel","Aprovado":"t-green","Enviado para a sede":"t-amber","Fazendo ASO":"t-amber","Liberado para contratação":"t-green","Admitido":"t-green","Reprovado":"t-red"};
  const grupos={};
  list.forEach(c=>{const k=c.vagaAbertaId||"__sem";(grupos[k]=grupos[k]||[]).push(c);});
  const chaves=Object.keys(grupos).sort((a,b)=>{if(a==="__sem")return 1;if(b==="__sem")return -1;const va=DB.vagas_abertas.find(x=>x.id===a),vb=DB.vagas_abertas.find(x=>x.id===b);return (va?va.funcao:"").localeCompare(vb?vb.funcao:"");});
  el.innerHTML=chaves.length?chaves.map(k=>{
    const v=k==="__sem"?null:DB.vagas_abertas.find(x=>x.id===k);
    const titulo=v?`${esc(v.funcao)} <span class="tag ${v.tipoVaga==='Substituição'?'t-amber':'t-green'}" style="font-size:11px">${esc(v.tipoVaga)}</span> <span class="tag t-steel" style="font-size:11px">${admitidosNaVaga(v.id)}/${v.quantidade||1} preenchidas</span>`:"📚 Banco de currículos (sem vaga aberta agora)";
    const itens=grupos[k].sort((a,b)=>(b.dataRecebimento||"").localeCompare(a.dataRecebimento||""));
    return `<div class="panel"><h2><span class="t">${titulo} <span class="tag t-steel">${itens.length}</span></span></h2><div class="tblwrap"><table class="tbl"><thead><tr><th>Nome</th><th>Localidade</th>${v?"":"<th>Função de interesse</th>"}<th>Status</th><th>Recebido em</th><th>Dias no processo</th><th></th></tr></thead><tbody>${
      itens.map(c=>{const dias=diasEntre(pd(c.dataRecebimento),c.status==="Admitido"||c.status==="Reprovado"?pd((c.statusHistorico||[]).slice(-1)[0]?.data||c.dataRecebimento):today());return `<tr><td><b>${esc(c.nome)}</b>${c.telefone?`<br><small style="color:var(--muted)">${esc(c.telefone)}</small>`:""}</td><td>${esc(c.localidade||"—")}</td>${v?"":`<td>${esc(c.vaga||"—")}</td>`}<td><span class="tag ${statusCls[c.status]||'t-grey'}">${esc(c.status)}</span></td><td>${fmt(c.dataRecebimento)}</td><td class="num">${dias}d</td><td><button class="btn btn-g btn-sm" onclick="verCandidato('${c.id}')">Ver / avançar</button></td></tr>`;}).join("")
    }</tbody></table></div></div>`;
  }).join(""):`<div class="panel"><div class="empty"><div class="big">🗂</div><p>Nenhum currículo encontrado.</p><button class="btn btn-a" onclick="formCandidato()">Novo currículo</button></div></div>`;
}
function formCandidato(id){
  const c=id?candidatosList().find(x=>x.id===id):{dataRecebimento:iso(today())};
  openModal(`<div class="modal-h"><h3>${id?"Editar":"Novo"} currículo</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-b">
   <div class="row2"><div class="fg"><label>Nome *</label><input id="cd_nome" value="${esc(c.nome)}"></div><div class="fg"><label>Telefone / WhatsApp</label><input id="cd_tel" value="${esc(c.telefone)}"></div></div>
   <div class="row2"><div class="fg"><label>Localidade <span class="opt">(cidade/bairro onde mora)</span></label><input id="cd_localidade" value="${esc(c.localidade)}" placeholder="ex.: Nova Lima, Belo Horizonte..."></div><div class="fg"><label>Data de recebimento *</label><input type="date" id="cd_data" value="${esc(c.dataRecebimento)}"></div></div>
   <div class="row2"><div class="fg"><label>Vaga</label><select id="cd_vaga" onchange="document.getElementById('cd_semvagawrap').style.display=this.value?'none':'block'"><option value="">— Banco de currículos (sem vaga aberta agora) —</option>${DB.vagas_abertas.map(v=>`<option value="${v.id}" ${v.id===c.vagaAbertaId?"selected":""}>${esc(v.funcao)} (${esc(v.tipoVaga)}) — ${esc(v.status)}</option>`).join("")}</select></div><div class="fg"><label>E-mail</label><input id="cd_email" value="${esc(c.email)}"></div></div>
   <div class="fg" id="cd_semvagawrap" style="display:${c.vagaAbertaId?"none":"block"}"><label>Função de interesse <span class="opt">(pra achar depois, quando abrir a vaga)</span></label><input id="cd_funcaointeresse" list="cd_funcaolist" value="${esc(c.vaga)}" placeholder="ex.: Pedreiro"><datalist id="cd_funcaolist">${funcoesConhecidas().map(f=>`<option value="${esc(f)}">`).join("")}</datalist></div>
   ${blocoAnexosHtml("cd_anexos","Currículo")}
   <div class="fg"><label>Observações</label><textarea id="cd_obs" rows="2">${esc(c.obs)}</textarea></div></div>
   <div class="modal-f">${id?`<button class="btn btn-g" style="margin-right:auto;color:var(--red)" onclick="delCandidato('${id}')">Excluir</button>`:""}<button class="btn btn-g" onclick="closeModal()">Cancelar</button><button class="btn btn-a" onclick="salvarCandidato('${id||""}')">Salvar</button></div>`);
  _anexosTemp=(c.anexos||[]).slice();
  renderAnexosTemp("cd_anexos");
}
function salvarCandidato(id){
  const nome=$("#cd_nome").value.trim();if(!nome){toast("Informe o nome.");return;}
  const dataRecebimento=$("#cd_data").value;if(!dataRecebimento){toast("Informe a data de recebimento.");return;}
  const vagaAbertaId=$("#cd_vaga").value;
  const vagaSel=DB.vagas_abertas.find(x=>x.id===vagaAbertaId);
  const vagaNome=vagaSel?vagaSel.funcao:$("#cd_funcaointeresse").value.trim();
  const localidade=$("#cd_localidade").value.trim();
  if(id){
    const c=candidatosList().find(x=>x.id===id);
    Object.assign(c,{nome,telefone:$("#cd_tel").value.trim(),email:$("#cd_email").value.trim(),localidade,vagaAbertaId,vaga:vagaNome,dataRecebimento,anexos:_anexosTemp.slice(),obs:$("#cd_obs").value.trim()});
    save("mobilizacoes");closeModal();render();toast("Currículo atualizado.");
    return;
  }
  const o={id:uid(),nome,telefone:$("#cd_tel").value.trim(),email:$("#cd_email").value.trim(),localidade,vagaAbertaId,vaga:vagaNome,dataRecebimento,anexos:_anexosTemp.slice(),obs:$("#cd_obs").value.trim(),status:"Recebido",statusHistorico:[{status:"Recebido",data:dataRecebimento}]};
  o.__candidato=true;DB.mobilizacoes.push(o);save("mobilizacoes");closeModal();render();toast("Currículo cadastrado.");
}
function delCandidato(id){if(!confirm("Excluir este currículo?"))return;DB.mobilizacoes=DB.mobilizacoes.filter(x=>x.id!==id);save("mobilizacoes");closeModal();render();toast("Excluído.");}
function verCandidato(id){
  const c=candidatosList().find(x=>x.id===id);
  const idxAtual=STATUS_CANDIDATO.indexOf(c.status);
  const reprovado=c.status==="Reprovado";
  const hist=c.statusHistorico||[];
  openModal(`<div class="modal-h"><h3>${esc(c.nome)}</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-b">
   ${reprovado?`<p class="hint" style="color:var(--red);margin-bottom:14px">✗ Reprovado${c.motivoReprovacao?" — "+esc(c.motivoReprovacao):""}</p>`:`<div class="step">${STATUS_CANDIDATO.map((s,i)=>`<span class="s ${i<idxAtual?'done':i===idxAtual?'cur':''}">${s}</span>${i<STATUS_CANDIDATO.length-1?'<span class="arrow">→</span>':''}`).join("")}</div>`}
   <p class="break"><b>Vaga:</b> ${esc(c.vaga||"—")}<br><b>Localidade:</b> ${esc(c.localidade||"—")}<br><b>Telefone:</b> ${esc(c.telefone||"—")}${c.email?` · <b>E-mail:</b> ${esc(c.email)}`:""}<br><b>Recebido em:</b> ${fmt(c.dataRecebimento)}${c.obs?`<br><b>Obs:</b> ${esc(c.obs)}`:""}</p>
   ${(c.anexos&&c.anexos.length)?`<h3 style="font-size:14px;margin:14px 0 8px">Anexos (${c.anexos.length})</h3><div style="border:1px solid #eef0ec;border-radius:8px;padding:8px 12px;margin-bottom:14px">${c.anexos.map(a=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f2f3f1">${iconeAnexo(a)}<span style="flex:1;font-size:13px">${esc(a.nome)}</span><a href="${a.dados}" target="_blank" download="${esc(a.nome)}" class="btn btn-g btn-sm">Ver</a></div>`).join("")}</div>`:""}
   <h3 style="font-size:14px;margin:14px 0 8px">Linha do tempo do processo</h3>
   <table class="tbl" style="border:1px solid #eef0ec;border-radius:8px"><thead><tr><th>Etapa</th><th>Data</th><th>Dias nessa etapa</th></tr></thead><tbody>${
     hist.map((h,i)=>{const prox=hist[i+1];const dias=prox?diasEntre(pd(h.data),pd(prox.data)):diasEntre(pd(h.data),today());return `<tr><td>${esc(h.status)}</td><td>${fmt(h.data)}</td><td class="num">${dias}d${!prox?' <small style="color:var(--muted)">(em andamento)</small>':''}</td></tr>`;}).join("")
   }</tbody></table>
   <p class="hint" style="margin-top:10px">Total desde o recebimento: <b>${diasEntre(pd(c.dataRecebimento),reprovado||c.status==="Admitido"?pd(hist.slice(-1)[0].data):today())}d</b></p>
   </div>
   <div class="modal-f">
     <button class="btn btn-g" style="margin-right:auto;color:var(--red)" onclick="delCandidato('${id}')">Excluir</button>
     <button class="btn btn-g" onclick="formCandidato('${id}')">Editar dados</button>
     ${!reprovado&&c.status!=="Admitido"?`<button class="btn btn-g" style="color:var(--red)" onclick="formReprovarCandidato('${id}')">Reprovar</button>`:""}
     ${!reprovado&&idxAtual<STATUS_CANDIDATO.length-1?`<button class="btn btn-a" onclick="avancarStatusCandidato('${id}')">Avançar → ${STATUS_CANDIDATO[idxAtual+1]}</button>`:""}
   </div>`);
}
function avancarStatusCandidato(id){
  const c=candidatosList().find(x=>x.id===id);
  const idxAtual=STATUS_CANDIDATO.indexOf(c.status);
  const proximo=STATUS_CANDIDATO[idxAtual+1];
  const dataEtapa=prompt("Data em que essa etapa ('"+proximo+"') aconteceu:",iso(today()));
  if(dataEtapa===null)return;
  c.status=proximo;(c.statusHistorico=c.statusHistorico||[]).push({status:proximo,data:dataEtapa||iso(today())});
  let msgExtra="";
  if(proximo==="Admitido"&&c.vagaAbertaId){
    const v=DB.vagas_abertas.find(x=>x.id===c.vagaAbertaId);
    if(v&&v.status!=="Preenchida"){
      const admitidos=admitidosNaVaga(v.id);
      if(admitidos>=(v.quantidade||1)){v.status="Preenchida";save("vagas_abertas");msgExtra=" Vaga preenchida ("+admitidos+"/"+(v.quantidade||1)+")!";}
      else msgExtra=" Vaga com "+admitidos+"/"+(v.quantidade||1)+" preenchidas.";
    }
  }
  save("mobilizacoes");closeModal();render();toast("Avançou para "+proximo+"."+msgExtra);
}
const MOTIVOS_REPROVACAO=["Já está empregado","Não tem mais interesse na vaga","Pretensão salarial incompatível","Não atende ao perfil técnico da vaga","Não compareceu / não respondeu","Vaga preenchida por outro candidato","Outro"];
function formReprovarCandidato(id){
  const c=candidatosList().find(x=>x.id===id);
  openModal(`<div class="modal-h"><h3>Reprovar ${esc(c.nome)}</h3><button class="x" onclick="verCandidato('${id}')">×</button></div><div class="modal-b">
   <p class="hint" style="margin-bottom:14px">Isso não precisa significar que a pessoa não é boa — várias vezes é só o momento ou a situação dela.</p>
   <div class="fg"><label>Motivo</label><select id="rp_motivo" onchange="document.getElementById('rp_outrowrap').style.display=this.value==='Outro'?'block':'none'">${MOTIVOS_REPROVACAO.map(m=>`<option>${m}</option>`).join("")}</select></div>
   <div class="fg" id="rp_outrowrap" style="display:none"><label>Qual motivo?</label><input id="rp_motivo_outro" placeholder="descreve o motivo"></div>
   </div><div class="modal-f"><button class="btn btn-g" onclick="verCandidato('${id}')">Cancelar</button><button class="btn btn-a" style="background:var(--red);color:#fff" onclick="confirmarReprovacao('${id}')">Confirmar reprovação</button></div>`);
}
function confirmarReprovacao(id){
  const motivoSel=$("#rp_motivo").value;
  const motivo=motivoSel==="Outro"?($("#rp_motivo_outro").value.trim()||"Outro"):motivoSel;
  const c=candidatosList().find(x=>x.id===id);
  c.status="Reprovado";c.motivoReprovacao=motivo;(c.statusHistorico=c.statusHistorico||[]).push({status:"Reprovado",data:iso(today())});
  save("mobilizacoes");closeModal();render();toast("Candidato reprovado.");
}
function exportCandidatosExcel(){
  if(typeof XLSX==="undefined"){toast("Excel indisponível offline.");return;}
  const rows=candidatosList().map(c=>{
    const hist=c.statusHistorico||[];
    const get=s=>{const h=hist.find(x=>x.status===s);return h?h.data:"";};
    const v=c.vagaAbertaId?DB.vagas_abertas.find(x=>x.id===c.vagaAbertaId):null;
    return{Nome:c.nome,Telefone:c.telefone||"",Localidade:c.localidade||"",Vaga:c.vaga||"","Tipo de vaga":v?v.tipoVaga:"","Vagas necessárias":v?(v.quantidade||1):"",Status:c.status,"Motivo reprovação":c.motivoReprovacao||"","Recebido em":c.dataRecebimento,"Aprovado em":get("Aprovado"),"Enviado p/ sede em":get("Enviado para a sede"),"ASO em":get("Fazendo ASO"),"Liberado em":get("Liberado para contratação"),"Admitido em":get("Admitido"),"Dias totais":diasEntre(pd(c.dataRecebimento),(c.status==="Admitido"||c.status==="Reprovado")?pd(hist.slice(-1)[0]?.data||c.dataRecebimento):today()),Obs:c.obs||""};
  });
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{"—":"sem dados"}]),"Recrutamento");
  XLSX.writeFile(wb,"recrutamento-"+iso(today())+".xlsx");toast("Exportado.");
}

_pendCarregar();load();if(!SUPA.url){seed();seedVeiculos();}buildNav();render();
if(SUPA.url){loadFromSupabase();setInterval(tickAtualizacao,30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)tickAtualizacao();});}
</script>
</body>
</html>
