<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central da Obra — GM.MG.00083 — Priner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --graphite:#0f413e; --graphite2:#145048; --line:#1d6058;
    --paper:#f5f6f4; --card:#ffffff; --ink:#1c2128; --muted:#6b7480;
    --amber:#97d700; --amber-d:#5c7d00; --steel:#2f6f8f; --steel-l:#e4eef3;
    --green:#2f8f57; --green-l:#e3f2ea; --red:#c0392b; --red-l:#fbe7e4;
    --shadow:0 1px 2px rgba(28,33,40,.06),0 4px 14px rgba(28,33,40,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink);line-height:1.45;font-size:15px}
  h1,h2,h3{letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit;font-size:15px}
  a{color:inherit}
  .app{display:flex;min-height:100vh}
  .nav{width:212px;background:var(--graphite);color:#c7ccd3;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#3a4854 var(--graphite)}
  .nav::-webkit-scrollbar{width:8px}
  .nav::-webkit-scrollbar-track{background:var(--graphite)}
  .nav::-webkit-scrollbar-thumb{background:#3a4854;border-radius:4px}
  .brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
  .brand b{color:#fff;font-size:17px;font-weight:700;letter-spacing:.02em;display:block;text-transform:uppercase}
  .brand span{font-size:11px;color:var(--amber);letter-spacing:.14em;text-transform:uppercase}
  .nav a.mi{display:flex;align-items:center;gap:10px;padding:11px 18px;color:#c7ccd3;font-size:14px;border-left:3px solid transparent;cursor:pointer;transition:.12s}
  .nav a.mi:hover{background:var(--graphite2);color:#fff}
  .nav a.mi.on{background:var(--graphite2);color:#fff;border-left-color:var(--amber)}
  .nav a.mi .ic{width:20px;text-align:center;font-size:15px}
  .nav .sec{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#6b7480;padding:14px 18px 6px}
  .nav .foot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);font-size:11px;color:#7b8593}
  .main{flex:1;min-width:0;padding:26px 30px 60px}
  .mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
  #idBanner:empty{display:none}
  .idbanner-bar{background:var(--amber-d);color:#fff;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;cursor:pointer;font-size:13.5px}
  .idbanner-bar b{font-size:14px}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .head h1{font-size:24px;font-weight:700}
  .head p{color:var(--muted);font-size:13px;margin-top:3px}
  .head .acts{display:flex;gap:10px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:8px;font-size:14px;font-weight:600;transition:.12s;white-space:nowrap}
  .btn-a{background:var(--amber);color:#0d2e2b} .btn-a:hover{background:var(--amber-d);color:#fff}
  .btn-s{background:var(--graphite);color:#fff} .btn-s:hover{background:#000}
  .btn-g{background:#eef0ee;color:var(--ink)} .btn-g:hover{background:#e2e5e2}
  .btn-sm{padding:6px 11px;font-size:13px;border-radius:7px}
  .grid{display:grid;gap:14px}
  .stats{grid-template-columns:repeat(auto-fit,minmax(148px,1fr));margin-bottom:22px}
  .stat{background:var(--card);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);border:1px solid #edefec}
  .stat .n{font-size:30px;font-weight:800;letter-spacing:-.02em}
  .stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
  .stat.amber .n{color:var(--amber-d)} .stat.steel .n{color:var(--steel)} .stat.green .n{color:var(--green)} .stat.red .n{color:var(--red)}
  .panel{background:var(--card);border-radius:12px;box-shadow:var(--shadow);border:1px solid #edefec;margin-bottom:20px;overflow:hidden}
  .panel h2{font-size:15px;padding:14px 18px;border-bottom:1px solid #eef0ec;display:flex;align-items:center;gap:8px;justify-content:space-between}
  .panel h2 .t{display:flex;align-items:center;gap:8px}
  .tbl{width:100%;border-collapse:collapse;font-size:14px}
  .tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:9px 18px;border-bottom:1px solid #eef0ec;font-weight:600;white-space:nowrap}
  .tbl td{padding:11px 18px;border-bottom:1px solid #f2f3f1;vertical-align:middle}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tr:hover td{background:#fafbf9}
  .tbl .rowact{display:flex;gap:6px}
  .num{font-variant-numeric:tabular-nums}
  .tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
  .t-green{background:var(--green-l);color:var(--green)} .t-amber{background:#fdf0d6;color:var(--amber-d)}
  .t-red{background:var(--red-l);color:var(--red)} .t-steel{background:var(--steel-l);color:var(--steel)} .t-grey{background:#eef0ee;color:var(--muted)}
  .empty{text-align:center;padding:38px 20px;color:var(--muted)}
  .empty .big{font-size:34px;margin-bottom:8px} .empty p{font-size:14px;margin-bottom:14px}
  .alert{display:flex;gap:12px;align-items:flex-start;padding:12px 18px;border-bottom:1px solid #f2f3f1}
  .alert:last-child{border-bottom:none}
  .alert .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex-shrink:0}
  .alert .txt b{font-weight:600} .alert .txt small{display:block;color:var(--muted);font-size:12.5px}
  .ov{position:fixed;inset:0;background:rgba(20,24,29,.5);display:none;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:50}
  .ov.on{display:flex}
  .modal{background:var(--card);border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto}
  .modal-h{padding:18px 22px;border-bottom:1px solid #eef0ec;display:flex;justify-content:space-between;align-items:center}
  .modal-h h3{font-size:17px} .modal-h .x{font-size:22px;color:var(--muted);width:32px;height:32px;border-radius:8px} .modal-h .x:hover{background:#f0f1ef}
  .modal-b{padding:20px 22px;max-height:72vh;overflow:auto}
  .modal-f{padding:14px 22px;border-top:1px solid #eef0ec;display:flex;justify-content:flex-end;gap:10px}
  .fg{margin-bottom:15px}
  .fg label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:#3a424d}
  .fg label .opt{color:var(--muted);font-weight:400}
  .fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border:1px solid #d5d9d3;border-radius:8px;background:#fcfdfb;transition:.12s}
  .fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--steel);background:#fff;box-shadow:0 0 0 3px var(--steel-l)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .hint{font-size:12px;color:var(--muted);margin-top:5px}
  .sub{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:18px 0 10px;border-bottom:1px solid #eef0ec;padding-bottom:6px}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .toolbar input[type=search]{flex:1;min-width:180px;padding:9px 13px;border:1px solid #d5d9d3;border-radius:8px;background:#fff}
  .toolbar select{padding:9px 13px;border:1px solid #d5d9d3;border-radius:8px;background:#fff}
  .break{font-size:13px;color:var(--muted);line-height:1.8} .break b{color:var(--ink)}
  .minibar{height:7px;background:#eef0ee;border-radius:4px;overflow:hidden;margin-top:4px;width:120px}
  .minibar i{display:block;height:100%;background:var(--amber)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--graphite);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.3)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .logi{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;padding:16px 18px}
  .loc{border:1px solid #e6e8e4;border-radius:11px;padding:14px}
  .loc .lt{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:4px;color:var(--muted)}
  .loc b{font-size:15px} .loc address{font-style:normal;font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
  .loc .cap{font-size:12px;color:var(--muted);margin-top:8px}
  .cbx{position:relative}
  .cbx-list{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid #d5d9d3;border-top:none;border-radius:0 0 8px 8px;max-height:240px;overflow:auto;z-index:5;box-shadow:0 10px 24px rgba(0,0,0,.12);display:none}
  .cbx-list.on{display:block}
  .cbx-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid #f2f3f1}
  .cbx-item:hover{background:var(--steel-l)} .cbx-item b{font-weight:600} .cbx-item small{display:block;color:var(--muted);font-size:12.5px}
  .picked{background:var(--steel-l);border:1px solid #cfe1ea;border-radius:9px;padding:11px 13px;margin-top:8px;font-size:13.5px}
  .picked b{font-weight:600} .picked .pl{color:var(--muted);font-size:12px}
  .ro-banner{background:var(--graphite);color:#fff;padding:9px 16px;font-size:13px;display:flex;align-items:center;gap:10px;justify-content:center;border-radius:10px}
  .ro-banner .tag{background:var(--amber);color:#0d2e2b}
  .urgente-row td{background:#fff8ec!important;border-left:4px solid var(--amber)}
  .step{display:flex;align-items:center;flex-wrap:wrap;gap:0;margin:12px 0 18px}
  .step .s{padding:7px 12px;border-radius:20px;font-size:12.5px;font-weight:600;background:#eef0ee;color:var(--muted);white-space:nowrap}
  .step .s.done{background:var(--green-l);color:var(--green)}
  .step .s.cur{background:var(--amber);color:#0d2e2b}
  .step .arrow{color:#c7ccd3;padding:0 4px}
  @media(max-width:820px){
    .app{flex-direction:column}
    .nav{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto}
    .brand,.nav .foot,.nav .sec{display:none}
    .nav a.mi{border-left:none;border-bottom:3px solid transparent;padding:12px 13px;white-space:nowrap}
    .nav a.mi.on{border-left:none;border-bottom-color:var(--amber)}
    .nav a.mi span.lbl{display:none}
    .nav a.mi .ic{font-size:19px}
    .main{padding:18px 16px 60px}
    .head h1{font-size:20px} .row2,.row3{grid-template-columns:1fr}
    .tblwrap{overflow-x:auto}
  }
</style>
</head>

async function sha256(str){const enc=new TextEncoder().encode(str);const buf=await crypto.subtle.digest('SHA-256',enc);return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}

const _parciais={},_tamTab={};
async function dbFetchTable(table){
  /* páginas adaptativas: começa em 200; se o servidor devolver 5xx (tempo esgotado por registros pesados), reduz a página
     e tenta de novo no mesmo ponto, até 1 registro. Registro que nem sozinho carrega é pulado e anotado.
     Se 3 registros seguidos falham sem nenhum sucesso no meio, a tabela inteira está fora: desiste rápido. */
  const INICIAL=200;let all=[],offset=0,pageSize=INICIAL,okSeq=0,guarda=0,puladas=0,seguidas=0;const ruins=[];
  delete _parciais[table];
  const url=(lim,off,sel)=>`${SUPA.url}/rest/v1/${table}?select=${sel||"id,data"}&order=id&limit=${lim}&offset=${off}`;
  while(true){
    if(++guarda>30000)throw new Error("Falha ao buscar "+table+": paginação sem fim");
    let res;
    try{res=await fetch(url(pageSize,offset),{headers:supaHeaders()});}
    catch(e){throw new Error("Falha ao buscar "+table+": sem conexão");}
    if(!res.ok){
      try{_corpoErro[table]=(await res.clone().text()).replace(/\s+/g," ").slice(0,160);}catch(e){}
      if(res.status>=500&&pageSize>1){pageSize=Math.max(1,Math.floor(pageSize/4));okSeq=0;continue;}
      if(res.status>=500&&pageSize===1){
        await new Promise(r=>setTimeout(r,700));
        let r2=null;try{r2=await fetch(url(1,offset),{headers:supaHeaders()});}catch(e){}
        if(r2&&r2.ok){const b2=await r2.json();all=all.concat(b2.map(r=>r.data));seguidas=0;if(b2.length<1)break;offset+=1;okSeq++;continue;}
        seguidas++;
        if(seguidas>=3)throw new Error("Falha ao buscar "+table+": "+res.status);
        try{const ri=await fetch(url(1,offset,"id"),{headers:supaHeaders()});if(ri.ok){const bi=await ri.json();ruins.push(bi[0]?bi[0].id:("posição "+offset));}else ruins.push("posição "+offset);}catch(e){ruins.push("posição "+offset);}
        puladas++;offset+=1;continue;
      }
      throw new Error("Falha ao buscar "+table+": "+res.status);
    }
    seguidas=0;delete _corpoErro[table];
    const batch=await res.json();
    all=all.concat(batch.map(r=>r.data));
    if(batch.length<pageSize)break;
    offset+=pageSize;okSeq++;
    if(okSeq>=3&&pageSize<INICIAL){pageSize=Math.min(INICIAL,pageSize*4);okSeq=0;}
  }
  if(ruins.length)_parciais[table]=ruins;
  return finalizaFetch(table,all,puladas);
}
function finalizaFetch(table,all,puladas){
  if(puladas&&!_parciais[table])_parciais[table]=["?"];
  try{_tamTab[table]=Math.round(JSON.stringify(all).length/1024);}catch(e){}
  return all;
}

async function dbUpsertLote(table,objs){

    const res=await fetch(`${SUPA.url}/rest/v1/${table}`,{method:"POST",headers:supaHeaders({"Prefer":"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify(objs.map(o=>({id:String(o.id),data:o})))});

async function reenviarTabelasVazias(){

function renderFTbl(){

  else if(fAloj)list=list.filter(f=>{const m=estadiaAtual(f.id);return m&&m.local===fAloj;});

  }</tbody></table>`;

function salvarFunc(id){const nome=$("#f_nome").value.trim();if(!nome){toast("Informe o nome.");return;}if(!$("#f_adm").value){toast("Informe a admissão.");return;}const prev=id?DB.func.find(x=>x.id===id):null;const dem=$("#f_dem").value;const folga=$("#f_folga").value;const o={id:id||uid(),foto:_fotoTemp,matricula:$("#f_mat").value.trim(),nome,funcao:$("#f_func").value.trim(),empresa:$("#f_emp").value.trim(),setorCompras:$("#f_setorcompras").value,classificacao:$("#f_class").value,rg:$("#f_rg").value.trim(),cpf:$("#f_cpf").value.trim(),nascimento:$("#f_nasc").value,cidade:$("#f_cid").value.trim(),telefone:$("#f_tel").value.trim(),email:$("#f_email").value.trim(),treinamento:$("#f_trein").value.trim(),regimeFolga:folga,moraPerto:folga&&folga!=="Não"?"1":"",admissao:$("#f_adm").value,demissao:dem,motivoDesligamento:$("#f_motivodem").value,expData1:$("#f_exp1").value,expData2:$("#f_exp2").value,baixadaAjusteValor:$("#f_baix_val").value,baixadaAjusteData:$("#f_baix_data").value,dataInicioBaixada:$("#f_baixinicio")?.value||"",dataChegadaObra:$("#f_chegadaobra").value,saldoBaixadaInicial:$("#f_saldoinicial").value,direitoBaixada:$("#f_direitobaixada").value,regimePonto:$("#f_regimeponto").value,pin:prev?prev.pin:"",podeAutorizarPin:prev?prev.podeAutorizarPin:false,acessoReembolso:prev?prev.acessoReembolso:false,acessoRecrutamento:prev?prev.acessoRecrutamento:false,acessoAlmoxarifado:prev?prev.acessoAlmoxarifado:false,acessoPedidos:prev?prev.acessoPedidos:false,permissoes:prev?prev.permissoes:undefined,perfilSoLeitura:prev?prev.perfilSoLeitura:false,pixTipo:$("#f_pixt").value,pixChave:$("#f_pixk").value.trim(),pixBanco:$("#f_pixb").value.trim(),valeCombustivelLinha:$("#f_vclinha").value.trim(),valeCombustivelIda:$("#f_vcida").value,valeCombustivelVolta:$("#f_vcvolta").value,fdsIntervalo:$("#f_fdsintervalo").value,fdsModo:$("#f_fdsmodo").value,fdsCidade:$("#f_fdscidade").value.trim(),fdsValor:$("#f_fdsvalor").value,fdsAcao:$("#f_fdsacao").value,fdsObs:$("#f_fdsobs").value.trim(),obs:$("#f_obs").value.trim()};if(id){const i=DB.func.findIndex(x=>x.id===id);DB.func[i]=o;}else DB.func.push(o);save("func");if(dem&&(!prev||!prev.demissao)){const m=estadiaAtual(o.id);if(m){m.saida=dem;m.motivo=m.motivo||"Demissão";save("mov");}}
  const transfDir=$("#f_transf_dir")?.value;
  if(transfDir){
    const transfData=$("#f_transf_data").value||iso(today());
    const mo={id:uid(),func:o.id,tipo:"Transferência",direcao:transfDir,obraOrigem:$("#f_transf_origem").value.trim(),obraDestino:$("#f_transf_destino").value.trim(),entrada:transfData,saida:"",motivo:"",diaria:"",obs:""};
    if(transfDir==="Saindo"){const ant=estadiaAtual(o.id);if(ant){ant.saida=transfData;ant.motivo=ant.motivo||"Transferência";}}
    DB.mov.push(mo);save("mov");
  }
  closeModal();render();toast("Funcionário salvo.");}

function salvarMov(id){
  if(!_movFunc){toast("Selecione o funcionário.");return;}
  const tipo=$("#m_tipo").value;
  if(tipo==="Transferência"){
    const data=$("#m_datatransf").value,direcao=$("#m_direcao").value;
    if(!data){toast("Informe a data da transferência.");return;}
    const o={id:id||uid(),func:_movFunc,tipo,direcao,obraOrigem:$("#m_obraorigem").value.trim(),obraDestino:$("#m_obradestino").value.trim(),entrada:data,saida:"",motivo:"",diaria:"",obs:$("#m_obs").value.trim()};
    if(id){const i=DB.mov.findIndex(x=>x.id===id);DB.mov[i]=o;}
    else{
      if(direcao==="Saindo"){const ant=estadiaAtual(o.func);if(ant){ant.saida=data;ant.motivo=ant.motivo||"Transferência";}}
      DB.mov.push(o);
    }
    save("mov");closeModal();render();toast("Transferência registrada.");
    return;
  }
  const local=$("#m_local").value,ent=$("#m_ent").value,sai=$("#m_sai").value;
  const semLocalObrigatorio=(tipo==="Local"||tipo==="Baixada");
  if(!semLocalObrigatorio&&!local){toast("Selecione ou cadastre o local.");return;}
  if(!ent){toast("Informe a data de entrada.");return;}
  if(sai&&pd(sai)<pd(ent)){toast("A saída não pode ser antes da entrada.");return;}
  const o={id:id||uid(),func:_movFunc,tipo,local:semLocalObrigatorio?"":local,quarto:$("#m_quarto")?.value.trim()||"",entrada:ent,saida:sai,motivo:$("#m_mot").value,diaria:semLocalObrigatorio?"":$("#m_diaria").value,obs:$("#m_obs").value.trim()};
  if(id){const i=DB.mov.findIndex(x=>x.id===id);DB.mov[i]=o;}
  else{
    if(!o.saida){const ant=estadiaAtual(o.func);if(ant){ant.saida=o.entrada;ant.motivo=ant.motivo||(tipo==="Baixada"?"Baixada":"Troca de alojamento");}}
    DB.mov.push(o);
  }
  save("mov");closeModal();render();toast("Movimentação salva.");
}

let _baixBusca="",_baixOrdem="saldo";
function diasUteisNoMes(anoMes){
  const [ano,mes]=anoMes.split("-").map(Number);
  const ultimoDia=new Date(ano,mes,0).getDate();
  let n=0;
  for(let d=1;d<=ultimoDia;d++){const dow=new Date(ano,mes-1,d).getDay();if(dow>=1&&dow<=5)n++;}
  return n;
}
function diasDoMes(anoMes){
  const [ano,mes]=anoMes.split("-").map(Number);
  const ultimoDia=new Date(ano,mes,0).getDate();
  const dias=[];for(let d=1;d<=ultimoDia;d++)dias.push(anoMes+"-"+String(d).padStart(2,"0"));
  return dias;
}
function baixadaCobrindo(fid,dataStr){
  return DB.mov.find(m=>m.func===fid&&m.tipo==="Baixada"&&m.entrada&&m.entrada<=dataStr&&m.saida&&m.saida>=dataStr);
}
function feriasCobrindo(fid,dataStr){
  return DB.ferias.find(fe=>fe.func===fid&&fe.inicio&&fe.fim&&fe.inicio<=dataStr&&fe.fim>=dataStr);
}
function diaAusente(fid,dataStr){
  const bx=baixadaCobrindo(fid,dataStr);if(bx)return{tipo:"baixada",registro:bx};
  const fe=feriasCobrindo(fid,dataStr);if(fe)return{tipo:"ferias",registro:fe};
  return null;
}
function primeiroDiaContagem(f,anoMes){
  if(f.admissao&&f.admissao.startsWith(anoMes))return+f.admissao.split("-")[2];
  return 1;
}
function calcularCafeSemana(fid,anoMes){
  const f=DB.func.find(x=>x.id===fid);
  const [ano,mes]=anoMes.split("-").map(Number);
  const ultimoDia=new Date(ano,mes,0).getDate();
  const diaInicio=primeiroDiaContagem(f,anoMes);
  let n=0;
  for(let d=diaInicio;d<=ultimoDia;d++){
    const dataStr=anoMes+"-"+String(d).padStart(2,"0");
    const dow=new Date(ano,mes-1,d).getDay();
    if(dow>=1&&dow<=5&&!diaAusente(fid,dataStr))n++;
  }
  return n;
}
function calcularAlojadoFDS(fid,anoMes){
  const f=DB.func.find(x=>x.id===fid);
  const [ano,mes]=anoMes.split("-").map(Number);
  const ultimoDia=new Date(ano,mes,0).getDate();
  const diaInicio=primeiroDiaContagem(f,anoMes);
  let diasCafe=0,diasAlmoco=0,diasJantar=0;
  for(let d=diaInicio;d<=ultimoDia;d++){
    const dataStr=anoMes+"-"+String(d).padStart(2,"0");
    const dow=new Date(ano,mes-1,d).getDay();
    const fimDeSemana=dow===0||dow===6;
    const feriadoSemana=!fimDeSemana&&ehFeriado(dataStr);
    const especial=fimDeSemana||feriadoSemana;
    const aus=diaAusente(fid,dataStr);
    const away=!!aus;
    const diaDeVolta=aus&&aus.registro.saida===dataStr;
    if(especial&&!away){diasCafe++;diasAlmoco++;}
    if(!away||diaDeVolta)diasJantar++;
  }
  return{diasCafe,diasAlmoco,diasJantar};
}
function vaAjuste(mes,fid){
  DB.cfg.valeAlimentacaoAjustes=DB.cfg.valeAlimentacaoAjustes||{};
  return DB.cfg.valeAlimentacaoAjustes[mes+"|"+fid]||{};
}
function salvarVaAjuste(mes,fid,campo,valor){
  DB.cfg.valeAlimentacaoAjustes=DB.cfg.valeAlimentacaoAjustes||{};
  const chave=mes+"|"+fid;
  DB.cfg.valeAlimentacaoAjustes[chave]=DB.cfg.valeAlimentacaoAjustes[chave]||{};
  DB.cfg.valeAlimentacaoAjustes[chave][campo]=valor;
  save("cfg");
}
function salvarValoresValeAlimentacao(){
  DB.cfg.valorCafe=$("#va_valorcafe").value;
  DB.cfg.valorAlmoco=$("#va_valoralmoco").value;
  DB.cfg.valorJantar=$("#va_valorjantar").value;
  save("cfg");render();toast("Valores atualizados.");
}
let _vaMes="";
function vValeAlimentacao(){
  if(!_vaMes)_vaMes=iso(today()).slice(0,7);
  const mes=_vaMes;
  const valorCafe=+DB.cfg.valorCafe||8,valorAlmoco=+DB.cfg.valorAlmoco||28,valorJantar=+DB.cfg.valorJantar||28;
  const todosAtivos=porNome(DB.func.filter(ativo));
  const alojados=porNome(DB.func.filter(f=>ativo(f)&&(estadiaAtual(f.id)||{}).tipo==="Alojamento"));

  const linhaObra=f=>{
    const calcQtd=calcularCafeSemana(f.id,mes);
    const aj=vaAjuste(mes,f.id);
    const admissaoNoMes=f.admissao&&f.admissao.startsWith(mes);
    const qtdCafe=(aj.qtdCafe!==undefined&&aj.qtdCafe!=="")?aj.qtdCafe:calcQtd;
    const retro=+aj.retroativo||0,desc=+aj.desconto||0;
    const cafe=qtdCafe*valorCafe;
    const total=cafe+retro-desc;
    return{f,qtdCafe,retro,desc,cafe,total,obs:aj.obs||"",admissaoNoMes};
  };
  const linhaAlojado=f=>{
    const calc=calcularAlojadoFDS(f.id,mes);
    const aj=vaAjuste(mes,f.id);
    const qtdCafe=aj.qtdCafe!==undefined?aj.qtdCafe:calc.diasCafe;
    const qtdAlmoco=aj.qtdAlmoco!==undefined?aj.qtdAlmoco:calc.diasAlmoco;
    const qtdJantar=aj.qtdJantar!==undefined?aj.qtdJantar:calc.diasJantar;
    const retro=+aj.retroativo||0,desc=+aj.desconto||0;
    const cafe=qtdCafe*valorCafe,almoco=qtdAlmoco*valorAlmoco,jantar=qtdJantar*valorJantar;
    const total=cafe+almoco+jantar+retro-desc;
    const admissaoNoMes=f.admissao&&f.admissao.startsWith(mes);
    return{f,qtdCafe,qtdAlmoco,qtdJantar,retro,desc,cafe,almoco,jantar,total,obs:aj.obs||"",admissaoNoMes};
  };
  window._vaLinhasObra=todosAtivos.map(linhaObra);
  window._vaLinhasAlojados=alojados.map(linhaAlojado);
  const totalObra=window._vaLinhasObra.reduce((s,l)=>s+l.total,0);
  const totalAlojados=window._vaLinhasAlojados.reduce((s,l)=>s+l.total,0);

  main.innerHTML=`<div class="head"><div><h1>🍽 Vale Alimentação</h1><p>Café da manhã (todos) + café/almoço/jantar de fim de semana dos alojados — calculado automático, revisável antes de exportar pra sede.</p></div><div class="acts"><button class="btn btn-a" onclick="exportarValeAlimentacao()">⭳ Exportar Excel (formato SODEXO)</button></div></div>
   <div class="panel"><div style="padding:14px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap"><span class="hint">Mês de referência</span><input type="month" id="va_mes_input" value="${mes}" onchange="_vaMes=this.value;render()">
     <span class="hint">Café R$</span><input type="number" step="0.01" id="va_valorcafe" value="${valorCafe}" style="width:70px" onchange="salvarValoresValeAlimentacao()">
     <span class="hint">Almoço R$</span><input type="number" step="0.01" id="va_valoralmoco" value="${valorAlmoco}" style="width:70px" onchange="salvarValoresValeAlimentacao()">
     <span class="hint">Jantar R$</span><input type="number" step="0.01" id="va_valorjantar" value="${valorJantar}" style="width:70px" onchange="salvarValoresValeAlimentacao()">
   </div></div>
   <div class="grid stats"><div class="stat steel"><div class="n">R$ ${totalObra.toLocaleString('pt-BR',{minimumFractionDigits:2})}</div><div class="l">Total café Seg-Sex (todos)</div></div><div class="stat amber"><div class="n">R$ ${totalAlojados.toLocaleString('pt-BR',{minimumFractionDigits:2})}</div><div class="l">Total fim de semana (alojados)</div></div></div>
   ${window._vaLinhasObra.some(l=>l.admissaoNoMes)?`<div class="panel" style="border:2px solid var(--amber);background:#fdf8ee"><div style="padding:14px 18px"><b style="color:var(--amber-d)">⚠ Lembrete — admissões desse mês, cuidado com pagamento em duplicidade</b>
     <p class="hint" style="margin:6px 0 10px">Nos primeiros ~10 dias (até o cartão chegar), a pessoa recebe via PIX (Caixa Sup./Eng.): <b>dia de semana</b> normalmente café + jantar, <b>fim de semana</b> café + almoço + jantar. Confere quanto foi pago em cada caso, lança o <b>valor</b> no campo Desconto (tanto na tabela de café quanto na de fim de semana, se for alojado), explicando no campo de Observação — e <b>lembre de avisar o financeiro/RH sobre o que já foi pago via PIX</b>, pra não sair duplicado quando o cartão chegar.</p>
     <ul style="margin:0;padding-left:20px">${window._vaLinhasObra.filter(l=>l.admissaoNoMes).map(l=>`<li>${esc(l.f.nome)} — admissão dia ${l.f.admissao.split("-")[2]}</li>`).join("")}</ul>
   </div></div>`:''}
   <div class="panel"><h2><span class="t">☕ Café da manhã (Seg a Sex) — todos os colaboradores</span></h2><p class="hint" style="padding:0 18px 10px">Desconta automático dias de baixada e férias.</p><div class="tblwrap"><table class="tbl" style="font-size:12.5px"><thead><tr><th>Nome</th><th>Qtd dias café</th><th>Retroativo</th><th>Desconto</th><th>Café (R$)</th><th>Total</th><th>Observ.</th></tr></thead><tbody>${
     window._vaLinhasObra.map((l,idx)=>`<tr>${l.admissaoNoMes?'<td style="border-left:3px solid var(--amber)">':'<td>'}${esc(l.f.nome)}</td><td><input type="number" value="${l.qtdCafe}" style="width:60px" onchange="salvarVaAjuste('${mes}','${l.f.id}','qtdCafe',this.value);render()"></td><td><input type="number" step="0.01" value="${l.retro||''}" style="width:80px" onchange="salvarVaAjuste('${mes}','${l.f.id}','retroativo',this.value);render()"></td><td><input type="number" step="0.01" value="${l.desc||''}" style="width:80px" onchange="salvarVaAjuste('${mes}','${l.f.id}','desconto',this.value);render()"></td><td class="num">R$ ${l.cafe.toFixed(2)}</td><td class="num"><b>R$ ${l.total.toFixed(2)}</b></td><td><input value="${esc(l.obs)}" style="width:160px" placeholder="${l.admissaoNoMes?'ex.: X dias café+jantar pagos via PIX = R$Y':''}" onchange="salvarVaAjuste('${mes}','${l.f.id}','obs',this.value)"></td></tr>`).join("")
   }</tbody></table></div></div>
   <div class="panel"><h2><span class="t">🏠 Fim de semana — alojados</span></h2><p class="hint" style="padding:0 18px 10px">Calculado automático a partir da Baixada e Férias (descontam sempre) + Transporte Fim de Semana. Ajusta manualmente quando precisar — o ajuste fica salvo.</p><div class="tblwrap"><table class="tbl" style="font-size:12.5px"><thead><tr><th>Nome</th><th>Volta FDS</th><th>Qtd café</th><th>Qtd almoço</th><th>Qtd jantar</th><th>Retroativo</th><th>Desconto</th><th>Total</th></tr></thead><tbody>${
     window._vaLinhasAlojados.map(l=>`<tr>${l.admissaoNoMes?'<td style="border-left:3px solid var(--amber)">':'<td>'}${esc(l.f.nome)}${l.f.fdsModo?`<br><small style="color:var(--muted)">${esc(l.f.fdsModo)}</small>`:''}</td><td>${esc(l.f.fdsIntervalo||"—")}</td><td><input type="number" value="${l.qtdCafe}" style="width:55px" onchange="salvarVaAjuste('${mes}','${l.f.id}','qtdCafe',this.value);render()"></td><td><input type="number" value="${l.qtdAlmoco}" style="width:55px" onchange="salvarVaAjuste('${mes}','${l.f.id}','qtdAlmoco',this.value);render()"></td><td><input type="number" value="${l.qtdJantar}" style="width:55px" onchange="salvarVaAjuste('${mes}','${l.f.id}','qtdJantar',this.value);render()"></td><td><input type="number" step="0.01" value="${l.retro||''}" style="width:80px" onchange="salvarVaAjuste('${mes}','${l.f.id}','retroativo',this.value);render()"></td><td><input type="number" step="0.01" value="${l.desc||''}" style="width:80px" onchange="salvarVaAjuste('${mes}','${l.f.id}','desconto',this.value);render()"></td><td class="num"><b>R$ ${l.total.toFixed(2)}</b></td></tr>`).join("")
   }</tbody></table></div></div>`;
}

  window._vaLinhasAlojados.forEach(l=>{

const MESES_NOME=["","Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const _fotosKey="obra:fotos_aniv";
function fotosLocais(){try{return JSON.parse((LS?localStorage.getItem(_fotosKey):MEM[_fotosKey])||"{}");}catch(e){return{};}}
function fotoDe(fid){return fotosLocais()[fid]||null;}
function guardarFoto(fid,obj){
  try{const m=fotosLocais();m[fid]=obj;const raw=JSON.stringify(m);if(LS)localStorage.setItem(_fotosKey,raw);else MEM[_fotosKey]=raw;return true;}
  catch(e){return false;}
}
function removerFotoDe(fid){try{const m=fotosLocais();delete m[fid];const raw=JSON.stringify(m);if(LS)localStorage.setItem(_fotosKey,raw);else MEM[_fotosKey]=raw;}catch(e){}}
function aniversarioInfo(f){
  const n=f&&f.nascimento;if(!n)return null;
  const t=String(n);let a,m,d;
  if(t.includes("/")){[d,m,a]=t.split("/").map(Number);}else{[a,m,d]=t.split("-").map(Number);}
  if(!m||!d||m<1||m>12||d<1||d>31)return null;
  return{dia:d,mes:m,ano:a||0};
}
function _titulo(txt){
  const baixas=new Set(["da","de","do","das","dos","e","em","para"]);
  const romanos=/^(i|ii|iii|iv|v|vi|vii|viii|ix|x)$/i;
  const low=String(txt||"").trim().toLowerCase();
  return low.replace(/\p{L}+/gu,(w,i)=>{
    if(w.length===1&&low[i-1]==="("&&low[i+1]===")")return w;
    if(i>0&&baixas.has(w))return w;
    if(romanos.test(w)&&i>0)return w.toUpperCase();
    return w.charAt(0).toUpperCase()+w.slice(1);
  });
}
function nomeParaCard(nome){
  const t=_titulo(nome).split(/\s+/).filter(Boolean);
  if(t.length<=2)return t.join(" ");
  const baixas=new Set(["da","de","do","das","dos","e"]);
  let ult=t[t.length-1];
  return t[0]+" "+ult;
}
function _carregaImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("imagem inválida"));i.src=src;});}
let _cardBaseImg=null;
async function _baseCard(){if(!_cardBaseImg)_cardBaseImg=await _carregaImg(CARD_ANIV_BASE);return _cardBaseImg;}
const _FONTE='Poppins,Montserrat,"Segoe UI","Helvetica Neue",Arial,sans-serif';
/* Desenha o card (modelo Priner) num canvas quadrado. st={nome,funcao,data,img,zoom,offX,offY} */
function renderCardAniv(canvas,st){
  const W=canvas.width,ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,W,W);
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
  ctx.drawImage(_cardBaseImg,0,0,W,W);
  const s=W/777,cx=399.1*s,cy=453*(W/773);
  ctx.save();ctx.translate(cx,cy);ctx.rotate(3.2*Math.PI/180);ctx.scale(s,s);
  /* moldura polaroid */
  ctx.save();ctx.shadowColor="rgba(20,50,40,.30)";ctx.shadowBlur=22;ctx.shadowOffsetY=9;
  ctx.fillStyle="#ffffff";ctx.fillRect(-190,-207.75,380,415.5);ctx.restore();
  ctx.strokeStyle="#dedfdb";ctx.lineWidth=1.2;ctx.strokeRect(-190,-207.75,380,415.5);
  /* janela da foto */
  const win={x:-162,y:-179.75,w:322,h:297};
  ctx.save();ctx.beginPath();ctx.rect(win.x,win.y,win.w,win.h);ctx.clip();
  if(st.img){
    const sc=Math.max(win.w/st.img.width,win.h/st.img.height)*(st.zoom||1);
    const iw=st.img.width*sc,ih=st.img.height*sc;
    const mx=Math.max(0,(iw-win.w)/2),my=Math.max(0,(ih-win.h)/2);
    const ox=Math.min(mx,Math.max(-mx,st.offX||0)),oy=Math.min(my,Math.max(-my,st.offY||0));
    ctx.drawImage(st.img,win.x+win.w/2-iw/2+ox,win.y+win.h/2-ih/2+oy,iw,ih);
  }else{
    const g=ctx.createLinearGradient(win.x,win.y,win.x+win.w,win.y+win.h);g.addColorStop(0,"#a0c515");g.addColorStop(1,"#86a80f");
    ctx.fillStyle=g;ctx.fillRect(win.x,win.y,win.w,win.h);
    const ini=String(st.nome||"?").split(/\s+/).map(x=>x.charAt(0)).join("").slice(0,2).toUpperCase();
    ctx.fillStyle="rgba(255,255,255,.92)";ctx.font='700 120px '+_FONTE;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(ini,win.x+win.w/2,win.y+win.h/2);
  }
  ctx.restore();
  /* nome e função */
  ctx.textAlign="center";ctx.textBaseline="middle";
  let fs=36;const nome=String(st.nome||"");
  do{ctx.font='700 '+fs+'px '+_FONTE;fs-=1;}while(ctx.measureText(nome).width>335&&fs>16);
  ctx.fillStyle="#0c5250";ctx.fillText(nome,0,148);
  let fs2=17;const fn=String(st.funcao||"");
  do{ctx.font='500 '+fs2+'px '+_FONTE;try{ctx.letterSpacing="1.2px";}catch(e){}fs2-=1;}while(ctx.measureText(fn).width>335&&fs2>10);
  ctx.fillStyle="#6b7370";ctx.fillText(fn,0,181);
  try{ctx.letterSpacing="0px";}catch(e){}
  /* etiqueta da data (fita) */
  ctx.save();ctx.translate(-7,-209.4);ctx.rotate(-1.2*Math.PI/180);
  ctx.fillStyle="#0c5250";ctx.beginPath();
  const tw=43,th=17,z=3;
  ctx.moveTo(-tw,-th);ctx.lineTo(tw,-th);
  for(let y=-th;y<th;y+=6.8){ctx.lineTo(tw+(((y+th)/6.8|0)%2?-z:z),y+3.4);}
  ctx.lineTo(tw,th);ctx.lineTo(-tw,th);
  for(let y=th;y>-th;y-=6.8){ctx.lineTo(-tw+(((th-y)/6.8|0)%2?z:-z),y-3.4);}
  ctx.closePath();ctx.fill();
  ctx.fillStyle="#ffffff";ctx.font='italic 700 21px '+_FONTE;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(String(st.data||""),0,1);
  ctx.restore();
  ctx.restore();
}
function _limitesFoto(st){
  const win={w:322,h:297};if(!st.img)return{mx:0,my:0};
  const sc=Math.max(win.w/st.img.width,win.h/st.img.height)*(st.zoom||1);
  return{mx:Math.max(0,(st.img.width*sc-win.w)/2),my:Math.max(0,(st.img.height*sc-win.h)/2)};
}
function _enquadramentoPadrao(st){const l=_limitesFoto(st);st.zoom=1;st.offX=0;st.offY=Math.round(l.my*0.55);}
async function _estadoCard(f,usarSalvo=true){
  const info=aniversarioInfo(f);
  const st={fid:f.id,nome:nomeParaCard(f.nome),funcao:_titulo(f.funcao||""),data:info?String(info.dia).padStart(2,"0")+"/"+String(info.mes).padStart(2,"0"):"",img:null,zoom:1,offX:0,offY:0};
  const salva=usarSalvo?fotoDe(f.id):null;
  if(salva&&salva.img){try{st.img=await _carregaImg(salva.img);st.zoom=salva.z||1;if(salva.x!==undefined){st.offX=salva.x;st.offY=salva.y;}else _enquadramentoPadrao(st);}catch(e){}}
  return st;
}
function _baixarCanvas(canvas,nomeArq){
  canvas.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=nomeArq;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);},"image/png");
}
function _nomeArquivoCard(st){return "Aniversario_"+String(st.data||"").replace("/","-")+"_"+String(st.nome||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"_")+".png";}

function preverImportacaoTransporteFds(){

  const header=linhas[0].map(h=>normalizaNome(h.trim()));
  const idx=nomeCol=>header.findIndex(h=>h.includes(nomeCol));
  const iNome=idx("COLABORADOR")>=0?idx("COLABORADOR"):idx("NOME"),iIntervalo=idx("INTERVALO"),iPreco=idx("PRECO")>=0?idx("PRECO"):idx("VALOR"),iCidade=idx("CIDADE"),iAcao=idx("ACAO")>=0?idx("ACAO"):idx("AÇÃO"),iObs=idx("OBSERVA");
  if(iNome<0){toast("Não achei a coluna de nome/colaborador.");return;}
  const paraNumero=v=>{if(!v)return"";return +String(v).replace("R$","").replace(/\s/g,"").replace(/\./g,"").replace(",",".")||"";};
  const resultados=linhas.slice(1).map(cols=>{
    const nomeRaw=(cols[iNome]||"").trim();

    const intervaloRaw=(iIntervalo>=0?(cols[iIntervalo]||""):"").trim();
    const intervalo=intervaloRaw?intervaloRaw[0].toUpperCase()+intervaloRaw.slice(1).toLowerCase():"";
    const preco=iPreco>=0?paraNumero(cols[iPreco]):"";
    const cidade=(iCidade>=0?(cols[iCidade]||""):"").trim();
    const acaoRaw=(iAcao>=0?(cols[iAcao]||""):"").trim().toLowerCase();
    let acao="";
    if(acaoRaw.includes("verificar"))acao="Verificar sempre";else if(acaoRaw.includes("sem"))acao="Sem ação";else if(acaoRaw.includes("pago"))acao="Pago mensal (adiantado)";
    const obs=(iObs>=0?(cols[iObs]||""):"").trim();
    let modo="";
    const obsLower=obs.toLowerCase();
    if(obsLower.includes("carro da empresa"))modo="Carro da empresa";
    else if(obsLower.includes("reembols"))modo="Reembolso de passagem";
    else if(obsLower.includes("uber"))modo="Uber";
    else if(obsLower.includes("passagem"))modo="Passagem por conta da empresa";

    return{nomeRaw,intervalo,preco,cidade,acao,modo,obs,fid:match?match.id:null,fNome:match?match.nome:null};
  }).filter(Boolean);

function normalizaNome(s){return String(s==null?"":s).toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();}
const LOCAL_MARCACOES_OBRA="UNEM - NOVA LIMA / MG";
function abrirImportarMarcacoes(){$("#marc_file").click();}
function processarArquivoMarcacoes(e){
  const file=e.target.files[0];if(!file)return;
  if(typeof XLSX==="undefined"){toast("Excel indisponível offline.");return;}
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      const header=rows[0].map(h=>String(h).trim());
      const idxNome=header.indexOf("Nome");
      const idxLocal=header.indexOf("Descrição do local");
      const idxData=header.indexOf("Data");
      if(idxNome<0||idxData<0){toast("Não reconheci as colunas — confere se é o export certo de Marcações.");return;}
      const porPessoaDia={};
      for(let i=1;i<rows.length;i++){
        const r=rows[i];if(!r[idxNome])continue;
        if(idxLocal>=0&&r[idxLocal]!==LOCAL_MARCACOES_OBRA)continue;
        const dataRaw=String(r[idxData]||"").trim();
        const partesDataHora=dataRaw.split(" ");
        const dataSoDia=partesDataHora[0];
        const hora=partesDataHora[1]||"";
        const partes=dataSoDia.split("/");
        if(partes.length!==3)continue;
        const dataIso=partes[2]+"-"+partes[1].padStart(2,"0")+"-"+partes[0].padStart(2,"0");
        const chave=normalizaNome(r[idxNome])+"|"+dataIso;
        if(!porPessoaDia[chave])porPessoaDia[chave]={nome:r[idxNome],data:dataIso,horas:[]};
        if(hora)porPessoaDia[chave].horas.push(hora);
      }
      const lista=Object.values(porPessoaDia).map(item=>{
        const paraMinutos=h=>{const p=h.split(":").map(Number);return(p[0]||0)*60+(p[1]||0);};
        item.horas.sort((a,b)=>paraMinutos(a)-paraMinutos(b));
        return{nome:item.nome,data:item.data,entrada:item.horas[0]||"",saida:item.horas.length>1?item.horas[item.horas.length-1]:"",qtdBatidas:item.horas.length};
      });
      mostrarResumoImportacaoMarcacoes(lista);
    }catch(err){console.error(err);toast("Não consegui ler esse arquivo — confere se é um .xlsx válido.");}
  };
  reader.readAsArrayBuffer(file);
  e.target.value="";
}
function mostrarResumoImportacaoMarcacoes(lista){
  const funcNorm=DB.func.filter(ativo).map(f=>({f,norm:normalizaNome(f.nome)}));
  const encontrados=[],naoEncontrados=new Set(),jaTinhamRegistro=[],vaoCompletar=[];
  lista.forEach(item=>{
    const match=funcNorm.find(x=>x.norm===normalizaNome(item.nome));
    if(!match){naoEncontrados.add(item.nome);return;}
    const existente=DB.faltas.find(fa=>fa.func===match.f.id&&fa.data===item.data);
    if(existente){
      if(existente.tipo==="Presença"&&!existente.horaSaida&&item.saida){
        vaoCompletar.push({existenteId:existente.id,nome:match.f.nome,data:item.data,saida:item.saida});
      }else{
        jaTinhamRegistro.push({nome:item.nome,data:item.data});
      }
      return;
    }
    encontrados.push({fid:match.f.id,nome:match.f.nome,data:item.data,entrada:item.entrada,saida:item.saida});
  });
  const semSaida=encontrados.filter(x=>x.entrada&&!x.saida);
  window._importMarcacoesPendente=encontrados;
  window._importMarcacoesCompletar=vaoCompletar;
  openModal(`<div class="modal-h"><h3>Importar marcações</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-b">
   <div class="grid stats" style="margin-bottom:14px"><div class="stat green"><div class="n">${encontrados.length}</div><div class="l">Vão virar Presença</div></div><div class="stat steel"><div class="n">${vaoCompletar.length}</div><div class="l">Vão completar saída que faltava</div></div><div class="stat amber"><div class="n">${semSaida.length}</div><div class="l">Sem batida de saída</div></div><div class="stat"><div class="n">${jaTinhamRegistro.length}</div><div class="l">Já tinham registro completo (ignorados)</div></div><div class="stat red"><div class="n">${naoEncontrados.size}</div><div class="l">Nome não encontrado</div></div></div>
   ${vaoCompletar.length?`<p class="hint" style="color:var(--steel);margin-bottom:10px">🔄 Esses já tinham Presença lançada sem saída, e agora a planilha trouxe a saída — vou completar: ${vaoCompletar.map(x=>esc(x.nome)+" ("+fmt(x.data)+")").join(", ")}</p>`:""}
   ${semSaida.length?`<p class="hint" style="color:var(--amber-d);margin-bottom:10px">⚠ Só bateram entrada, sem saída registrada (esqueceram de bater ou saíram sem avisar): ${semSaida.map(x=>esc(x.nome)+" ("+fmt(x.data)+")").join(", ")}</p>`:""}
   ${naoEncontrados.size?`<p class="hint" style="color:var(--red);margin-bottom:10px">Nomes que não bateram com ninguém ativo cadastrado (confere grafia/cadastro): ${[...naoEncontrados].map(n=>esc(n)).join(", ")}</p>`:""}
   <p class="hint">Isso marca <b>Presença</b> (com hora de entrada/saída, quando tiver) nos dias em que a pessoa bateu ponto e ainda não tinha nenhum registro naquele dia (não mexe em Falta/Atestado/Baixada/Férias já lançados). Se já tinha Presença sem saída, completa. Quem ficou sem saída fica marcado pra você revisar depois.</p>
   </div><div class="modal-f"><button class="btn btn-g" onclick="closeModal()">Cancelar</button><button class="btn btn-a" ${(encontrados.length||vaoCompletar.length)?"":"disabled"} onclick="confirmarImportacaoMarcacoes()">Confirmar (${encontrados.length} novas + ${vaoCompletar.length} completadas)</button></div>`);
}
function confirmarImportacaoMarcacoes(){
  if(!confirmarSenhaSalvar())return;
  const lista=window._importMarcacoesPendente||[];
  const completar=window._importMarcacoesCompletar||[];
  lista.forEach(item=>{DB.faltas.push({id:uid(),func:item.fid,data:item.data,tipo:"Presença",horaEntrada:item.entrada||"",horaSaida:item.saida||"",motivo:"Importado de marcações"});});
  completar.forEach(item=>{const fa=DB.faltas.find(x=>x.id===item.existenteId);if(fa)fa.horaSaida=item.saida;});
  save("faltas");window._importMarcacoesPendente=null;window._importMarcacoesCompletar=null;closeModal();render();toast(lista.length+" presenças importadas, "+completar.length+" completadas com a saída.");
}
const REGIMES_PONTO={"Normal":"Normal — bate ponto no tablet","NaoBate":"Não bate ponto (cargo de confiança)","Manual":"Bate ponto manualmente"};
function abrirGerenciarRegimePonto(){
  const list=porNome(DB.func.filter(ativo));

function renderGradeLancamentoMensal(){
  const fid=$("#lm_func")?.value,mes=$("#lm_mes")?.value;
  const el=$("#lm_grade");if(!el||!fid||!mes)return;
  const [ano,mesNum]=mes.split("-").map(Number);
  const diasNoMes=new Date(ano,mesNum,0).getDate();
  const DIAS_SEMANA_ABREV=["dom","seg","ter","qua","qui","sex","sáb"];
  let linhas="";
  for(let d=1;d<=diasNoMes;d++){
    const dataIso=ano+"-"+String(mesNum).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const dt=new Date(ano,mesNum-1,d);
    const fimDeSemana=dt.getDay()===0||dt.getDay()===6;
    const existente=DB.faltas.find(f=>f.func===fid&&f.data===dataIso);
    const valorPadrao=existente?existente.tipo:(fimDeSemana?"—":"Presença");
    linhas+=`<tr style="${fimDeSemana?'background:#f7f8f6':''}"><td>${String(d).padStart(2,"0")} (${DIAS_SEMANA_ABREV[dt.getDay()]})</td><td><select class="lm_dia_sel" data-data="${dataIso}"><option value="—" ${valorPadrao==="—"?"selected":""}>— sem registro —</option>${TIPOS_OCORRENCIA.map(t=>`<option value="${t}" ${valorPadrao===t?"selected":""}>${t}</option>`).join("")}</select></td></tr>`;
  }
  el.innerHTML=`<div class="tblwrap" style="max-height:400px;overflow-y:auto"><table class="tbl"><thead><tr><th>Dia</th><th>Status</th></tr></thead><tbody>${linhas}</tbody></table></div>`;

function salvarLancamentoMensal(){
  const fid=$("#lm_func").value;
  if(!confirmarSenhaSalvar())return;
  let n=0;
  document.querySelectorAll(".lm_dia_sel").forEach(sel=>{
    const data=sel.dataset.data,tipo=sel.value;
    const existenteIdx=DB.faltas.findIndex(f=>f.func===fid&&f.data===data);
    if(tipo==="—"){if(existenteIdx>=0){DB.faltas.splice(existenteIdx,1);n++;}return;}
    if(existenteIdx>=0){if(DB.faltas[existenteIdx].tipo!==tipo){DB.faltas[existenteIdx].tipo=tipo;n++;}}
    else{DB.faltas.push({id:uid(),func:fid,data,tipo,motivo:"Lançamento mensal (ponto manual)"});n++;}
  });
  save("faltas");closeModal();render();toast(n+" dia(s) atualizado(s).");
}

function preverImportacaoVale(){
  const texto=$("#ivc_texto").value.trim();
  if(!texto){toast("Cola a tabela primeiro.");return;}
  const linhas=texto.split("\n").map(l=>l.split("\t")).filter(l=>l.length>1&&l.some(c=>c.trim()));
  if(linhas.length<2){toast("Não consegui separar em colunas — confere se colou direto do Excel (com Tab entre as colunas).");return;}
  const header=linhas[0].map(h=>normalizaNome(h.trim()));
  const idx=nomeCol=>header.findIndex(h=>h.includes(nomeCol));
  const iNome=idx("NOME"),iCpf=idx("CPF"),iLinha=idx("LINHA"),iIda=idx("PASSAGEM IDA")>=0?idx("PASSAGEM IDA"):idx("IDA"),iVolta=idx("PASSAGEM VOLTA")>=0?idx("PASSAGEM VOLTA"):idx("VOLTA");
  if(iNome<0||iLinha<0||iIda<0||iVolta<0){toast("Não achei as colunas certas (preciso de NOME, LINHA, PASSAGEM IDA, PASSAGEM VOLTA).");return;}
  const paraNumero=v=>{if(!v)return 0;return +String(v).replace("R$","").replace(/\s/g,"").replace(/\./g,"").replace(",",".")||0;};
  const linhaVazia=linhas.every?null:null;
  const resultados=linhas.slice(1).map(cols=>{
    const nomeRaw=(cols[iNome]||"").trim();
    if(!nomeRaw)return null;
    const cpfRaw=iCpf>=0?(cols[iCpf]||"").replace(/\D/g,""):"";
    const linha=(cols[iLinha]||"").trim();
    const ida=paraNumero(cols[iIda]);
    const volta=paraNumero(cols[iVolta]);
    if(!linha&&!ida&&!volta)return null;
    let match=null;
    if(cpfRaw)match=DB.func.find(f=>f.cpf&&soDigitos(f.cpf)===cpfRaw);
    if(!match)match=DB.func.find(f=>normalizaNome(f.nome)===normalizaNome(nomeRaw));
    return{nomeRaw,cpfRaw,linha,ida,volta,fid:match?match.id:null,fNome:match?match.nome:null};
  }).filter(Boolean);
  window._ivcPendente=resultados;
  const achados=resultados.filter(r=>r.fid);
  const naoAchados=resultados.filter(r=>!r.fid);
  $("#ivc_preview").innerHTML=`
   <div class="grid stats"><div class="stat green"><div class="n">${achados.length}</div><div class="l">Vão ser atualizados</div></div><div class="stat red"><div class="n">${naoAchados.length}</div><div class="l">Não encontrados no cadastro</div></div></div>
   ${achados.length?`<div class="tblwrap" style="max-height:30vh;overflow-y:auto"><table class="tbl"><thead><tr><th>Cadastro</th><th>Linha</th><th>Ida</th><th>Volta</th></tr></thead><tbody>${achados.map(r=>`<tr><td>${esc(r.fNome)}</td><td>${esc(r.linha)}</td><td>R$ ${r.ida.toFixed(2)}</td><td>R$ ${r.volta.toFixed(2)}</td></tr>`).join("")}</tbody></table></div>`:""}
   ${naoAchados.length?`<p class="hint" style="color:var(--red);margin-top:10px">Não achei no cadastro (confere nome/CPF): ${naoAchados.map(r=>esc(r.nomeRaw)).join(", ")}</p>`:""}
   ${achados.length?`<button class="btn btn-a" style="margin-top:14px" onclick="confirmarImportacaoVale()">Aplicar em ${achados.length} funcionário(s)</button>`:""}
  `;
}

function mergeIntervalos(intervalos){
  const ordenados=intervalos.slice().sort((a,b)=>a[0]-b[0]);
  const juntos=[];
  ordenados.forEach(([s,e])=>{
    if(juntos.length&&s<=new Date(juntos[juntos.length-1][1].getTime()+MS)){
      if(e>juntos[juntos.length-1][1])juntos[juntos.length-1][1]=e;
    }else{
      juntos.push([s,e]);
    }
  });
  return juntos;
}
function relatorioHotelMes(hotelId,mesRefStr){
  if(!hotelId||!mesRefStr)return[];
  const hotel=DB.locais.find(l=>l.id===hotelId);
  const partes=mesRefStr.split("-").map(Number);
  const inicioMes=new Date(partes[0],partes[1]-1,1);
  const fimMes=new Date(partes[0],partes[1],0);
  const movs=DB.mov.filter(mv=>mv.tipo==="Hotel"&&mv.local===hotelId);
  const porQuarto={};
  movs.forEach(mv=>{
    const ini=pd(mv.entrada);if(!ini)return;
    const fimReal=mv.saida?pd(mv.saida):today();
    const s=ini>inicioMes?ini:inicioMes;
    const e=fimReal<fimMes?fimReal:fimMes;
    if(s>e)return;
    const key=mv.quarto||("_semquarto_"+mv.id);
    if(!porQuarto[key])porQuarto[key]={quarto:mv.quarto||"(sem quarto informado)",ocupantes:[],intervalos:[],diariaOverride:null};
    porQuarto[key].ocupantes.push({nome:funcNome(mv.func),entrada:mv.entrada,saida:mv.saida});
    porQuarto[key].intervalos.push([s,e]);
    if(mv.diaria)porQuarto[key].diariaOverride=+mv.diaria;
  });
  const diariaPadrao=+((hotel||{}).diaria)||0;
  return Object.values(porQuarto).map(q=>{
    const juntos=mergeIntervalos(q.intervalos);
    const noites=juntos.reduce((s,[a,b])=>s+diasEntre(a,b)+1,0);
    const diaria=q.diariaOverride!=null?q.diariaOverride:diariaPadrao;
    return{...q,noites,diaria,valor:+(noites*diaria).toFixed(2)};
  }).sort((a,b)=>a.quarto.localeCompare(b.quarto,"pt-BR"));
}

function salvarLocal(id){const nome=$("#l_n").value.trim();if(!nome){toast("Informe o nome.");return;}const o={id:id||uid(),tipo:$("#l_t").value,nome,endereco:$("#l_e").value.trim(),gestao:$("#l_gestao")?.value||"Indireto",empresaGestora:$("#l_empresa")?.value.trim()||"",contatoEmpresa:$("#l_contatoempresa")?.value.trim()||"",capacidade:$("#l_c")?.value,diaria:$("#l_d")?.value,lat:$("#l_lat").value.trim(),lng:$("#l_lng").value.trim(),itensLocal:_itensLocalTemp.slice(),obs:$("#l_o").value.trim()};if(id){const i=DB.locais.findIndex(x=>x.id===id);DB.locais[i]=o;}else DB.locais.push(o);save("locais");closeModal();render();toast("Local salvo.");}

/* ============ MAPA ============ */
function vMapa(){
  const locs=DB.locais.filter(l=>l.lat&&l.lng&&!isNaN(+l.lat)&&!isNaN(+l.lng));
  main.innerHTML=`<div class="head"><div><h1>Mapa</h1><p>Locais com coordenadas cadastradas — ajuda a organizar rotas de ônibus/micro-ônibus. Adicione lat/lng em Locais &amp; Rota pra aparecerem aqui.</p></div></div>
   ${locs.length?`<div class="panel" style="overflow:hidden"><div id="mapdiv" style="height:520px;width:100%"></div></div><p class="hint" style="padding:0 4px">🟢 Alojamento · 🔵 Hotel · 🟠 Ponto de coleta</p>`:`<div class="empty"><div class="big">🗺</div><p>Nenhum local com coordenadas ainda.</p><button class="btn btn-a" onclick="CUR='locais';buildNav();render()">Ir para Locais</button></div>`}`;
  if(!locs.length)return;
  setTimeout(()=>{
    if(_leafletMap){_leafletMap.remove();_leafletMap=null;}
    const map=L.map('mapdiv');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);
    const colors={"Alojamento":"#2f8f57","Hotel":"#2f6f8f","Ponto de coleta":"#c97f00"};
    const bounds=[];
    locs.forEach(l=>{
      const lat=+l.lat,lng=+l.lng;bounds.push([lat,lng]);
      const oc=ocupacao(l.id);const cap=+l.capacidade||0;
      const color=colors[l.tipo]||"#555";
      const icon=L.divIcon({className:'',html:`<div style="background:${color};width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 4px rgba(0,0,0,.4)"></div>`,iconSize:[16,16]});
      L.marker([lat,lng],{icon}).addTo(map).bindPopup(`<b>${esc(l.nome)}</b><br>${esc(l.tipo)}${l.tipo!=='Ponto de coleta'?` — ${oc}${cap?'/'+cap:''} pessoas`:''}<br><small>${esc(l.endereco||'')}</small>`);
    });
    if(bounds.length===1)map.setView(bounds[0],14);else map.fitBounds(bounds,{padding:[30,30]});
    _leafletMap=map;
  },50);
}

const TIPOS_VEIC=["Micro-ônibus","Ônibus","Strada","Carro pequeno","Camionete 4x4","Outro"];
function vehIcon(tipo){return {"Micro-ônibus":"🚐","Ônibus":"🚌","Strada":"🛻","Carro pequeno":"🚗","Camionete 4x4":"🛻"}[tipo]||"🚗";}
function vVeiculos(){
  main.innerHTML=`<div class="head"><div><h1>Veículos & Rotas</h1><p>Frota, paradas em ordem e passageiros de cada rota. Ainda em mobilização — edite quando quiser.</p></div><button class="btn btn-a" onclick="formVeiculo()">＋ Novo veículo</button></div>

}
function veiculoCardHtml(v){
  const rotas=DB.rotas.filter(r=>r.veiculo===v.id);
  return `<div class="panel" style="margin:0"><h2><span class="t">${vehIcon(v.tipo)} ${esc(v.tipo)}${v.placa?" · "+esc(v.placa):""}</span><button class="btn btn-g btn-sm" onclick="formVeiculo('${v.id}')">Editar</button></h2>
   <div style="padding:12px 18px">
     <p class="break">Capacidade: <b>${esc(v.capacidade)||"—"}</b> lugares${v.motorista?" · Motorista: <b>"+esc(v.motorista)+"</b>":""}</p>
     <div style="margin:12px 0">${rotas.length?rotas.map(r=>rotaResumoHtml(r,v)).join(""):'<p class="hint">Nenhuma rota ainda.</p>'}</div>

}
function rotaResumoHtml(r,v){
  const cap=+v.capacidade||0,oc=r.passageiros.length;
  return `<div style="border:1px solid #e6e8e4;border-radius:9px;padding:10px 12px;margin-bottom:8px">
   <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>${esc(r.nome||"Sem nome")}</b><span class="tag t-steel">${esc(r.turno)}</span></div>
   <div class="break" style="margin-top:4px">${r.paradas.length?r.paradas.map((p,i)=>`${i+1}. ${esc(localNome(p.local))}${p.horario?" ("+p.horario+")":""}`).join(" → "):"sem paradas cadastradas"}</div>
   <div style="margin-top:6px;font-size:13px">Passageiros: <b>${oc}</b>${cap?"/"+cap:""} ${cap&&oc>cap?'<span class="tag t-red">acima da capacidade</span>':''}</div>
   <div style="margin-top:8px"><button class="btn btn-g btn-sm" onclick="formRota('${v.id}','${r.id}')">Editar rota</button></div></div>`;

function formVeiculo(id){
  const v=id?DB.veiculos.find(x=>x.id===id):{tipo:"Micro-ônibus"};
  openModal(`<div class="modal-h"><h3>${id?"Editar":"Novo"} veículo</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-b">
   <div class="row2"><div class="fg"><label>Tipo *</label><select id="v_tipo">${TIPOS_VEIC.map(t=>`<option ${v.tipo===t?"selected":""}>${t}</option>`).join("")}</select></div><div class="fg"><label>Placa</label><input id="v_placa" value="${esc(v.placa)}"></div></div>
   <div class="row2"><div class="fg"><label>Capacidade (lugares) *</label><input type="number" id="v_cap" value="${esc(v.capacidade)}"></div><div class="fg"><label>Motorista / responsável</label><input id="v_mot" value="${esc(v.motorista)}"></div></div>

   <div class="modal-f">${id?`<button class="btn btn-g" style="margin-right:auto;color:var(--red)" onclick="delVeiculo('${id}')">Excluir</button>`:""}<button class="btn btn-g" onclick="closeModal()">Cancelar</button><button class="btn btn-a" onclick="salvarVeiculo('${id||""}')">Salvar</button></div>`);

function salvarVeiculo(id){
  const cap=$("#v_cap").value;if(!cap){toast("Informe a capacidade.");return;}
  const o={id:id||uid(),tipo:$("#v_tipo").value,placa:$("#v_placa").value.trim(),capacidade:cap,motorista:$("#v_mot").value.trim(),obs:$("#v_obs").value.trim()};
  if(id){const i=DB.veiculos.findIndex(x=>x.id===id);DB.veiculos[i]=o;}else DB.veiculos.push(o);

function delVeiculo(id){if(!confirm("Excluir este veículo? As rotas dele também serão excluídas."))return;DB.veiculos=DB.veiculos.filter(x=>x.id!==id);DB.rotas=DB.rotas.filter(x=>x.veiculo!==id);save("veiculos");save("rotas");closeModal();render();toast("Excluído.");}

let _rotaEdit=null,_rotaBusca="";
function formRota(veiculoId,rotaId){
  if(!DB.locais.length){toast("Cadastre ao menos um local (Locais/Rota) antes.");return;}
  const r=rotaId?DB.rotas.find(x=>x.id===rotaId):{veiculo:veiculoId,nome:"",turno:"Manhã",paradas:[],passageiros:[]};
  _rotaEdit=JSON.parse(JSON.stringify(r));_rotaEdit._id=rotaId||"";_rotaBusca="";
  if(!_rotaEdit.paradas)_rotaEdit.paradas=[];if(!_rotaEdit.passageiros)_rotaEdit.passageiros=[];
  const v=DB.veiculos.find(x=>x.id===_rotaEdit.veiculo);
  openModal(`<div class="modal-h"><h3>${_rotaEdit._id?"Editar":"Nova"} rota — ${esc(v?v.tipo:"")}${v&&v.placa?" "+esc(v.placa):""}</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-b" id="rt_body">${rotaBodyHtml()}</div>
   <div class="modal-f">${_rotaEdit._id?`<button class="btn btn-g" style="margin-right:auto;color:var(--red)" onclick="delRota('${_rotaEdit._id}')">Excluir rota</button>`:""}<button class="btn btn-g" onclick="closeModal()">Cancelar</button><button class="btn btn-a" onclick="salvarRota()">Salvar</button></div>`);

}

    <div class="fg"><label>Turno</label><select id="rt_turno">${["Manhã","Tarde","Noite","Sob demanda"].map(t=>`<option ${_rotaEdit.turno===t?"selected":""}>${t}</option>`).join("")}</select></div></div>
   <div class="sub">Paradas (na ordem em que o veículo passa)</div>
   <div class="row3" style="align-items:end">
     <div class="fg" style="grid-column:span 2"><label>Local</label><select id="rt_novoLocal">${DB.locais.map(l=>`<option value="${l.id}">${esc(l.nome)} (${esc(l.tipo)})</option>`).join("")}</select></div>

   <div class="sub">Passageiros <span style="text-transform:none;font-weight:400;color:var(--muted)">— ${oc}${cap?"/"+cap:""}${cap&&oc>cap?' <b style="color:var(--red)">acima da capacidade</b>':""}</span></div>
   <input type="search" id="rt_buscaFunc" value="${esc(_rotaBusca)}" placeholder="Buscar funcionário..." style="width:100%;padding:9px 12px;border:1px solid #d5d9d3;border-radius:8px;margin-bottom:10px" oninput="_rotaBusca=this.value;renderRotaPassList(this.value)">

function refreshRotaBody(){

/* ============ ABASTECIMENTO & COMBOIO ============ */
function estoqueComboio(){
  const entradas=DB.abastecimentos.filter(a=>a.movimento==="Entrada").reduce((s,a)=>s+(+a.litros||0),0);
  const saidasComboio=DB.abastecimentos.filter(a=>a.movimento==="Saída"&&a.fonte==="Comboio").reduce((s,a)=>s+(+a.litros||0),0);
  return entradas-saidasComboio;
}
function destinoTxt(a){
  if(a.tag)return esc(a.tag);
  if(a.destinoTipo==="Veículo"){const v=DB.veiculos.find(x=>x.id===a.destinoVeiculo);return v?`${vehIcon(v.tipo)} ${esc(v.tipo)}${v.placa?" "+esc(v.placa):""}`:"—";}
  if(a.destinoMaquina)return `⚙ ${esc(a.destinoMaquina)}`;
  return "—";
}
function consumoPorEquipamento(){
  const porTag={};
  DB.abastecimentos.filter(a=>a.movimento==="Saída"&&a.tag).forEach(a=>{
    const tag=a.tag;
    if(!porTag[tag])porTag[tag]={tag,litros:0,qtd:0,horimetros:[],ultimaData:""};
    porTag[tag].litros+=+a.litros||0;
    porTag[tag].qtd++;
    if(a.horimetroEquip&&!isNaN(+a.horimetroEquip))porTag[tag].horimetros.push({h:+a.horimetroEquip,data:a.data});
    if(!porTag[tag].ultimaData||a.data>porTag[tag].ultimaData)porTag[tag].ultimaData=a.data;
  });
  return Object.values(porTag).map(t=>{
    let consumoMedio=null,horasRodadas=null;
    if(t.horimetros.length>=2){
      const sorted=t.horimetros.slice().sort((a,b)=>a.h-b.h);
      horasRodadas=+(sorted[sorted.length-1].h-sorted[0].h).toFixed(1);
      if(horasRodadas>0)consumoMedio=+(t.litros/horasRodadas).toFixed(2);
    }
    return{...t,consumoMedio,horasRodadas};
  }).sort((a,b)=>b.litros-a.litros);
}

function salvarImportarVagas(){
  const texto=$("#vg_bulk").value;
  const linhas=texto.split("\n").map(l=>l.trim()).filter(Boolean);

  linhas.forEach(linha=>{

    const qtd=+((partes[1]||"").trim())||0;
    if(!funcao)return;
    const existente=DB.vagas.find(x=>x.funcao.toLowerCase()===funcao.toLowerCase());
    if(existente){existente.quantidadeTotal=qtd;atualizadas++;}
    else{DB.vagas.push({id:uid(),funcao,quantidadeTotal:qtd,obs:""});criadas++;}
  });
  save("vagas");closeModal();render();toast(`${criadas} vaga(s) criada(s), ${atualizadas} atualizada(s).`);

/* ============ COMPRAS: helpers ============ */
const DIAS_SEMANA=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const STATUS_FLUXO=["Solicitado","Aprovado pelo engenheiro","Pedido feito","Nota fiscal gerada","Finalizado"];
const MAPA_STATUS_ANTIGO={"Ordem de compra gerada":"Pedido feito","Chegou na obra":"Pedido feito","Enviado para pagamento":"Nota fiscal gerada","Pago":"Finalizado"};
function fluxoNovoAPartirDe(){return DB.cfg.fluxoNovoAPartirDe||"2026-08-18";}
function pedidoAntigo(p){return !p.fluxoNovo&&!!p.data&&p.data<fluxoNovoAPartirDe();}
function pedidoEncerrado(p){return p.status==="Finalizado"||pedidoAntigo(p);}
function reabrirPedidoAntigo(id){
  if(!confirmarSenhaSalvar())return;
  const p=DB.compras_pedidos.find(x=>x.id===id);if(!p)return;
  if(!confirm("Reabrir esse pedido no fluxo novo? Ele volta a gerar alerta de nota fiscal e a seguir as etapas."))return;
  p.fluxoNovo=true;
  if(p.status==="Finalizado"){
    const volta=(p.statusAntesDeFinalizar&&p.statusAntesDeFinalizar!=="Finalizado")?p.statusAntesDeFinalizar:"Nota fiscal gerada";
    p.status=volta;(p.statusHistorico=p.statusHistorico||[]).push({status:volta,data:iso(today())});
  }
  save("compras_pedidos");closeModal();render();toast("Pedido reaberto no fluxo novo.");
}
function migrarFluxoPedidos(){
  let mudou=false;
  DB.compras_pedidos.forEach(p=>{
    const novo=MAPA_STATUS_ANTIGO[p.status];
    if(!novo)return;
    let alvo=novo;
    if(p.status==="Chegou na obra"&&DB.compras_notas.some(n=>n.pedido===p.id))alvo="Nota fiscal gerada";
    p.statusAnterior=p.status;p.status=alvo;mudou=true;
  });
  /* uma única vez: pedidos anteriores a 18/08 ficam Finalizados; os próximos seguem o fluxo novo.
     Só roda com os dados da nuvem já carregados, pra não marcar "feito" antes de ver os pedidos de verdade. */
  if(!DB.cfg.pedidosFinalizadosAte&&(!SUPA.url||_nuvemOk===true)){
    const corte=iso(today()).slice(0,4)+"-08-18";
    const n=finalizarPedidosAnterioresA(corte);
    DB.cfg.pedidosFinalizadosAte=corte;save("cfg");

const _UN_ITEM="unidades?|unid\\.?|und\\.?|un\\.?|p[cç]s?\\.?|pe[cç]as?|cx\\.?|caixas?|kg|mts?\\.?|metros?|m|l|lts?\\.?|litros?|rolos?|pares?|jogos?|sacos?|latas?|gal[oõ]es|barras?|kits?";
function _normUn(u){u=String(u||"").toLowerCase().replace(/\./g,"");if(/^(un|und|unid|unidade|unidades)$/.test(u))return"un";if(/^(p[cç]s?|pe[cç]as?)$/.test(u))return"pç";if(/^(cx|caixas?)$/.test(u))return"cx";if(/^(mts?|metros?|m)$/.test(u))return"m";if(/^(l|lts?|litros?)$/.test(u))return"l";return u;}
function parsearItensDeTexto(txt){
  const out=[];const U="("+_UN_ITEM+")";
  String(txt||"").split(/\r?\n/).forEach(raw=>{
    let l=raw.replace(/[\u200e\u200f\u202a-\u202e]/g,"").trim();
    l=l.replace(/^[\s•·●▪▫◦✅✔☑✓\-–—*]+/u,"").trim();
    if(!l)return;
    l=l.replace(/^\[\d{1,2}[^\]]*\]\s*[^:]{1,40}:\s*/,"").trim();
    if(!l)return;
    let qtd="",un="",nome=l,m;
    if((m=l.match(/^(\d+(?:[.,]\d+)?)\s*(?:x|×)\s*(.+)$/i))){qtd=m[1];nome=m[2];}
    else if((m=l.match(new RegExp("^(\\d+(?:[.,]\\d+)?)\\s*"+U+"?\\s*[-–—:)]\\s*(.+)$","i")))){qtd=m[1];un=m[2]||"";nome=m[3];}
    else if((m=l.match(new RegExp("^(\\d+(?:[.,]\\d+)?)\\s*"+U+"\\s+(.+)$","i")))){qtd=m[1];un=m[2];nome=m[3];}
    else if((m=l.match(new RegExp("^(.+?)\\s*[-–—:]\\s*(\\d+(?:[.,]\\d+)?)\\s*"+U+"?\\s*$","i")))){nome=m[1];qtd=m[2];un=m[3]||"";}
    else if((m=l.match(/^(\d{1,4})\s+(\D.*)$/))){qtd=m[1];nome=m[2];}
    else if((m=l.match(/^\d+\s*[.)]\s+(.+)$/))){nome=m[1];}
    nome=nome.trim().replace(/^[-–—:\s]+/,"").replace(/[\s;,.]+$/,"");
    if(!nome)return;
    out.push({id:uid(),codigo:"",nome,categoria:"",ca:"",quantidade:(qtd||"1").replace(",","."),unidade:_normUn(un),valorUnitario:""});
  });
  return out;
}

function salvarLancamentoDireto(){
  const setor=$("#ld_setor").value,data=$("#ld_data").value,lancadoPor=$("#ld_lancadopor").value.trim();
  if(!setor||!data){toast("Preencha setor e data.");return;}
  if(!lancadoPor){toast("Informe quem está lançando.");return;}
  const notaExistId=$("#ld_notaexist")?$("#ld_notaexist").value:"";
  let fornecedor=$("#ld_forn").value.trim();
  if(!fornecedor&&notaExistId){const nn=DB.compras_notas.find(x=>x.id===notaExistId);fornecedor=nn?(nn.fornecedor||""):"";}
  const regul=$("#ld_origem").value==="Via regularização"&&!notaExistId;
  if(regul){
    if(!fornecedor){toast("Via regularização: informe o fornecedor.");return;}
    if(!$("#ld_desc").value.trim()&&!$("#ld_itens").value.trim()){toast("Via regularização: descreva os itens (pode colar a mensagem).");return;}
    if(!$("#ld_nfnum").value.trim()||!$("#ld_nfvalor").value){toast("Via regularização vai direto pra pagamento: preencha número e valor da nota.");return;}
    if(!$("#ld_nfprazo").value||!$("#ld_nfforma").value){toast("Preencha o vencimento e a forma de pagamento da nota.");return;}
  }
  const temNota=!notaExistId&&(regul||$("#ld_temnota").checked);
  if(temNota&&(!$("#ld_nfnum").value.trim()||!$("#ld_nfvalor").value)){toast("Preencha número e valor da nota, ou desmarca a opção de já ter nota.");return;}
  if(temNota){
    const dup=nfDuplicada($("#ld_nfnum").value.trim(),fornecedor);
    if(dup.mesma){toast("🚫 A NF "+$("#ld_nfnum").value.trim()+" desse fornecedor já foi lançada (emissão "+fmt(dup.mesma.dataEmissao)+"). Não dá pra lançar duas vezes.");return;}
  }
  const dados={setor,data,lancadoPor,fornecedor,regul,notaExistId,itens:parsearItensDeTexto($("#ld_itens").value),desc:$("#ld_desc").value.trim(),ocnum:$("#ld_ocnum").value.trim(),origem:$("#ld_origem").value,tipoaq:$("#ld_tipoaq").value,fluignum:$("#ld_fluignum").value.trim(),fluiglink:$("#ld_fluiglink").value.trim(),obs:$("#ld_obs").value.trim(),
    temNota,nfnum:$("#ld_nfnum").value.trim(),nfvalor:$("#ld_nfvalor").value,nffluignum:$("#ld_nffluignum").value.trim(),nffluiglink:$("#ld_nffluiglink").value.trim(),nfemissao:$("#ld_nfemissao").value,nfprazo:$("#ld_nfprazo").value,nfforma:$("#ld_nfforma").value};
  if(fornecedor&&!DB.compras_fornecedores.some(f=>f.nome.toLowerCase()===fornecedor.toLowerCase())){
    if(confirm('O fornecedor "'+fornecedor+'" ainda não está cadastrado. Cadastrar agora?')){
      window._ldPendenteSalvar=dados;
      formFornecedor();
      setTimeout(()=>{const ne=$("#fo_nome");if(ne)ne.value=fornecedor;},50);
      return;
    }
  }
  concluirSalvarLancamentoDireto(dados);
}
function concluirSalvarLancamentoDireto(d){

  if(d.notaExistId){const nx=DB.compras_notas.find(x=>x.id===d.notaExistId);if(nx){nx.pedido=o.id;nx.ordemCompraId=ocId;save("compras_notas");}}

    save("compras_notas");

  toast(d.notaExistId?"Lançamento criado e ligado à nota fiscal que já estava lançada.":d.regul?"Via regularização: lançamento criado e nota enviada direto pra pagamento.":d.temNota?"Lançamento e nota fiscal criados.":"Lançamento criado. Completa a nota fiscal quando ela chegar.");
}

function salvarVinculoNotas(pid){
  const p=DB.compras_pedidos.find(x=>x.id===pid);if(!p)return;
  const marcados=[...document.querySelectorAll("#vn_lista .vn_chk:checked")].map(i=>i.value);
  const ocSel=$("#vn_oc")?$("#vn_oc").value:"";
  const novas=marcados.map(id=>DB.compras_notas.find(n=>n.id===id)).filter(n=>n&&n.pedido!==p.id);
  const remover=DB.compras_notas.filter(n=>n.pedido===p.id&&!marcados.includes(n.id));
  if(!novas.length&&!remover.length){closeModal();return;}
  if(novas.length&&["Solicitado","Aprovado pelo engenheiro"].includes(p.status)&&!confirm('Esse pedido ainda está em "'+p.status+'". Vincular a nota vai marcá-lo como "Nota fiscal gerada" (pula as etapas). Continuar?'))return;
  remover.forEach(n=>{n.pedido="";n.ordemCompraId="";});
  novas.forEach(n=>{
    const ocs=p.ordensCompra||[];let ocId=ocSel;
    if(!ocId){
      if(ocs.length===1)ocId=ocs[0].id;
      else if(!ocs.length)ocId=_ocMinimaDaNota(p,n).id;
      else ocId=(ocs.find(o=>normalizaNome(o.fornecedor||"")===normalizaNome(n.fornecedor||""))||ocs[0]).id;
    }
    n.pedido=p.id;n.ordemCompraId=ocId;
  });
  if(novas.length&&["Solicitado","Aprovado pelo engenheiro","Pedido feito"].includes(p.status)){
    p.status="Nota fiscal gerada";if(!p.pedidoFeitoData)p.pedidoFeitoData=iso(today());
    (p.statusHistorico=p.statusHistorico||[]).push({status:"Nota fiscal gerada",data:iso(today())});
  }else if(remover.length&&!novas.length&&p.status==="Nota fiscal gerada"&&!DB.compras_notas.some(n=>n.pedido===p.id)&&(p.ordensCompra||[]).some(o=>o.fornecedor)){
    p.status="Pedido feito";(p.statusHistorico=p.statusHistorico||[]).push({status:"Pedido feito",data:iso(today())});
  }
  save("compras_notas");save("compras_pedidos");closeModal();render();
  toast((novas.length?novas.length+" nota(s) vinculada(s). ":"")+(remover.length?remover.length+" vínculo(s) desfeito(s).":""));
}

function liberarExcecao(id){
  if(!confirmarSenhaSalvar())return;
  if(!confirmarPermissaoArea("compras","Compras"))return;
  const obs=prompt("Observação da liberação (opcional):","");
  const p=DB.compras_pedidos.find(x=>x.id===id);
  p.excecaoLiberada=true;p.excecaoLiberadaData=iso(today());p.excecaoLiberadaObs=obs||"";
  save("compras_pedidos");verPedido(id);toast("Exceção liberada.");
}
function avancarStatus(id){
  const p=DB.compras_pedidos.find(x=>x.id===id);
  const idxAtual=STATUS_FLUXO.indexOf(p.status);
  if(p.foraDoDia&&!p.excecaoLiberada&&p.status==="Solicitado"){toast("Libere a exceção antes de avançar.");return;}
  const proximo=STATUS_FLUXO[idxAtual+1];
  if(proximo==="Aprovado pelo engenheiro"){closeModal();formAprovacaoEngenheiro(id);return;}
  if(proximo==="Pedido feito"){
    const oc=(p.ordensCompra||[]).find(o=>o.fornecedor);
    if(!oc){closeModal();formPedidoFeito(id);return;}
    marcarPedidoFeito(p,oc.dataCriacao||iso(today()));
    save("compras_pedidos");closeModal();render();
    toast("Pedido feito — ficou o aviso de nota fiscal sem lançamento em Notas Fiscais.");
    return;
  }
  if(proximo==="Nota fiscal gerada"&&!DB.compras_notas.some(n=>n.pedido===p.id)){
    if(!confirm("Esse pedido ainda não tem nota fiscal lançada em Notas Fiscais. Avançar mesmo assim?"))return;
  }
  p.status=proximo;(p.statusHistorico=p.statusHistorico||[]).push({status:proximo,data:iso(today())});
  save("compras_pedidos");closeModal();render();toast("Status atualizado.");
}
function marcarPedidoFeito(p,data){
  p.status="Pedido feito";p.pedidoFeitoData=data;
  (p.statusHistorico=p.statusHistorico||[]).push({status:"Pedido feito",data});
  (p.ordensCompra||[]).forEach(o=>{if(!o.prazoNotaFiscal)o.prazoNotaFiscal=iso(new Date(pd(data).getTime()+(DB.cfg.prazoNotaFiscalDias||5)*MS));});

const CATEGORIAS_ESTOQUE=["EPI","Uniforme","Material de escritório","Alojamento","Ferramentas","Limpeza","Meio Ambiente","Segurança","Material de obra","Outro"];
function categoriasAprovadas(){return[...new Set([...CATEGORIAS_ESTOQUE,...(DB.cfg.categoriasExtras||[])])].sort((a,b)=>a.localeCompare(b,"pt-BR"));}
function categoriasPendentes(){return DB.cfg.categoriasPendentes||[];}
function solicitarCategoriaNova(nomeDigitado,callback){
  const nome=(nomeDigitado||"").trim();
  if(!nome)return;
  const aprovadas=categoriasAprovadas().map(c=>c.toLowerCase());
  if(aprovadas.includes(nome.toLowerCase())){if(callback)callback(nome);return;}
  const pendentes=categoriasPendentes();
  if(pendentes.some(p=>p.nome.toLowerCase()===nome.toLowerCase())){toast('Categoria "'+nome+'" já está pendente de aprovação do almoxarife.');if(callback)callback(nome);return;}
  if(!confirm('"'+nome+'" ainda não é uma categoria aprovada. Enviar pra aprovação do almoxarife? (fica pendente até ele aprovar, mas você já pode usar aqui)'))return;
  DB.cfg.categoriasPendentes=[...pendentes,{nome,data:iso(today())}];
  save("cfg");
  toast('Categoria "'+nome+'" enviada pra aprovação.');
  if(callback)callback(nome);
}
function vCategoriasPendentes(){
  const pend=categoriasPendentes();
  openModal(`<div class="modal-h"><h3>Categorias pendentes de aprovação</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-b">
   ${pend.length?pend.map((p,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f2f3f1"><span style="flex:1"><b>${esc(p.nome)}</b> <small class="hint">(sugerida em ${fmt(p.data)})</small></span><button class="btn btn-a btn-sm" onclick="aprovarCategoriaPendente(${i})">✓ Aprovar</button><button class="btn btn-g btn-sm" style="color:var(--red)" onclick="rejeitarCategoriaPendente(${i})">Rejeitar</button></div>`).join(""):'<p class="hint">Nenhuma categoria pendente.</p>'}
   </div><div class="modal-f"><button class="btn btn-g" onclick="closeModal()">Fechar</button></div>`);
}
function aprovarCategoriaPendente(i){
  const pend=categoriasPendentes();const item=pend[i];if(!item)return;
  DB.cfg.categoriasExtras=[...(DB.cfg.categoriasExtras||[]),item.nome];
  DB.cfg.categoriasPendentes=pend.filter((_,idx)=>idx!==i);
  save("cfg");vCategoriasPendentes();toast('Categoria "'+item.nome+'" aprovada.');
}
function rejeitarCategoriaPendente(i){
  const pend=categoriasPendentes();
  DB.cfg.categoriasPendentes=pend.filter((_,idx)=>idx!==i);
  save("cfg");vCategoriasPendentes();toast("Rejeitada.");
}

function notasDaOC(pedidoId,ocOuId,temUmaSoOC){
  const ocId=(ocOuId&&typeof ocOuId==="object")?ocOuId.id:ocOuId;
  return DB.compras_notas.filter(n=>(n.ordemCompraId&&n.ordemCompraId===ocId)||(!n.ordemCompraId&&temUmaSoOC&&n.pedido===pedidoId));
}
function estagioNotas(notas){
  if(!notas.length)return{stage:"Sem nota",cls:"t-red",notas};
  if(notas.find(n=>n.dataRealizada))return{stage:"Paga",cls:"t-green",notas};
  if(notas.find(n=>n.lancado))return{stage:"Enviada p/ pagamento",cls:"t-steel",notas};
  return{stage:"Nota lançada, aguardando envio",cls:"t-amber",notas};
}
function linhaRegularizacao(notas,p){
  const est=estagioNotas(notas);
  const valor=notas.reduce((s,n)=>s+(+n.valor||0),0);
  const naoPagas=notas.filter(n=>!n.dataRealizada&&n.dataPrevista);
  const vencimento=naoPagas.length?naoPagas.slice().sort((a,b)=>a.dataPrevista.localeCompare(b.dataPrevista))[0].dataPrevista:"";
  const vencido=!!vencimento&&pd(vencimento)<today();
  const vencendoEmBreve=!!vencimento&&!vencido&&diasEntre(today(),pd(vencimento))<=(DB.cfg.alertaVencimentoDias||10);
  const n0=notas[0]||{};
  return{pedidoId:p?p.id:"",notaId:n0.id||"",setor:p?setorNome(p.setor):"—",data:p?p.data:(n0.dataEmissao||""),fornecedor:n0.fornecedor||"?",origem:"Via regularização",ocNumero:"—",ocFluig:"",ocFluigLink:"",stage:est.stage,cls:est.cls,valor,notas,vencimento,vencendoEmBreve,vencido};
}
function estagioOC(pedidoId,oc,temUmaSoOC){
  const notas=notasDaOC(pedidoId,oc,temUmaSoOC);
  if(!notas.length)return{stage:"Sem nota",cls:"t-red",notas};
  const paga=notas.find(n=>n.dataRealizada);
  if(paga)return{stage:"Paga",cls:"t-green",notas};
  const enviada=notas.find(n=>n.lancado);
  if(enviada)return{stage:"Enviada p/ pagamento",cls:"t-steel",notas};
  return{stage:"Nota lançada, aguardando envio",cls:"t-amber",notas};
}
function linhasLancamentos(){
  const linhas=[];
  DB.compras_pedidos.forEach(p=>{
    if(pedidoAntigo(p)&&!DB.compras_notas.some(n=>n.pedido===p.id))return;
    const ocs=p.ordensCompra||[];
    if(!ocs.length&&p.viaRegularizacao){linhas.push(linhaRegularizacao(DB.compras_notas.filter(n=>n.pedido===p.id),p));return;}
    if(!ocs.length){
      if(["Aprovado pelo engenheiro","Pedido feito","Nota fiscal gerada"].includes(p.status)){
        linhas.push({pedidoId:p.id,setor:setorNome(p.setor),data:p.data,fornecedor:"—",origem:"—",ocNumero:"—",ocFluig:"",ocFluigLink:"",stage:"OC ainda não gerada",cls:"t-red",valor:0,notas:[],vencimento:"",vencendoEmBreve:false,vencido:false});
      }
      return;
    }
    ocs.forEach(oc=>{
      const est=estagioOC(p.id,oc,ocs.length===1);
      const valor=est.notas.reduce((s,n)=>s+(+n.valor||0),0);
      const naoPagas=est.notas.filter(n=>!n.dataRealizada&&n.dataPrevista);
      const vencimento=naoPagas.length?naoPagas.sort((a,b)=>a.dataPrevista.localeCompare(b.dataPrevista))[0].dataPrevista:"";
      const vencido=vencimento&&pd(vencimento)<today();
      const vencendoEmBreve=vencimento&&!vencido&&diasEntre(today(),pd(vencimento))<=(DB.cfg.alertaVencimentoDias||10);
      linhas.push({pedidoId:p.id,setor:setorNome(p.setor),data:p.data,fornecedor:oc.fornecedor||"—",origem:oc.origemCompra||"Suprimentos",ocNumero:oc.numero||"(s/nº)",ocFluig:oc.numeroFluig||"",ocFluigLink:oc.linkFluig||"",stage:est.stage,cls:est.cls,valor,notas:est.notas,vencimento,vencendoEmBreve,vencido});
    });
  });
  DB.compras_notas.filter(n=>n.viaRegularizacao&&!n.pedido).forEach(n=>linhas.push(linhaRegularizacao([n],null)));
  return linhas;
}

function renderAlmoxarifado(){

  if(_estFiltroCat)list=list.filter(it=>it.categoria===_estFiltroCat);
  if(!list.length){el.innerHTML=`<div class="empty"><div class="big">📦</div><p>Nenhum item encontrado.</p><button class="btn btn-a" onclick="formEstoque()">Cadastrar o primeiro</button></div>`;return;}
  const porCat={};
  list.forEach(it=>{const cat=it.categoria||"Sem categoria";(porCat[cat]=porCat[cat]||[]).push(it);});
  const catsOrdenadas=Object.keys(porCat).sort();
  el.innerHTML=catsOrdenadas.map(cat=>{

function salvarEstoque(id){
  const nome=$("#es_nome").value.trim();if(!nome){toast("Informe o nome.");return;}
  const dup=DB.compras_estoque.find(x=>x.nome.toLowerCase()===nome.toLowerCase()&&x.id!==id);
  if(dup){toast('Já existe um item cadastrado com esse nome ("'+dup.nome+'") — edita ele em vez de duplicar.');return;}
  const unidade=$("#es_unid").value.trim();
  if(unidade&&/^\d+$/.test(unidade)){if(!confirm('A unidade está como apenas o número "'+unidade+'" — geralmente isso é engano (deveria ser "un", "par", "cx"...). Salvar assim mesmo?'))return;}
  const categoria=$("#es_cat").value.trim();
  const finalizarSalvarEstoque=()=>{
    const o={id:id||uid(),nome,foto:_fotoItemTemp,categoria,unidade,quantidadeAtual:$("#es_qtd").value||0,quantidadeMinima:$("#es_min").value||0,obs:$("#es_obs").value.trim()};
    if(id){const i=DB.compras_estoque.findIndex(x=>x.id===id);DB.compras_estoque[i]=o;}else DB.compras_estoque.push(o);
    save("compras_estoque");closeModal();render();toast("Item salvo.");
  };
  if(categoria&&!categoriasAprovadas().some(c=>c.toLowerCase()===categoria.toLowerCase())){solicitarCategoriaNova(categoria,finalizarSalvarEstoque);}else{finalizarSalvarEstoque();}
}
